  blog: personal/daily-puzzle
card:
  name: Daily puzzle
  problem: A daily game needs writing, checking, grading and scoring every day, and AI puzzles are often ambiguous
  pattern: Multi-agent (generator + blind solver)
  stack: FastAPI, HTMX, APScheduler, SQLite, Ollama, Resend
