site_name: Ruairi Powers — AI Workflow Portfolio
site_url: !ENV [PORTFOLIO_SITE_URL, 'http://localhost:8000/']   # set by the site workflow from the repo owner
site_author: Ruairi Powers
site_description: Governed AI agent and workflow examples for investment firms, each with a runnable repo.
docs_dir: site
site_dir: build

theme:
  name: material
  custom_dir: overrides          # announcement bar → release notes
  features: [navigation.tabs, navigation.sections, content.code.copy, navigation.top, announce.dismiss]
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      toggle: {icon: material/brightness-4, name: Light mode}

plugins:
  - search
  - tags                         # each post's keywords (front-matter tags) shown at the top of the post
  - blog:
      blog_dir: blog
      post_url_format: "{slug}"
      post_excerpt: required
      categories: false          # topics: front-matter `categories`, shown on each post and filtered on the blog page
      archive: false
      pagination_per_page: 50
  - blog:                        # personal projects: a separate blog, so they stay out of the main one
      blog_dir: personal
      post_url_format: "{slug}"
      post_excerpt: required
      categories: false
      archive: false
  - blog:                        # classes: course write-ups and coursework
      blog_dir: classes
      post_url_format: "{slug}"
      post_excerpt: required
      categories: false
      archive: false

extra_css:
  - assets/portfolio.css
extra_javascript:
  - assets/blog-filter.js

hooks:
  - scripts/mkdocs_hooks.py

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: ["."]          # repo root: posts include governance/ and projects/*/docs/
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - AI Governance: blog/governance/
  - Projects:
      - Industry projects: projects/index.md
      - Personal projects: personal/index.md
  - Blog: blog/index.md
  - Classes: classes/index.md
  - Technologies: tech/index.md
  - Release notes: release-notes/index.md
  - About: about.md

validation:
  nav:
    not_found: info      # nav links to blog post URLs (blog/governance/) which the blog plugin generates
