# Weekly pull requests for dependency updates. Each one runs CI like any other change, and the demo machine only
# deploys it after you merge and the checks pass. Security updates arrive as soon as GitHub knows about them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups: {actions: {patterns: ["*"]}}
  - package-ecosystem: pip
    directories: ["/projects/altdata-triage", "/projects/eod-heartbeat", "/projects/governance-console",
                  "/projects/research-qa-rag", "/projects/site-assistant", "/projects/trade-ops-exceptions", "/"]
    schedule: {interval: weekly}
    groups: {python: {patterns: ["*"], update-types: [minor, patch]}}
  - package-ecosystem: npm
    directory: /projects/trade-ops-exceptions/mcp-server
    schedule: {interval: weekly}
    groups: {node: {patterns: ["*"], update-types: [minor, patch]}}
    ignore:                    # majors are deliberate changes: TypeScript 7 is a rewrite; types track the Node we run (22 LTS)
      - {dependency-name: typescript, update-types: ["version-update:semver-major"]}
      - {dependency-name: "@types/node", update-types: ["version-update:semver-major"]}
  - package-ecosystem: docker
    directories: ["/projects/altdata-triage", "/projects/eod-heartbeat", "/projects/governance-console",
                  "/projects/research-qa-rag", "/projects/site-assistant", "/projects/trade-ops-exceptions"]
    schedule: {interval: weekly}
    ignore:                    # Node base images stay on an LTS line; moving to the next LTS is a deliberate change
      - {dependency-name: node, update-types: ["version-update:semver-major"]}
      # Python images move with the version CI tests on (3.11); upgrading Python is a deliberate change, not a bump
      - {dependency-name: python, update-types: ["version-update:semver-major", "version-update:semver-minor"]}
