# Tests every project on every push and pull request. The self-hosted demo machine (deploy/selfhost/update.sh)
# deploys a commit on main only after all its checks — these and the site build — have passed.
name: ci
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}
jobs:
  projects:
    runs-on: ubuntu-latest
    outputs: {list: "${{ steps.l.outputs.list }}"}
    steps:
      - uses: actions/checkout@v7
      - id: l   # every project with a pyproject.toml — a new project is tested with no change here
        run: echo "list=$(ls -d projects/*/pyproject.toml | cut -d/ -f2 | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
  test:
    needs: projects
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {project: "${{ fromJson(needs.projects.outputs.list) }}"}
    defaults: {run: {working-directory: "projects/${{ matrix.project }}"}}
    env: {GOVERNANCE_TELEMETRY: "off"}   # tests never report to a console
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev,ui]"
      - name: the demo image has every library the code imports (tests install extras the image doesn't)
        run: python ../../scripts/check_image_deps.py .
      - name: build the offline demo data (make all), if the project has it
        run: if grep -q '^all:' Makefile; then make all; fi
      - run: pytest -q
      - name: Node tests (MCP server), if any
        if: hashFiles(format('projects/{0}/mcp-server/package.json', matrix.project)) != ''
        run: cd mcp-server && npm ci && npm test
  security:
    # Repo-side security self-assessment (security/pentest.py --repo): secrets anywhere in git history, dependency
    # vulnerabilities, workflow and Dockerfile hygiene, and the generated compose stack's hardening. A critical or
    # high finding fails CI, so the demo machine won't deploy the commit. Live and host checks run weekly on the
    # machine itself and are emailed privately; they never appear in these public logs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}            # the secret scan reads every commit
      - uses: actions/setup-python@v7
        with: {python-version: "3.11"}
      - run: pip install pip-audit pyyaml pytest
      - run: python3 security/pentest.py --repo --strict --out /tmp/pentest.md --state /tmp/pentest.json
      - name: findings
        if: always()
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/pentest.json"))
          print(d["counts"])
          for f in d["findings"]:
              print(f"{f['severity']:>8}  {f['id']}  {f['title']}")
          PY
      - run: python3 -m pytest security/tests -q

