[project]
name = "lob-matching-engine"
version = "0.1.0"
description = "Rust price-time priority order book and matching engine, benchmarked, with governed surveillance-alert narratives"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "pandas>=2,<3",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
aws = ["boto3>=1.35"]
ui = ["streamlit>=1.45", "plotly>=5.20", "matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
lob-matching-engine = "lob_matching_engine.cli:main"

[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "lob_matching_engine._engine"
manifest-path = "rust/Cargo.toml"
features = ["python"]
profile = "release"

[tool.pytest.ini_options]
testpaths = ["tests"]
