# EVAL-03 / SEC-06: every push builds the Rust engine, runs the Rust and Python tests, the offline end-to-end run,
# the eval gate (mock model, zero cost) and a dependency scan.
name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: dtolnay/rust-toolchain@stable
      - run: cd rust && cargo test --release
      - run: pip install -e ".[ui,dev]" pip-audit
      - run: pytest -q
      - run: lob-matching-engine all && lob-matching-engine eval
      - run: lob-matching-engine bench --n 500000      # reported, not gated: shared runners are noisy
      - run: pip-audit --skip-editable || true          # report-only; make blocking once triaged
      - uses: actions/upload-artifact@v4
        with: {name: surveillance-output, path: output/}
  live-eval:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -e ".[anthropic]"
      - run: lob-matching-engine eval --alias narrative-candidate --baseline narrative-primary
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
