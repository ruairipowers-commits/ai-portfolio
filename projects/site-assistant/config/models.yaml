# Model registry: code asks for an alias, never a model ID (MODEL-01).
aliases:
  chat: local-chat
models:
  local-chat:
    provider: ollama
    model: gemma4:e4b               # override with OLLAMA_MODEL (+ OLLAMA_THINK); compare candidates with
                                    # deploy/selfhost/ollama-bench.sh on the machine that serves it
    think: false                    # reasoning models answer directly: far faster, and RAG answers don't need it
    approved: true
    priced: true                    # local: $0 per token
    usd_per_1k_input: 0.0
    usd_per_1k_output: 0.0
    deprecation_date: null
  extractive:
    provider: mock                  # offline fallback: quotes the best passages, no generation
    model: extractive-v1
    approved: true
    priced: true
    usd_per_1k_input: 0.0
    usd_per_1k_output: 0.0
    deprecation_date: null
