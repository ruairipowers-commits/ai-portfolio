# Course tags: industry, function and tech, filterable on the catalog and the tracker.
# Kept here, not in sources/tech/*.md, because `course sources` refreshes those from the site.
# Courses approved from a suggestion take the suggestion's tags (stored with the course row).
# The vocabulary matches JobHunt's skills taxonomy so a suggested course arrives already tagged; a tag outside
# it is still accepted (lowercase words and dashes) and shown.
vocabulary:
  industry:
  - capital-markets
  - asset-management
  - banking
  - fintech
  - insurance
  - healthcare
  - retail
  - government
  - technology
  function:
