[project]
name = "crash-course"
version = "0.1.0"
description = "Crash courses: learn a tool in 15 minutes, 1 hour or 4 hours, with server-scored quizzes, unlocked levels, a tracker, and new topics reviewed by an agent and approved by the owner"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "pyyaml>=6,<7",
  "pydantic>=2.6,<3",
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9",
  "markdown-it-py>=3,<5",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40", "pandas>=2.1"]
dev = ["pytest>=8", "streamlit>=1.40", "pandas>=2.1"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
aws = ["boto3>=1.34"]

[project.scripts]
course = "crash_course.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crash_course = ["templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:COURSE_SECRET not set"]
