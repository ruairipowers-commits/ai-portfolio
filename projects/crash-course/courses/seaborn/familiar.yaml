sections:
- id: concept
  heading: The big idea
  body: |
    **Matplotlib** is Python's base plotting library. It draws static charts — line, bar, scatter, histogram, heatmap and
    many more — and saves them as PNG, SVG or PDF. It controls every element of a figure: axes, ticks, labels, colours,
    layout. That power also makes it verbose for everyday charts.

    **seaborn** sits on top of Matplotlib for **statistical charts**. You give it a pandas DataFrame and column names, and
    it handles grouping, colouring by category and statistical summaries itself: `histplot`, `boxplot`, `countplot`,
    `heatmap` and `pairplot` each produce a finished chart in a line or two. Because a seaborn chart *is* a Matplotlib
    figure, you can still adjust it with Matplotlib calls.
- id: history
  heading: Where it came from and how it is used today
  body: |
    John D. Hunter created Matplotlib in 2003, modelling it on MATLAB's plotting so scientists could move to Python
    without losing their charts. Michael Waskom created seaborn around 2012 to make the common statistical plots of data
    analysis quick and good-looking by default. Both are open-source projects sponsored by NumFOCUS.

    Today they are the standard for static charts in Python notebooks, reports and papers. For interactive browser charts,
    people usually reach for Plotly or a JavaScript library instead.
- id: business
  heading: How it fits business users
  body: |
    Business users see the output: the distribution chart in an analysis, the confusion matrix in a model review, the
    figure in a slide. Charts are how most data problems are found **before** a model is trained — skewed distributions,
    outliers, missing values and correlated features jump out of a plot faster than a table.

    After training, a confusion matrix and a feature-importance chart explain a model's behaviour to people who will
    never read the code.
- id: use_cases
  heading: Key use cases
  body: |
    - **Distributions of each feature** during exploratory analysis.
    - **Correlation heatmaps.**
    - **Comparing a feature across classes** with box plots or grouped histograms.
    - **Confusion matrices and feature-importance charts** after training.
    - **Charts for reports and slides.**
- id: pros_cons
  heading: Pros and cons
  body: |
    | Pros | Cons |
    |---|---|
    | seaborn makes statistical charts from a DataFrame in one call | Static images; no built-in interactivity |
    | Matplotlib can control every detail of a figure | Matplotlib's API is verbose and has two styles |
    | Output to PNG, SVG and PDF for reports | Fine-tuning a seaborn chart still means learning Matplotlib |
    | Works in notebooks, scripts and CI | Large scatter plots get slow |
- id: resources
  heading: Where to learn more
  body: |
    - [seaborn documentation](https://seaborn.pydata.org/) — the official docs from the seaborn project; the tutorial and
      the example gallery are the best places to start.
    - [Matplotlib documentation](https://matplotlib.org/stable/) — the official docs from the Matplotlib project.
    - [Matplotlib quick start](https://matplotlib.org/stable/users/explain/quick_start.html) — figures, axes and the two
      API styles explained.
- id: hello_world
  heading: Hello world
  body: |
    The project below generates a synthetic loan dataset and draws a histogram of loan amount, coloured by whether the
    loan defaulted, then saves it as a PNG — one seaborn call plus a Matplotlib title.
- id: interview
  heading: Talking about it in an interview
  body: |
    - **"How do you explore a new dataset?"** Distributions of every feature, a correlation heatmap, and the key features
      split by the target class — then decide on cleaning.
    - **"seaborn or Matplotlib?"** seaborn for quick statistical charts from a DataFrame; Matplotlib when you need full
      control or a custom figure. They work together.
    - **"How would you explain a classifier to a business audience?"** A confusion matrix in plain words ("we caught 81% of
      defaults") and a feature-importance chart.

    Pitfall: charts with no title, units or labels. Say you'd always label for the reader who wasn't in the room.
project:
  title: A histogram by outcome
  kind: runnable
  minutes: 4
  goal: Draw a grouped histogram from a DataFrame and save it as an image.
  steps:
  - Run `pip install seaborn` (it installs Matplotlib, pandas and NumPy).
  - Save the code below as `hello_seaborn.py` and run it.
  - Open `loan_amount.png`; then change `histplot` to `boxplot(data=df, x="defaulted", y="loan_amount")` and run again.
  code: |
    import matplotlib.pyplot as plt
    import numpy as np
    import pandas as pd
    import seaborn as sns

    rng = np.random.default_rng(0)
    df = pd.DataFrame({
        "loan_amount": rng.lognormal(mean=9.8, sigma=0.4, size=500),
        "defaulted": rng.choice(["no", "yes"], size=500, p=[0.8, 0.2]),
    })
    ax = sns.histplot(data=df, x="loan_amount", hue="defaulted", bins=30, kde=True)
    ax.set_title("Loan amount by outcome")
    plt.tight_layout()
    plt.savefig("loan_amount.png", dpi=150)
  language: python
  expected: |
    loan_amount.png: overlapping histograms in two colours (no / yes) with smooth density
    curves, titled "Loan amount by outcome".
  done_when:
  - The PNG was written and shows two coloured groups.
  - You switched to a box plot by changing one call.
