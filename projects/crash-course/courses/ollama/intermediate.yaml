title: Ollama local models in production in 4 hours
status: draft
source:
  page: tech/ollama.md
  docs: https://docs.ollama.com/
provenance:
  written_by: Claude (build session, 3 Nov 2026), from the site's Ollama page and the Familiar level
sections:
- id: modules
  heading: How the four hours fit together
  body: |
    Beginner had you build a named variant and call it for structured output. This level is about the decisions
    that come next: which model fits the hardware, how to use the APIs properly, how to add local search, how to
    prove a local model is good enough, and how to run Ollama as a service other people rely on. Five modules, each
    with an exercise and a five-question check (pass mark 80%), then a 90-minute capstone and a final test.

    | Module | What you learn | Time |
    |---|---|---|
    | m1 Models, memory and hardware | sizes, quantization, context memory, CPU and GPU, reading `ollama ps` | 20 min |
    | m2 The APIs in depth | streaming, options, keep-alive, structured output, tools, the OpenAI-compatible endpoint | 20 min |
    | m3 Embeddings and local search | `/api/embed`, similarity, a small index, keeping data on the machine | 20 min |
    | m4 Evaluating local against hosted | aliases, golden sets, quality, latency and cost, a gate | 20 min |
    | m5 Running Ollama as a service | binding, auth in front, concurrency, Docker, updates, monitoring | 20 min |

    **Pacing.** m1 first: everything else depends on a model that fits. m2 and m3 can go in either order. m4 sets
    up the capstone. Pull two models before you start (a small and a medium one, such as `llama3.2:1b` and
    `llama3.2`), plus an embedding model for m3, so you can work offline.
- id: production
  heading: Running Ollama for real
  body: |
    Running a model locally moves the provider's job onto you: capacity, uptime, security and upgrades.

    **Security.**
    - The API has no authentication of its own. Keep it on localhost, or put a reverse proxy with authentication
      and TLS in front. Never expose port 11434 to the internet.
    - Restrict who can pull and create models on a shared server; a model is a large file from the internet.
    - Check each model's licence before commercial use, and record which model and tag each workload uses.

    **Capacity and scaling.**
    - Memory decides everything: the model's weights plus the memory for its context window, per loaded model.
    - Concurrency settings let one server handle several requests at once, but each extra parallel request costs
      context memory. Measure throughput under realistic load before promising a service level.
    - For more load, run more machines behind a load balancer; each one needs its own copy of the models.

    **Reliability.**
    - The first request after a model unloads pays the load time. Set keep-alive to match your traffic, or warm the
      model at start-up.
    - Health-check with `/api/version`, and check the model you need is listed in `/api/tags`.
    - Give callers a timeout and a fallback (another alias, a rules-based mock, or a clear error), so an overloaded
      box degrades gracefully.

    **Cost.** No per-token bill, but hardware, power and your time are real. Compare cost per correct answer, not
    per token: a cheap local model that needs a person to fix a third of its answers is not cheap.

    **Observability.** Log per call: alias, model and tag, prompt and output token counts (`prompt_eval_count`,
    `eval_count`), load and total durations, and the outcome of your own validation.

    **Upgrades.** Pin Ollama's version and each model's tag. When you upgrade either, re-run your golden set before
    switching traffic; a new build or a re-pulled tag can change outputs.
- id: alternatives
  heading: Alternatives and when to pick each
  body: |
    | Option | What it is | Pick it when |
    |---|---|---|
    | A hosted API (Anthropic, OpenAI) | frontier models over the internet | you need the strongest reasoning and the data policy allows it |
    | A cloud route (Amazon Bedrock and similar) | hosted models inside your cloud account | data must stay in your cloud account and you want hosted quality |
    | llama.cpp directly | the open-source inference library many local tools build on | you want the lowest-level control or an unusual build |
    | vLLM or another serving engine | high-throughput serving for GPU servers | many concurrent users on dedicated GPUs |
    | LM Studio or similar desktop apps | a desktop app for local models | individuals exploring models with a GUI |
    | Ollama | one install, pull-and-run models, a simple local API | development, offline work, narrow tasks where data must stay on the box, and small shared servers |

    Many teams use more than one: Ollama for development and private narrow tasks, a hosted or cloud model for the
    hard cases, all behind one model registry so switching is a configuration change.
- id: in_portfolio
  heading: How this portfolio uses Ollama
  body: |
    The tech page lists a blog search and chat assistant that uses Ollama to run local open models on the home
    server. That project, **site-assistant**, is in the repository:

    - **Local answers with citations.** Answers stream from a local model through Ollama and cite the blog sections
      they used. With no model reachable it falls back to quoting the best passages, an extractive mock that needs
      no generation.
    - **A model registry.** Code asks for the alias `chat`; `config/models.yaml` maps it to an Ollama model and marks
      it approved, priced at $0 per token. `OLLAMA_URL` and `OLLAMA_MODEL` override the defaults.
    - **Thinking off for speed.** The registry sets `think: false`, so reasoning models answer directly, which is
      much faster and enough for answers grounded in retrieved text.
    - **Benchmarking on the real box.** `siteassist bench MODEL [MODEL …]` compares Ollama models on the machine that
      serves them: load time, time to first word, tokens per second and the answers they give.
    - **Governed like the rest.** Rate limits and a daily token budget apply, and the governance console can switch
      answering off while search keeps working.

    The other projects default to an offline mock model. Alt-data vendor triage shows the model registry pattern a
    local provider plugs into, alongside mock, Anthropic, OpenAI and Bedrock entries. The daily blog pipeline also
    drafts posts with a local model on the EVO-X1 home server and logs a comparison against Claude.
- id: capstone
  heading: 'Capstone: a local model bake-off with a gate (90 minutes)'
  body: |
    You will build the evaluation harness that decides whether a local model is good enough for a narrow task. A
    registry maps aliases to providers and models; a golden set of labelled settlement-break notes is run through
    each alias; the harness reports accuracy, median latency, output tokens and cost, and applies a pass/fail gate.
    A rules-based mock is included as a baseline that needs no model at all. Then you choose, with evidence.

    | Criterion | What good looks like |
    |---|---|
    | Registry | Code refers only to aliases; models and tags live in one place |
    | Golden set | At least 10 labelled cases covering every category, including an "other" trap |
    | Determinism | Temperature 0 and a fixed seed, so reruns are comparable |
    | Metrics | Accuracy, median latency, output tokens and cost per alias, printed as a table |
    | Robustness | An unreachable server or bad reply counts as a wrong answer, never a crash |
    | Gate | A written threshold for accuracy and latency; each alias marked PASS or FAIL |
    | Decision | A short note: which alias you would ship, why, and what you would watch |
- id: interview
  heading: Scenario interview questions
  body: |
    - **"Compliance won't let research notes leave the building. What would you propose?"** A local model through
      Ollama on a firm-controlled machine, scoped to narrow tasks (classification, short summaries), behind the same
      registry as hosted models, with a golden set proving it is good enough and auth in front of the API.
    - **"The local model is slow at peak times."** Check `ollama ps` for CPU spill-over, reduce context size, try a
      smaller or more quantized tag, tune concurrency, keep the model loaded, and add a second machine if needed.
    - **"How do you decide between a 1B and an 8B model?"** Run both on the same golden set; compare accuracy,
      latency and memory; pick the smallest that clears the gate, and keep the gate in CI.
    - **"A team wants semantic search over internal PDFs, privately."** Local embeddings with Ollama, a small vector
      index on the same machine, the same embedding model for documents and queries, and answers that cite sources.
    - **"Someone wants to expose Ollama to the whole office."** A reverse proxy with authentication and TLS, rate
      limits, logging, pinned models and versions, and a health check; never the raw port.
    - **"Is local free?"** No per-token cost, but hardware, power and operations time; compare cost per correct
      answer.
- id: further_learning
  heading: Further learning
  body: |
    - [Ollama documentation](https://docs.ollama.com/) — the official docs from Ollama, including the API reference
      and FAQ.
    - [Ollama model library](https://ollama.com/library) — models, sizes, tags and licences.
    - [Ollama on GitHub](https://github.com/ollama/ollama) — source, releases and issues.
    - [llama.cpp on GitHub](https://github.com/ggml-org/llama.cpp) — the inference project Ollama built on.
modules:
- id: m1
  title: Models, memory and hardware
  minutes: 20
  body: |
    The single most important question with local models is "does it fit?". A model that fits in fast memory is
    usable; one that does not crawls. This module gives you the tools to answer that before you download 20 GB.

    ### What uses memory

    Two things:

    1. **The weights.** Roughly the number of parameters times the bytes per weight. At 16-bit precision each
       weight takes 2 bytes; at 4-bit, about half a byte. So an 8B model needs roughly 16 GB at 16-bit and roughly
       4–5 GB at 4-bit, before overheads. Treat these as estimates and check the size the library lists for each tag.
    2. **The context.** The model keeps a cache for every token in its context window. Doubling `num_ctx` roughly
       doubles that cache. A long context on a large model can need several GB on its own.

    Add them up, leave room for the operating system and other apps, and compare with your GPU memory (or unified
    memory on machines that share it) and RAM.

    ### CPU, GPU and the spill-over

    Ollama uses a GPU when one is available and the model fits; otherwise it runs some or all layers on the CPU.
    Partial offload works but is much slower than running fully on the GPU. `ollama ps` shows each loaded model's
    size and where it is running, for example "100% GPU" or a CPU/GPU split. A split is the first thing to look for
    when something is unexpectedly slow.

    ### Quantization in practice

    Most library models come in several tags: different sizes, and often different quantization levels. Lower-bit
    quantizations are smaller and faster but lose some quality; the loss is usually small at moderate levels and
    larger at the most aggressive ones, and it varies by model and task. The only reliable way to choose is to run
    your own golden set (m4) on the tags you are considering.

    ### Choosing a model

    Start from the task, not the leaderboard:

    | Task | Start with |
    |---|---|
    | Classification, routing, short extraction | a small model (around 1B–4B) |
    | Summaries of short text, query rewriting | a small to medium model |
    | Answers grounded in retrieved passages | a medium model (around 7B–9B) with enough context |
    | Embeddings for search | a dedicated embedding model |
    | Hard reasoning, long multi-step work | consider a hosted or cloud model instead |

    Then check three things for each candidate: the licence, the size against your hardware, and the context
    length the task needs. The site-assistant project in this portfolio benchmarks candidate models on the machine
    that actually serves them, because numbers from another machine do not transfer.

    ### Reading speed numbers

    Two speeds matter and they are different:

    - **Prompt processing** (`prompt_eval_count` / `prompt_eval_duration` in the reply): how fast the model reads
      your input. Long prompts make this dominate.
    - **Generation** (`eval_count` / `eval_duration`): tokens per second while writing the answer.

    The reply also carries `load_duration` (time spent loading the model, large on the first call) and
    `total_duration`. Durations are in nanoseconds. Report all of them when you compare models, and measure after a
    warm-up call so load time does not distort the result.

    ### A sizing worksheet

    1. Pick the candidate model and tag; note its listed size.
    2. Decide the context the task needs (prompt plus answer, with some margin).
    3. Load it with that context and run `ollama ps`: is it fully on the GPU?
    4. Run ten representative prompts after a warm-up; record median generation speed and total time.
    5. Repeat for the next smaller or more quantized tag, and keep the smallest that meets your quality gate.

    ### When local is the wrong answer

    If no model that fits your hardware clears the quality bar, that is a result, not a failure. Use a cloud route
    for that task and keep local models for the narrow jobs they do well. Being able to say this with numbers is
    what makes a local-model proposal credible to a risk or budget owner.

    ### Common hardware situations

    - **A laptop with no discrete GPU.** Everything runs on the CPU. Small models are usable for classification
      and short summaries; expect generation to be noticeably slower than on a GPU, and keep context short.
    - **A laptop or desktop with unified memory.** The GPU shares system memory, so larger models fit than the
      GPU's name suggests, but the model competes with everything else you have open.
    - **A desktop or server with a discrete GPU.** Fast when the model fits in GPU memory; slow when it spills.
      Pick the largest model and context that fit fully, not the largest that loads.
    - **A shared home or office server.** The case in m5: several users, several models, and the need to keep
      memory for the model that matters most.
  exercise: |
    Fill in the sizing worksheet for two tags you have pulled (for example `llama3.2:1b` and `llama3.2`). For each,
    record the listed size, where `ollama ps` says it runs, and median generation tokens per second over ten prompts
    after a warm-up. Done when you have a two-row table and can say which you would choose for a classification task
    and why, with the numbers from your own machine.
  check:
  - id: m1q1
    prompt: What are the two main uses of memory when running a local model?
    options:
    - The weights and the cache for the context window
    - The download cache and the log files
    - The licence and the Modelfile
    - The HTTP server and the CLI
    answer: 0
    explanation: Weights scale with parameters and precision; the context cache scales with num_ctx.
    evidence: The model keeps a cache for every token in its context window.
  - id: m1q2
    prompt: Roughly how much memory do an 8B model's weights need at 4-bit quantization?
    options:
    - About 4–5 GB before overheads
    - About 64 GB
    - About 500 MB
    - The same as at 16-bit
    answer: 0
    explanation: About half a byte per weight at 4-bit; check the listed size for each tag.
    evidence: roughly 4–5 GB at 4-bit, before overheads
  - id: m1q3
    prompt: A model is unexpectedly slow. What should you look for in ollama ps first?
    options:
    - A CPU/GPU split, meaning the model did not fit fully on the GPU
    - The model's licence
    - The number of downloaded models
    - The Modelfile's system prompt
    answer: 0
    explanation: Partial offload works but is much slower than running fully on the GPU.
    evidence: A split is the first thing to look for when something is unexpectedly slow.
  - id: m1q4
    prompt: What is the only reliable way to choose between quantization levels for your task?
    options:
    - Run your own golden set on the tags you are considering
    - Pick the smallest file
    - Pick the largest file
    - Use the tag with the most downloads
    answer: 0
    explanation: Quality loss varies by model and task.
    evidence: The only reliable way to choose is to run your own golden set (m4) on the tags you are considering.
  - id: m1q5
    prompt: Why measure speed after a warm-up call?
    options:
    - So load time does not distort the result
    - Because the first call always fails
    - To download the model
    - To reset the context window
    answer: 0
    explanation: The first call includes load_duration.
    evidence: measure after a warm-up call so load time does not distort the result
- id: m2
  title: The APIs in depth
  minutes: 20
  body: |
    The native API is small and stable enough to call with nothing but the standard library, which is what the
    Beginner project did. This module covers the parts you need for real applications.

    ### Streaming

    `/api/chat` and `/api/generate` stream by default: the reply is one JSON object per line, each with a piece of
    the message, and the last one has `"done": true` plus the token counts and durations. Streaming lets a user see
    the answer appear; for batch jobs, `"stream": false` is simpler.

    ```python
    import json, urllib.request

    req = urllib.request.Request("http://localhost:11434/api/chat", data=json.dumps({
        "model": "llama3.2", "messages": [{"role": "user", "content": "Explain T+1 in two sentences."}],
    }).encode(), headers={"Content-Type": "application/json"})
    with urllib.request.urlopen(req) as resp:
        for line in resp:
            chunk = json.loads(line)
            print(chunk["message"]["content"], end="", flush=True)
            if chunk.get("done"):
                print("\n", chunk["eval_count"], "tokens")
    ```

    ### Options

    The `options` object sets model parameters per request, overriding the Modelfile:

    - `temperature` — 0 for repeatable classification and extraction; higher for varied drafting.
    - `seed` — with temperature 0, makes reruns as repeatable as the runtime allows, which matters for evals.
    - `num_ctx` — the context window for this request; larger costs memory (m1).
    - `num_predict` — a cap on output tokens, a cheap guard against runaway answers.

    ### Keep-alive

    `keep_alive` on a request (or the `OLLAMA_KEEP_ALIVE` setting on the server) controls how long the model stays
    loaded after the call. Longer keeps latency low for steady traffic at the cost of holding memory; `0` unloads
    immediately. A request with only a model name and no prompt loads the model, which is a simple way to warm it.

    ### Structured output

    `"format": "json"` asks for any valid JSON; `"format": <JSON Schema>` constrains the reply to that schema. Pair it
    with an instruction in the prompt that describes the fields, temperature 0, and validation in your code. Treat a
    parse failure or an out-of-range value as a failed call that your code handles (retry once, then fall back or
    escalate).

    ### Tool calling

    For models that support it, `/api/chat` accepts a `tools` list of function definitions, and the reply's message
    can contain `tool_calls` instead of text. Your code runs the function and sends the result back as a message
    with the `tool` role. The pattern is the same as with hosted APIs, and so are the rules: give read-only tools,
    validate arguments, cap the loop. Small local models are less reliable at multi-step tool use than frontier
    models, so keep tool lists short and test them.

    ### Thinking models

    Some models produce a reasoning phase before the answer. Ollama lets you turn this on or off per request with a
    `think` setting on models that support it. Off is much faster and is often enough for grounded tasks; the
    site-assistant registry sets `think: false` for exactly that reason.

    ### The OpenAI-compatible endpoint

    Ollama serves an OpenAI-style API under `/v1`, so code written for the OpenAI SDK can use a local model by
    changing the base URL and model name (the SDK needs some API key string, which Ollama ignores). This is how a
    local model slots into a model registry as one more provider alias. Two cautions: not every native feature or
    option maps across, and behaviour can differ in details such as defaults, so test the calls you rely on.

    ### Other endpoints worth knowing

    | Endpoint | Use |
    |---|---|
    | `GET /api/tags` | list local models (good for a readiness check) |
    | `GET /api/ps` | list loaded models |
    | `POST /api/show` | a model's details, parameters and Modelfile |
    | `POST /api/embed` | embeddings (m3) |
    | `GET /api/version` | the server's version (health check) |

    There is also an official Python library (`pip install ollama`) that wraps these calls; it is convenient, but
    the HTTP API is what everything else speaks, so learn that first.

    ### Errors to handle

    - **Connection refused:** the server is down; fail fast and use your fallback.
    - **Model not found:** the alias points at a model that is not pulled; this is a deployment bug, so alert rather
      than retry.
    - **Timeouts:** a long prompt on a slow box, or a cold load. Set a timeout that covers a load plus a normal
      reply, and log which one it was from the durations when the call does return.
    - **Out-of-range answers:** handled by your validation, as in Beginner.

    Wrap these in one small client function, the way the portfolio's model registries do, so every caller gets the
    same retries, logging and fallback.
  exercise: |
    Write a streaming chat call that prints tokens as they arrive and, from the final chunk, prints prompt tokens,
    output tokens, load duration and generation tokens per second. Then run the same prompt through the `/v1`
    OpenAI-compatible endpoint with the OpenAI SDK (base URL `http://localhost:11434/v1`). Done when both work
    offline, the streamed version shows the four numbers, and you can name one difference you noticed between the two
    APIs.
  check:
  - id: m2q1
    prompt: In a streamed /api/chat reply, where do the token counts and durations appear?
    options:
    - In the last JSON object, the one with done set to true
    - In an HTTP header on the first line
    - In a separate endpoint called after the stream
    - They are not available when streaming
    answer: 0
    explanation: Each line carries a piece of the message; the final one carries the counts.
    evidence: 'the last one has "done": true plus the token counts and durations'
  - id: m2q2
    prompt: Which options make an eval run as repeatable as possible?
    options:
    - temperature 0 and a fixed seed
    - A high temperature and no seed
    - A larger num_ctx only
    - Streaming turned on
    answer: 0
    explanation: Repeatable runs make comparisons between models fair.
    evidence: with temperature 0, makes reruns as repeatable as the runtime allows, which matters for evals
  - id: m2q3
    prompt: What does keep_alive set to 0 do?
    options:
    - Unloads the model immediately after the call
    - Keeps the model loaded forever
    - Disables streaming
    - Removes the model from disk
    answer: 0
    explanation: Longer keep-alive holds memory to keep latency low.
    evidence: Longer keeps latency low for steady traffic at the cost of holding memory; 0 unloads immediately.
  - id: m2q4
    prompt: How should code treat a reply that fails to parse against the requested schema?
    options:
    - As a failed call to handle — retry once, then fall back or escalate
    - As a correct answer with a typo
    - As a reason to raise the temperature
    - As proof the model is broken and should be deleted
    answer: 0
    explanation: Structured output reduces failures but your code still handles them.
    evidence: Treat a parse failure or an out-of-range value as a failed call that your code handles
  - id: m2q5
    prompt: What is a caution with Ollama's OpenAI-compatible endpoint?
    options:
    - Not every native feature or option maps across, so test the calls you rely on
    - It sends data to OpenAI
    - It only works with images
    - It requires a paid OpenAI key that Ollama checks
    answer: 0
    explanation: The SDK needs some key string, which Ollama ignores; behaviour can differ in details.
    evidence: not every native feature or option maps across
- id: m3
  title: Embeddings and local search
  minutes: 20
  body: |
    Embeddings turn text into vectors so that similar meanings sit close together. With a local embedding model,
    you can build semantic search over private documents without any text leaving the machine — one of the
    use cases on the tech page.

    ### Getting vectors

    Pull a dedicated embedding model (the library has several; `nomic-embed-text` is a common choice) and call
    `/api/embed` with one string or a list:

    ```python
    import json, math, urllib.request

    def embed(texts: list[str], model: str = "nomic-embed-text") -> list[list[float]]:
        req = urllib.request.Request("http://localhost:11434/api/embed",
                                     data=json.dumps({"model": model, "input": texts}).encode(),
                                     headers={"Content-Type": "application/json"})
        with urllib.request.urlopen(req) as resp:
            return json.load(resp)["embeddings"]

    def cosine(a: list[float], b: list[float]) -> float:
        dot = sum(x * y for x, y in zip(a, b))
        return dot / (math.sqrt(sum(x * x for x in a)) * math.sqrt(sum(y * y for y in b)))
    ```

    Sending a list in one request is much faster than one request per string.

    ### A tiny index

    For a few thousand chunks, a list of vectors and a linear scan is fast enough:

    ```python
    docs = ["SSIs must be confirmed by phone before any change.",
            "Failed trades are reviewed by an analyst before rebooking.",
            "Allocations must sum to the block quantity."]
    vectors = embed(docs)

    def search(query: str, k: int = 2) -> list[tuple[float, str]]:
        q = embed([query])[0]
        return sorted(((cosine(q, v), d) for v, d in zip(vectors, docs)), reverse=True)[:k]

    print(search("Can a broker email change our bank details?"))
    ```

    Beyond that, store vectors in a proper index: an extension in a database you already run, such as pgvector in
    Postgres or sqlite-vec in SQLite, both of which have pages on this site.

    ### Rules that save pain

    - **Same model for documents and queries.** Vectors from different models are not comparable. Record the
      embedding model and tag with the index, and rebuild the index if you change either.
    - **Chunk sensibly.** Embed passages of a few sentences to a few paragraphs, with the document title and
      section in each chunk, rather than whole documents. Very long inputs are cut at the model's context length.
    - **Keep the source.** Store each chunk's document ID and position so answers can cite where they came from.
    - **Normalise once.** If you normalise vectors to unit length when indexing, cosine similarity becomes a dot
      product, which is cheaper.

    ### From search to answers

    Retrieval plus a chat model gives grounded answers: retrieve the top passages, put them in the prompt with
    their sources, ask the model to answer only from them and cite them, and refuse when nothing relevant is found.
    Small local models do this well when the passages are good, because the hard part — finding the right text —
    is done by search. The site-assistant project follows this shape: it searches the blog and asks a local model
    to answer with citations, and falls back to quoting the best passages when no model is available.

    ### Measuring retrieval

    Before tuning prompts, check that search finds the right passages. Write ten questions with the passage that
    should answer each, and measure how often it appears in the top k ("hit at k"). If retrieval is poor, no model
    will answer well. site-assistant keeps a retrieval golden set with a hit-at-6 gate for this reason.

    ### Privacy, honestly

    Local embeddings keep text on the machine, but the index is now a copy of your documents in another form.
    Protect it like the documents: same access rules, same retention, and remove entries when a document is
    withdrawn.

    ### Embedding cost and speed

    Embedding is usually much cheaper than generation: there is no answer to write, only one pass over the input.
    Indexing a few thousand passages on a laptop is a coffee-break job, and query-time embedding of one short
    question is fast. Re-embedding the whole corpus is the expensive step, so only do it when the model or the
    chunking changes, and keep the old index until the new one passes your hit-at-k check.
  exercise: |
    Pull an embedding model, embed ten short policy or FAQ passages of your own, and write a `search(query, k)`
    function. Write five test questions with the passage each should find. Done when you report hit-at-2 for your five
    questions, the index records which embedding model built it, and nothing in the exercise needed a network
    connection after the pull.
  check:
  - id: m3q1
    prompt: Why must documents and queries use the same embedding model?
    options:
    - Vectors from different models are not comparable
    - Different models are slower
    - The API rejects mixed models
    - Queries must be shorter than documents
    answer: 0
    explanation: Record the model with the index and rebuild if it changes.
    evidence: Vectors from different models are not comparable.
  - id: m3q2
    prompt: What is a quick way to speed up embedding many strings?
    options:
    - Send them as a list in one request
    - Send one request per character
    - Raise the temperature
    - Turn streaming on
    answer: 0
