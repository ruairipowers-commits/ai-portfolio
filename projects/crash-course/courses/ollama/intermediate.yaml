- id: m4
  title: Evaluating a local model against a hosted one
  minutes: 20
  body: |
    "The local model seems fine" is not a decision a risk or budget owner can sign. A small, honest evaluation is.
    This module builds the method; the capstone builds the harness.

    ### Put every model behind an alias

    Code should ask for `triage-primary`, not `llama3.2:1b` or a hosted model ID. A registry maps aliases to a
    provider, a model and a tag. That gives you three things: comparing models is a configuration change; moving
    production from one model to another is one edit after an eval passes; and every log line can record exactly
    which model answered. The alt-data triage project uses this pattern with mock, Anthropic, OpenAI and Bedrock
    entries, and site-assistant's registry maps its `chat` alias to an Ollama model. Because Ollama has an
    OpenAI-compatible endpoint, adding it to an existing registry is usually a few lines.

    ### Build a golden set

    - **Real-looking inputs.** Take them from the task, with anything sensitive replaced.
    - **Labels a person agrees with.** Have someone who does the job check them.
    - **Cover every category,** including the boring "other" and at least one trap that looks like a category but
      is not.
    - **Start small.** Ten to thirty cases find the big differences; grow the set when you find a failure in
      production, by adding that case.

    ### Measure four things

    1. **Quality.** Accuracy for classification; for extraction, field-level accuracy; for free text, a rubric
       checked by a person or a carefully tested grader.
    2. **Latency.** Median and a high percentile, measured after warm-up, on the machine that will serve it.
    3. **Throughput.** If many requests arrive together, measure under that load, not one at a time.
    4. **Cost.** Per-token price for hosted models; for local, the hardware and running cost spread over volume.
       Compare cost per correct answer.

    ### Make it fair

    - Same prompt, same golden set, same validation for every alias.
    - Temperature 0 and a fixed seed where supported.
    - A failure (timeout, unparseable reply) counts as wrong, never as a crash that skips the case.
    - Run more than once if results vary, and report the spread.

    ### Include a baseline

    Always include the simplest thing that could work: keyword rules or a mock. If rules score 85% and a model
    scores 87%, the model may not be worth its operating cost. If rules score 40% and the model 90%, you have a
    strong case. In the capstone, a keyword-rules alias plays this part.

    ### Write the gate down first

    Decide the thresholds before you see results — for example "accuracy at least 80% and median latency under 5
    seconds on the serving box" — and put them in code. Then the decision is the gate's, not whoever is most
    enthusiastic. Keep the gate in CI so a model or prompt change that drops below it is caught.

    ### Reading results honestly

    Small local models are well behind frontier hosted models on harder reasoning. On narrow tasks the gap can be
    small or absent. The useful output of an evaluation is often a split: the local model handles the common
    cases, and hard or low-confidence cases go to a hosted or cloud model, or to a person. The daily blog pipeline
    in this portfolio logs a local-versus-Claude comparison on every run for exactly this kind of decision, and its
    first paired results showed the local drafts did not reduce Claude's editing work.

    ### Report the decision

    A one-page note: the task, the golden set, the table of results per alias, the gate, the choice, and what you
    will monitor in production (accuracy on a sample checked by people, latency, failure rate).

    ### After go-live

    The eval does not end at launch. Sample a few real cases a week, have a person label them, and add any the
    model got wrong to the golden set. Re-run the gate on every model, tag, prompt or Ollama upgrade. When the
    gate fails, the registry makes rolling back a one-line change. Over time the golden set becomes the most
    valuable artefact of the project, because it encodes what "good" means for this task.
  exercise: |
    Write a golden set of ten labelled settlement-break notes covering all five categories, including one "other"
    trap. Run it by hand through two local models with temperature 0, and through simple keyword rules. Done when you
    have a table of accuracy for the three, a gate you wrote down before running, and a two-sentence recommendation.
  check:
