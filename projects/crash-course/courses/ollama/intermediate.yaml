    - As a rollback
    answer: 0
    explanation: Re-pulling a tag can bring a changed model.
    evidence: Re-pulling a tag can bring a changed model, so treat a re-pull like an upgrade.
project:
  title: A local model bake-off with a pass/fail gate
  kind: runnable
  minutes: 90
  goal: Build a harness that runs a labelled golden set through several model aliases (two local Ollama models and a
    rules baseline), reports accuracy, median latency, tokens and cost, and marks each alias PASS or FAIL against a gate
    written in advance.
  steps:
  - Pull the models you will compare while online (for example `ollama pull llama3.2:1b` and `ollama pull llama3.2`).
    Everything after this runs offline.
  - Write your gate down first — the reference uses accuracy at least 80% and median latency at most 5 seconds.
  - Save the code below as `bench.py`. Edit REGISTRY so the Ollama aliases point at the tags you pulled.
  - Read GOLDEN and add at least two cases of your own, including a trap.
  - Run `python bench.py triage-rules` first. It needs no model and shows the baseline.
  - Run `python bench.py` for all aliases. Warm each model first with a single `ollama run <model> "hi"` so load time
    does not count.
  - Stop the Ollama server and run `python bench.py triage-small`. It should report 0% and FAIL, not crash.
  - Run each alias twice and note whether accuracy changes.
  - Write a five-line decision note — which alias you would ship for this task, why, and what you would monitor.
  code: |
    """Compare models behind aliases on a labelled set: accuracy, latency, speed and a pass/fail gate."""
    import json
    import os
    import statistics
    import sys
    import time
    import urllib.request

    OLLAMA = os.environ.get("OLLAMA_URL", "http://localhost:11434")
    REGISTRY = {                                  # alias -> provider and model; code only ever uses aliases
        "triage-small": {"provider": "ollama", "model": "llama3.2:1b"},
        "triage-medium": {"provider": "ollama", "model": "llama3.2"},
        "triage-rules": {"provider": "mock", "model": "keyword-rules-v1"},
    }
    CATEGORIES = ["quantity_mismatch", "price_mismatch", "missing_ssi", "late_confirm", "other"]
    SYSTEM = ("You classify settlement-break notes for a middle-office team. Reply only with JSON that has a "
              "category and a one-sentence reason. Categories: " + ", ".join(CATEGORIES) + ".")
    SCHEMA = {"type": "object", "required": ["category", "reason"],
              "properties": {"category": {"type": "string", "enum": CATEGORIES}, "reason": {"type": "string"}}}
    GOLDEN = [
        ("Broker confirm shows 900 shares, our booking says 1,000.", "quantity_mismatch"),
        ("Allocation split sums to 4,800 but the block was 5,000.", "quantity_mismatch"),
        ("Confirm price 101.25 vs booked 101.52.", "price_mismatch"),
        ("Commission on the confirm differs from our fee schedule, net amount off.", "price_mismatch"),
        ("No standing settlement instructions on file for this custodian.", "missing_ssi"),
        ("Custodian rejected: beneficiary account details missing.", "missing_ssi"),
        ("Confirm received two days after trade date.", "late_confirm"),
        ("Still waiting for the broker's affirmation at end of day.", "late_confirm"),
        ("Client called to ask about the weather in Singapore.", "other"),
        ("Trade booked under the wrong fund code.", "other"),
    ]
    GATE = {"min_accuracy": 0.8, "max_p50_seconds": 5.0}


    def mock_complete(note: str) -> dict:
        n = note.lower()
        for words, cat in [(("shares", "sums", "quantity"), "quantity_mismatch"), (("price", "commission"), "price_mismatch"),
                           (("instructions", "account details"), "missing_ssi"), (("days after", "waiting"), "late_confirm")]:
            if any(w in n for w in words):
                return {"category": cat, "reason": "keyword rule"}
        return {"category": "other", "reason": "no rule matched"}


    def ollama_complete(model: str, note: str) -> dict:
        body = {"model": model, "stream": False, "format": SCHEMA, "options": {"temperature": 0, "seed": 7},
                "messages": [{"role": "system", "content": SYSTEM}, {"role": "user", "content": note}]}
        req = urllib.request.Request(OLLAMA + "/api/chat", data=json.dumps(body).encode(),
                                     headers={"Content-Type": "application/json"})
        with urllib.request.urlopen(req, timeout=300) as resp:
            reply = json.load(resp)
        out = json.loads(reply["message"]["content"])
        out["tokens"] = reply.get("eval_count", 0)
        return out


    def run(alias: str) -> dict:
        spec = REGISTRY[alias]
        correct, latencies, tokens = 0, [], 0
        for note, label in GOLDEN:
            t0 = time.perf_counter()
            try:
                out = mock_complete(note) if spec["provider"] == "mock" else ollama_complete(spec["model"], note)
            except Exception as e:                    # a failure counts as wrong, never as a crash
                out = {"category": "error", "reason": str(e)[:80]}
            latencies.append(time.perf_counter() - t0)
            tokens += out.get("tokens", 0)
            correct += out.get("category") == label
        acc = correct / len(GOLDEN)
        p50 = statistics.median(latencies)
        passed = acc >= GATE["min_accuracy"] and p50 <= GATE["max_p50_seconds"]
        return {"alias": alias, "model": spec["model"], "accuracy": acc, "p50_s": round(p50, 2),
                "tokens_out": tokens, "cost_usd": 0.0, "gate": "PASS" if passed else "FAIL"}


    if __name__ == "__main__":
        aliases = sys.argv[1:] or list(REGISTRY)
        print(f"{'alias':<14} {'model':<18} {'acc':>5} {'p50 s':>6} {'tokens':>7} {'cost':>5}  gate")
        for a in aliases:
            r = run(a)
            print(f"{r['alias']:<14} {r['model']:<18} {r['accuracy']:>5.0%} {r['p50_s']:>6} {r['tokens_out']:>7} "
                  f"{r['cost_usd']:>5.2f}  {r['gate']}")
  language: python
  expected: |
    $ python bench.py triage-rules
    alias          model                acc  p50 s  tokens  cost  gate
    triage-rules   keyword-rules-v1    100%    0.0       0  0.00  PASS
    $ python bench.py
    One row per alias in the same format. The model rows' accuracy, latency and token counts depend on your models
    and hardware. The rules baseline scores 100% on the built-in cases because its keywords were written for them;
    your own added cases are the fairer test.
    With the server stopped, triage-small shows 0% accuracy, 0 tokens and FAIL, and the script exits normally.
  done_when:
  - The table prints a row per alias with accuracy, median latency, tokens, cost and PASS or FAIL against your
    pre-written gate.
  - Stopping the server makes the Ollama aliases fail cleanly instead of crashing the harness.
  - You wrote a decision note that names the alias you would ship and cites your own numbers, including how your added
    cases changed the rules baseline's score.
