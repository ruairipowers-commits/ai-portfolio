    options:
    - If rules score close to the model, the model may not be worth its operating cost
    - Rules are always better than models
    - The gate needs at least three aliases
    - Baselines make the model more accurate
    answer: 0
    explanation: The simplest thing that could work sets the bar.
    evidence: If rules score 85% and a model scores 87%, the model may not be worth its operating cost.
  - id: m4q4
    prompt: When should you set the gate's thresholds?
    options:
