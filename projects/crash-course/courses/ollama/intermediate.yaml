- id: m5
  title: Running Ollama as a service
  minutes: 20
  body: |
    On a laptop, Ollama is a developer tool. On a shared machine, it is a service that other people's work depends
    on. That changes what you need to think about.

    ### Binding and access

    By default the server listens on localhost only. `OLLAMA_HOST` changes the address it binds to; setting it to
    all interfaces makes the API reachable from the network, and the API has no authentication. The safe patterns:

    - Keep Ollama on localhost and run the application that uses it on the same machine (site-assistant's
      self-hosted stack runs Ollama as its own container next to the app).
    - Or put a reverse proxy in front that requires authentication, terminates TLS and applies rate limits, and only
      let the proxy reach Ollama.
    - Restrict who can call pull, create and delete endpoints; most callers only need chat and embed.

    ### Concurrency and memory

    Server settings control how many requests one model handles at once and how many models can be loaded together
    (`OLLAMA_NUM_PARALLEL` and `OLLAMA_MAX_LOADED_MODELS` in the FAQ). More parallel requests raise throughput but
    each needs its own context memory, so the model may no longer fit on the GPU. Change one setting at a time and
    measure throughput and latency under realistic load.

    ### Containers

    The official `ollama/ollama` image runs the server in Docker. Mount a volume for the model store so models
    survive container restarts, pass the GPU through if you have one, and keep the port on an internal network.
    Decide how models get onto the box: pulled at start-up (simple, needs a network connection), or baked into an
    image or a volume (repeatable, works offline). site-assistant pulls its model the first time it starts.

    ### Keeping it warm

    The first request after a model unloads waits for it to load. For a service, either raise keep-alive so the
    model stays loaded during working hours, or warm it at start-up with a request that has the model name and no
    prompt. Watch memory: a model kept loaded is memory nothing else can use.

    ### Health and monitoring

    - **Liveness:** `GET /api/version` answers.
    - **Readiness:** the model you need appears in `GET /api/tags`, and a tiny test request succeeds.
    - **Metrics to log per call:** alias, model and tag, prompt and output tokens, load, prompt and generation
      durations, and your own validation result.
    - **Alerts:** error rate, latency above your target, and memory pressure or CPU spill-over.

    ### Updates

    Ollama and models both change. Pin the server version in your container image and the model by tag. When you
    upgrade either, run the golden set from m4 on a staging box first and switch only if the gate still passes.
    Re-pulling a tag can bring a changed model, so treat a re-pull like an upgrade.

    ### Governance on top

    The model server is one part of a governed workflow, not the whole of it. Rate limits per user, a daily token
    budget, a kill switch, logging of questions and answers, and a retention period belong in the application in
    front of Ollama. site-assistant applies rate limits and a daily token budget, and reports each question to the
    governance console, which can switch answering off while search keeps working.

    ### A go-live checklist

    1. API reachable only through an authenticated proxy or from the same machine.
    2. Models and server version pinned; licences recorded.
    3. Golden set passes on the serving hardware.
    4. Keep-alive and concurrency tuned and measured under load.
    5. Health checks, per-call logs and alerts in place.
    6. A fallback for callers when the server is busy or down.

    ### When to stop self-hosting

    A shared Ollama box is a good fit for a team, a lab or a home server. When demand grows to many concurrent
    users, strict uptime targets or many models at once, the operational load grows with it. At that point compare
    a dedicated serving engine on GPU servers, or a cloud route, using the same golden set and cost-per-correct-
    answer measure from m4. The registry pattern means the application does not need to change when the answer
    does.
  exercise: |
    Write a short service plan for running Ollama for a team of ten: how it is reached (proxy and auth), which
    models and tags, keep-alive and concurrency settings with your reasoning, health checks, what is logged, and the
    upgrade procedure. If you have Docker, run the `ollama/ollama` image with a named volume and confirm a pulled
    model survives a container restart. Done when the plan covers every item of the go-live checklist.
  check:
