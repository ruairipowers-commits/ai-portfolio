course: bedrock
level: intermediate
version: 2                   # v2 so it supersedes any v1 draft the live writer queued for this level
title: Amazon Bedrock as the governed production route in 4 hours
status: draft
source:
  page: tech/bedrock.md
  docs: https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-bedrock.html
provenance:
  written_by: Claude (build session, 3 Nov 2026), from the site's Amazon Bedrock page and the Familiar level
sections:
- id: modules
  heading: How the four hours fit together
  body: |
    Beginner had you send one Converse request to two models. This level covers what makes Bedrock the production
    route for a firm on AWS: the Converse API in depth, tool use through it, the IAM, network and logging controls a
    risk team relies on, Knowledge Bases for retrieval, and running Bedrock behind a model registry with quotas,
    retries and fallbacks. Five modules, each with an exercise and a five-question check (pass mark 80%), then a
    90-minute capstone and a final test.

    | Module | What you learn | Time |
    |---|---|---|
    | m1 Converse in depth | content blocks, inference settings, stop reasons, streaming, model IDs and profiles | 20 min |
    | m2 Tool use through Converse | toolConfig, toolUse and toolResult blocks, the loop, caps | 20 min |
    | m3 IAM, network and logging controls | least privilege on model ARNs, private access, audit, guardrails | 20 min |
    | m4 Knowledge Bases for retrieval | data sources, vector stores, retrieve, costs and lock-in | 20 min |
    | m5 Bedrock behind a model registry | aliases, quotas, retries, fallback, evals before a swap | 20 min |

    **Pacing.** m1 and m2 first. m3 and m4 are independent. m5 sets up the capstone. Every code exercise runs offline
    with botocore's Stubber, which validates each request against the real Bedrock API definition; with a sandbox
    account and model access you can run the same code for real.
- id: production
  heading: Running Bedrock for real
  body: |
    **Security.**
    - Each workload's role may invoke only its approved model ARNs; no wildcards. Keep that list in sync with the
      model registry.
    - Separate duties: the role that calls models should not hold approval or signing secrets, and the role that
      approves should not call models.
    - Use private connectivity (VPC endpoints) where your network policy requires traffic to stay off the internet.
    - Decide what is logged: AWS logs the API calls; model invocation logging, if you turn it on, can also store
      prompts and responses, which then need the same protection as the data in them.

    **Reliability and scaling.**
    - Quotas apply per account, region and model (requests and tokens per minute). Check them before launch and
      request increases early.
    - Configure SDK retries for throttling, set read timeouts that fit long replies, and keep a fallback alias.
    - Cross-region inference profiles can spread load across regions where your data policy allows it.

    **Cost.**
    - On-demand calls are charged per token, on your AWS bill. Tag workloads, set AWS Budgets, and log tokens per call.
    - Managed features have their own costs: a Knowledge Base's vector store can charge while idle (an OpenSearch
      Serverless collection has a minimum capacity).

    **Observability.** One audit row per call from your code (alias, model ID, stop reason, tokens, latency), plus
    AWS's own records of who called which model.

    **Upgrades and availability.** Model and feature availability varies by region, and new models can reach
    Bedrock later than the provider's own API. Before switching a model ID, run the eval on Bedrock in the region you
    use.
- id: alternatives
  heading: Alternatives and when to pick each
  body: |
    | Option | What it is | Pick it when |
    |---|---|---|
    | A provider's own API (Anthropic, OpenAI) | the model vendor's hosted API | you need the newest models or features first and a separate vendor contract is acceptable |
    | Google Cloud or Microsoft Foundry | other clouds' model platforms | your firm's main cloud is Google Cloud or Azure |
    | Self-hosted open models (Ollama, a serving engine) | models on your own machines or GPUs | data must not leave your hardware, or volume justifies running GPUs |
    | Amazon SageMaker endpoints | hosting a model you choose on managed instances | you need a model Bedrock does not offer, or custom serving |
    | Amazon Bedrock | many providers' models behind one AWS API | your firm is on AWS and wants IAM, AWS logging, one bill and cheap model swaps |

    Bedrock's managed extras (Knowledge Bases, agents, guardrails) save build time but add AWS lock-in. A common
    compromise: use Bedrock for model calls through the model-neutral Converse API, and keep retrieval and
    orchestration in your own code where portability matters.
- id: in_portfolio
  heading: How this portfolio uses Bedrock
  body: |
    Bedrock is the AWS path for three projects. Each runs offline with a mock locally and documents the switch.

    - **Alt-data vendor triage.** Bedrock is one provider behind the model registry (with mock, Anthropic and
      OpenAI). Its adapter calls `converse` with a system prompt, the user message and a token cap. To switch, set
      the `bedrock-claude` model ID (a model or inference-profile ID from the console) and pricing, point
      `triage-candidate` at it, run the eval gate, then promote. The Terraform starter grants the task role
      `bedrock:InvokeModel` and `bedrock:InvokeModelWithResponseStream` only on the ARNs in
      `approved_bedrock_model_arns`, to be kept in sync with `models.yaml`.
    - **Trade-ops exception agent.** The AWS path runs the LangGraph agent on ECS Fargate with Bedrock as the model
      provider, wired through `langchain-aws`. Separation of duties: the investigator task can call Bedrock but
      cannot read the approval signing key; the approver task can read the key but cannot call any model. The docs
      say plainly that live Bedrock calls have not been exercised yet, because they need an account and model access.
    - **Research Q&A.** The AWS path replaces the local SQLite index with a Bedrock Knowledge Base on OpenSearch
      Serverless (Titan embeddings v2), with hybrid search through `retrieve`. Licence-barred documents are never
      uploaded to the Knowledge Base, because embedding them counts as AI processing.
- id: capstone
  heading: 'Capstone: a governed Bedrock agent with a tool loop (90 minutes)'
  body: |
    You will build the client a team on AWS would use: aliases mapped to Bedrock model IDs, a Converse tool-use loop
    with a read-only lookup and a cap, a final memo submitted through a tool and validated with Pydantic, an audit
    line per call with tokens and latency, standard retries, and a fallback alias that is used only for throttling
    and service errors — never for access or validation errors, which must be fixed rather than hidden. An offline
    mode scripts the responses with botocore's Stubber, including a simulated throttle.

    | Criterion | What good looks like |
    |---|---|
    | Aliases | Code names an alias; model IDs live in one registry |
    | Tool loop | toolUse blocks answered with matching toolUseIds; only allow-listed tools run; errors as error results |
    | Caps | A tool-call cap ends the run with an escalation |
    | Validation | The memo is validated before use; any other stop reason escalates |
    | Audit | One JSON line per call: alias, model ID, stop reason, tokens, latency, tools |
    | Retries and fallback | Standard retries; fallback only on throttling or service errors, and logged |
    | IAM | A written policy that allows InvokeModel on the two registry ARNs only |
    | Offline tests | The happy path and the throttle-then-fallback path both pass with the Stubber |
- id: interview
  heading: Scenario interview questions
  body: |
    - **"Security wants proof that the agent can only use approved models."** IAM on the task role listing only the
      approved model ARNs, kept in sync with the registry; AWS records of every invocation; a test that an unlisted
      model is refused.
    - **"The morning batch is throttled."** Check quotas per model and region, use standard or adaptive retries, pace
      the batch, request a quota increase, consider a cross-region inference profile, and keep a fallback alias.
    - **"We want RAG over research PDFs on AWS, quickly."** A Knowledge Base with an S3 data source and a vector
      store, `retrieve` for passages with sources, the answer through Converse with citations; note the vector
      store's standing cost and the lock-in.
    - **"A new model is on the provider's API but not on Bedrock yet."** Expect a lag; evaluate when it arrives in
      your region; meanwhile keep the current alias, or route a non-sensitive experiment to the direct API if policy
      allows.
    - **"An attacker injects instructions through a document."** Treat retrieved and tool content as data, keep write
      actions behind approval, validate outputs with rules, and consider a guardrail on the call.
    - **"Can we prompt-log everything for audit?"** Model invocation logging can store prompts and responses; weigh
      the audit value against storing sensitive data, encrypt and restrict the destination, and set retention.
- id: further_learning
  heading: Further learning
  body: |
    - [Amazon Bedrock documentation](https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-bedrock.html) — the
      official user guide from Amazon Web Services.
    - [Get started with the API](https://docs.aws.amazon.com/bedrock/latest/userguide/getting-started-api.html) —
      credentials, model access and a first call.
    - [boto3 bedrock-runtime reference](https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/bedrock-runtime.html)
      — Converse and the other runtime operations.
    - [boto3 bedrock-agent-runtime reference](https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/bedrock-agent-runtime.html)
      — Knowledge Base retrieval.
    - In the guide, read the chapters on the **Converse API**, **tool use**, **Knowledge Bases**, **guardrails**,
      **model invocation logging** and **security**.
modules:
- id: m1
  title: Converse in depth
  minutes: 20
  body: |
    Converse is the model-neutral interface: the same request shape for every model on Bedrock that supports it.
    Learn it well once and every model swap is cheap.

    ### The request

    ```python
    response = client.converse(
        modelId=MODEL_ID,
        system=[{"text": "You summarise vendor notes for a research team. Use only facts in the note."}],
        messages=[{"role": "user", "content": [{"text": "<note>...</note> Summarise in three bullets."}]}],
        inferenceConfig={"maxTokens": 500, "temperature": 0, "stopSequences": ["</summary>"]},
    )
    ```

    - **modelId** — a model ID or an inference profile ID (below), from config.
    - **system** — a list of blocks with the standing instructions.
    - **messages** — alternating `user` and `assistant` turns, each a list of content blocks: text, images,
      documents, tool use, tool results.
    - **inferenceConfig** — common settings that work across models: `maxTokens`, `temperature`, `topP`,
      `stopSequences`.
    - **additionalModelRequestFields** — settings specific to one model family, passed through as-is. Use sparingly:
      every field here is one more thing that breaks when you swap models.

    ### The response

    The reply has `output.message` (a role and content blocks), `stopReason`, `usage` (input, output and total
    tokens) and `metrics.latencyMs`. Join the text blocks; other blocks, such as tool use, can sit alongside them.

    ### Stop reasons

    | Stop reason | Meaning | What your code does |
    |---|---|---|
    | `end_turn` | finished | validate and use |
    | `max_tokens` | cut off at the cap | do not treat as complete |
    | `stop_sequence` | hit a stop sequence | use the text up to it |
    | `tool_use` | wants a tool run | run it and send the result (m2) |
    | `guardrail_intervened` | a guardrail blocked or changed content | do not use; log and route to a person |
    | `content_filtered` | content was filtered | do not use; log and route |

    The safe default for anything unexpected is to stop and escalate.

    ### Model IDs and inference profiles

    A model ID names one model, such as `anthropic.claude-opus-4-7`. An inference profile ID routes calls for a model
    and can spread them across several regions; cross-region profile IDs start with a geography prefix. Some models
    can only be called through a profile, and the console shows the ID to use. Treat both as opaque strings copied
    into config, and log the exact one used for each call.

    ### Streaming

    `converse_stream` returns events as the reply is generated: message start, content deltas, message stop and a
    final metadata event with usage and latency. Use it when a person watches the answer; it needs the
    `bedrock:InvokeModelWithResponseStream` permission, separate from `bedrock:InvokeModel`, which is why the
    portfolio's Terraform grants both.

    ### Errors

    Everything arrives as `botocore.exceptions.ClientError`; read `e.response["Error"]["Code"]`:

    | Code | What it means | Retry? |
    |---|---|---|
    | `ThrottlingException` | quota hit | yes, with backoff |
    | `ServiceUnavailableException`, `InternalServerException` | service trouble | yes, then fall back |
    | `ModelNotReadyException` | model not ready to serve | yes, after a wait |
    | `ValidationException` | bad request, or a profile is required | no: fix it |
    | `AccessDeniedException` | IAM or model access | no: fix permissions |
    | `ResourceNotFoundException` | wrong ID or region | no: fix config |

    boto3's retry configuration (`Config(retries={"mode": "standard", "max_attempts": 3})`) handles throttling and
    transient errors before your code sees them. Set `read_timeout` high enough for long replies.

    ### Testing offline

    `botocore.stub.Stubber` wraps a real client: you queue expected calls with `add_response` or `add_client_error`,
    and the client validates every request's parameters against the Bedrock API definition before returning the
    canned reply. A misspelt field or a wrong type fails in the test exactly as it would against AWS. The Beginner
    project used it; the capstone uses it to simulate throttling.

    ### Prompt structure

    Instructions in `system`; data in user content, wrapped in tags, with the system prompt saying it is data. Keep
    model-specific fields out unless you need them. That keeps the request portable, which is the reason to use
    Converse in the first place.

    ### Converse or InvokeModel

    `invoke_model` is the older, model-specific interface: you send the provider's own JSON body and parse its own
    response format. It still has uses (a model or feature Converse does not cover), but every model then needs its
    own request and response code. Prefer Converse for anything that should survive a model swap, and keep any
    `invoke_model` use behind the same adapter so business code never sees the difference.
  exercise: |
    Write `call(client, model_id, text) -> dict` that returns the joined text, stop reason, tokens and latency, and
    raises an `Escalate` exception for any stop reason other than `end_turn`. Test it offline with the Stubber: one
    `end_turn` reply, one `max_tokens` reply and one `ThrottlingException` (with retries disabled in the client
    config). Done when the first returns text, the second escalates, and the third raises a ClientError with the
    throttling code.
  check:
  - id: m1q1
    prompt: Why use additionalModelRequestFields sparingly?
    options:
    - Every field there is one more thing that breaks when you swap models
    - They cost extra per call
    - They disable streaming
    - They are ignored by every model
    answer: 0
    explanation: Model-specific settings undo Converse's portability.
    evidence: every field here is one more thing that breaks when you swap models
  - id: m1q2
    prompt: A reply's stop reason is guardrail_intervened. What should code do?
    options:
    - Not use the content; log and route to a person
    - Use the content as normal
    - Retry with a higher temperature
    - Remove the guardrail and retry
    answer: 0
    explanation: A guardrail blocked or changed content.
    evidence: do not use; log and route to a person
  - id: m1q3
    prompt: Which extra permission does converse_stream need?
    options:
    - bedrock:InvokeModelWithResponseStream
    - s3:PutObject
    - bedrock:CreateGuardrail
    - iam:PassRole
    answer: 0
    explanation: It is separate from bedrock:InvokeModel, which is why the portfolio's Terraform grants both.
    evidence: it needs the bedrock:InvokeModelWithResponseStream permission, separate from bedrock:InvokeModel
  - id: m1q4
    prompt: Which error should not be retried?
    options:
    - ValidationException
    - ThrottlingException
    - ServiceUnavailableException
    - ModelNotReadyException
    answer: 0
    explanation: A bad request or a missing profile must be fixed.
    evidence: 'ValidationException | bad request, or a profile is required | no: fix it'
  - id: m1q5
    prompt: What does the Stubber check when you call a stubbed client?
    options:
    - Every request's parameters against the Bedrock API definition
    - The model's answer quality
    - Your AWS bill
    - The IAM policy attached to your role
    answer: 0
    explanation: A misspelt field fails in the test exactly as it would against AWS.
    evidence: the client validates every request's parameters against the Bedrock API definition
- id: m2
  title: Tool use through Converse
  minutes: 20
  body: |
    Converse carries tool use in the same model-neutral shape: you describe tools in `toolConfig`, the model replies
    with `toolUse` blocks, and you answer with `toolResult` blocks. The loop and the safety rules are the same as
    with any provider; only the field names differ.

    ### Defining tools

    ```python
    TOOL_CONFIG = {"tools": [{"toolSpec": {
        "name": "get_vendor_facts",
        "description": "Read-only. Look up a vendor's facts by ID.",
        "inputSchema": {"json": {"type": "object", "properties": {"vendor_id": {"type": "string"}},
                                 "required": ["vendor_id"]}},
    }}]}
    ```

    The name and description are what the model reads; say what comes back and that it is read-only. The schema
    goes under `inputSchema.json`.

    ### The loop

    1. Call `converse` with `toolConfig`.
    2. If `stopReason` is `tool_use`, find the content blocks with a `toolUse` key. Each has a `toolUseId`, a `name`
       and an `input` (already a dict).
    3. Check the name against your allow-list and run the tool.
    4. Append the assistant message (its full content) and then one user message with a `toolResult` block per
       call, each with the matching `toolUseId`.
    5. Call again. Stop when the model finishes, submits its result, or a cap is hit.

    ```python
    results.append({"toolResult": {"toolUseId": use["toolUseId"],
                                   "content": [{"json": out}], "status": status}})
    messages += [{"role": "assistant", "content": content}, {"role": "user", "content": results}]
    ```

    A tool result's content can be text or JSON blocks. Set `"status": "error"` when the tool failed, with an
    error the model can act on ("unknown vendor V-99"); the model can then try something else instead of the run
    crashing.

    ### Limits in your loop

    - **Allow-list.** Run only tools you offered; an unknown name gets an error result.
    - **Tool-call cap.** Count calls and escalate at the cap; the capstone uses 4.
    - **Budget.** Add up tokens per run and stop at a limit; price them from the registry.
    - **No writes in the loop.** The model gets lookups; actions that change systems go behind a person's approval.
      In the trade-ops AWS design, the investigator task cannot even read the approval signing key.

    ### Tool support varies

    Not every model on Bedrock supports tool use, and support for details (several tool calls in one reply, forcing a
    tool) differs between models. Check the model's entry in the Converse documentation's supported-features table
    before relying on it, and test the loop on the model and region you will use. This is the practical meaning of
    "feature availability varies" on the tech page.

    ### A tool as the output channel

    A final `submit_memo` tool whose input schema is your result type ends the loop with structured data you can
    validate with Pydantic. It works across models that support tool use, which makes it a portable way to get
    structured output through Converse. The capstone uses this pattern.

    ### Tool results are untrusted

    Text inside a tool result can try to steer the model. Say in the system prompt that tool results are data, keep
    write tools out of the loop, and validate the final output with rules that do not depend on the model.

    ### Testing the loop offline

    Queue scripted replies on a Stubber: first a `toolUse` for the lookup, then a `toolUse` for `submit_memo`. The
    Stubber validates your second request, including the `toolResult` blocks you built, against the API definition,
    so a malformed result fails in the test. The capstone's offline mode does exactly this.

    ### Reading a trajectory

    Log every Converse call in the loop with the tools it requested. A run that asks for the same lookup repeatedly,
    or never calls `submit_memo`, usually points to an unclear tool description, a tool result the model cannot use,
    or a model whose tool use is weaker on this task. Compare trajectories between the two models in your registry
    before choosing one; it is often the quickest way to see why one model is cheaper per completed task even when
    its per-token price is higher.

    ### Agents managed by Bedrock

    Bedrock also offers managed agent features that run the loop for you. They save code, but the loop, its caps and
    its approval rules then live in AWS configuration rather than in your tested code. For workflows where an auditor
    will ask exactly which steps can act, many teams keep the loop in their own code, as the trade-ops agent does
    with LangGraph.
  exercise: |
    Build a Converse tool loop with one read-only tool and a Stubber script that first asks for a tool you did not
    define, then the real tool, then `submit_memo`. Done when the unknown tool gets a `toolResult` with status `error`
    and never runs, the real tool's result carries the matching `toolUseId`, and the memo validates with Pydantic.
  check:
  - id: m2q1
    prompt: Where does a Converse tool's JSON Schema go?
    options:
    - Under inputSchema.json in the toolSpec
    - In the system prompt
    - In inferenceConfig
    - In additionalModelRequestFields
    answer: 0
    explanation: Tools are described in toolConfig with toolSpec entries.
    evidence: The schema goes under inputSchema.json.
  - id: m2q2
    prompt: How do you tell the model a tool failed?
    options:
    - A toolResult with status error and an error the model can act on
    - Drop the result
    - Raise an exception that ends the run
    - Return a fake successful result
    answer: 0
    explanation: The model can then try something else.
    evidence: 'Set "status": "error" when the tool failed'
  - id: m2q3
    prompt: What must each toolResult block carry?
    options:
    - The toolUseId of the toolUse it answers
    - The model ID
    - The IAM role ARN
    - The latency
    answer: 0
    explanation: Results are matched to tool requests by ID.
    evidence: each with the matching toolUseId
  - id: m2q4
    prompt: Why check the Converse supported-features table before relying on tool use?
    options:
    - Not every model supports tool use, and details differ between models
    - Tool use is only available in one region
    - Tool use costs a flat fee
    - The table lists prices
    answer: 0
    explanation: Test the loop on the model and region you will use.
    evidence: Not every model on Bedrock supports tool use, and support for details
  - id: m2q5
    prompt: Why is a submit_memo tool a portable way to get structured output through Converse?
    options:
    - It works across models that support tool use, and its input validates with Pydantic
    - It removes the need for validation
    - Only Anthropic models can use it
    - It forces every model to answer in JSON
    answer: 0
    explanation: A final tool whose schema is the result ends the loop with data you can validate.
    evidence: It works across models that support tool use, which makes it a portable way to get structured output through Converse.
- id: m3
  title: IAM, network and logging controls
  minutes: 20
  body: |
    For an investment firm already on AWS, the main draw of Bedrock is governance: model calls stay under existing
    IAM roles, network controls and audit tooling. This module turns that into concrete settings a risk team can
    review.

    ### Least privilege on model ARNs

    An application role should be able to invoke only the models it is approved to use:

    ```json
    {"Effect": "Allow",
     "Action": ["bedrock:InvokeModel", "bedrock:InvokeModelWithResponseStream"],
     "Resource": ["arn:aws:bedrock:us-east-1::foundation-model/MODEL-ID-FROM-REGISTRY"]}
    ```

    `bedrock:InvokeModel` covers Converse; the streaming action covers `converse_stream`. Foundation-model ARNs have
    no account ID. Calls through an inference profile also need permission on the profile, so copy the exact ARNs
    the console or documentation gives for the profile and the models behind it. The alt-data triage Terraform does
    this with an `approved_bedrock_model_arns` variable that must stay in sync with the model registry: the registry
    says which models code may ask for, IAM says which the role can actually call.

    ### Separation of duties

    Split roles so that no single compromised component can do everything. In the trade-ops AWS design, the
    investigator task can call Bedrock but cannot read the approval signing key, and the approver task can read the
    key but cannot call any model. A prompt-injected investigator therefore cannot mint an approval, even inside AWS.

    ### Model access as a control

    Models must be enabled per account and region before anyone can call them. In larger estates, who may enable
    models is itself restricted, so a new provider's model goes through review before it is available at all.

    ### Network

    Bedrock's runtime is reachable through VPC interface endpoints (AWS PrivateLink), so workloads in private
    subnets can call it without internet access. Endpoint policies can narrow what is allowed through. Use them where
    your network policy requires traffic to stay inside the AWS network.

    ### Audit and logging

    - **API activity.** AWS records management and invocation API activity in CloudTrail: who called which
      operation, on which model, when.
    - **Model invocation logging.** An optional account setting that can deliver request and response data to
      CloudWatch Logs or S3. Valuable for audit and debugging; it also means prompts and replies — possibly client
      data — are stored. Encrypt and restrict the destination, set retention, and decide deliberately.
    - **Your own audit row.** Alias, model ID, stop reason, tokens, latency, tools used and the validation result.
      AWS records tell you a call happened; your row ties it to the business item and the output's fate.

    ### Guardrails

    Bedrock Guardrails are configurable policies (for example, denied topics, content filters and filters for
    sensitive information) that you can apply to a Converse call with `guardrailConfig`. When a guardrail intervenes,
    the stop reason says so. Guardrails are a useful extra layer; they are not a replacement for least privilege,
    approvals on writes and output validation in your code.

    ### Cost controls

    Tag workloads, set AWS Budgets with alerts, and log tokens per call so cost can be attributed to an alias and a
    business process. Billing data lags, so budgets are a backstop; per-run budgets in code stop runaway loops in
    real time.

    ### A review checklist

    1. Each role lists only approved model and profile ARNs, in sync with the registry.
    2. Roles that call models hold no approval or signing secrets.
    3. Private endpoints are used where policy requires.
    4. CloudTrail is on; invocation logging is a deliberate, documented decision.
    5. Guardrails, if used, are versioned and tested.
    6. Budgets and tags are in place; per-run caps exist in code.

    ### Explaining it to a risk reviewer

    The question a reviewer is really asking is "what stops this going wrong, and how would we know?". The answer
    has three parts. What is possible at all: IAM lists the approved models, roles are split so the model-calling
    role holds no approval secret, and the network path is private where required. What is checked on every call:
    your code's caps, validation and approval gate, with guardrails as an extra filter. How you would know: CloudTrail
    for who called what, your audit rows for what each call was for and what happened to its output, and budgets and
    alerts for spend.
  exercise: |
    Write the IAM policy for a task role that may call two models from your registry (streaming and non-streaming),
    and a second policy for an approver role that may read one Secrets Manager secret and call no model. Then write
    three sentences for a risk reviewer on whether you would turn on model invocation logging, and why. Done when
    neither policy uses a wildcard resource, and the logging note names the data stored, where, and for how long.
  check:
  - id: m3q1
    prompt: What does the alt-data triage Terraform keep in sync with the model registry?
    options:
    - The approved_bedrock_model_arns list the task role may invoke
    - The S3 bucket names
    - The ECS task size
    - The Budgets alert email
    answer: 0
    explanation: The registry says which models code may ask for; IAM says which the role can call.
    evidence: the registry says which models code may ask for, IAM says which the role can actually call
  - id: m3q2
