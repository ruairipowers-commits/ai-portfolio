- id: m5
  title: Bedrock behind a model registry
  minutes: 20
  body: |
    Bedrock is often the production route for a pipeline that was built against a mock or a direct API: the code
    stays the same behind a model registry, and the AWS deployment points the alias at a Bedrock model ID.

    ### The switch, step by step

    The portfolio's projects document the same path:

    1. Build and test offline against the mock alias.
    2. Add a Bedrock entry to the registry with the model or inference-profile ID from the console, and its prices.
    3. Point the candidate alias at it and run the eval gate against the current primary.
    4. Add the model's ARN to the IAM list the deployment allows.
    5. Promote the alias in a reviewed change.

    Because Converse is model-neutral, step 2 is usually one entry, and the adapter is a few lines: `converse` with
    the system prompt, the user message and a token cap, then the text blocks joined and the usage returned.

    ### Quotas and throttling

    Quotas cover requests and tokens per minute, per model and region. Under load you will see
    `ThrottlingException`. In order:

    1. Let boto3 retry: `Config(retries={"mode": "standard", "max_attempts": 3})`, or `"adaptive"`, which also slows
       the client down when throttled.
    2. Pace batch work in your own code.
    3. Request quota increases ahead of launch.
    4. Consider a cross-region inference profile, where data policy allows processing in the profile's regions.
    5. Fall back to another alias when throttling persists, and record it.

    ### Fallback rules

    Fall back on throttling and service errors. Do **not** fall back on `AccessDeniedException` or
    `ValidationException`: they mean the configuration is wrong, and a fallback would hide that until the fallback
    breaks too. The capstone encodes this in a `FALLBACK_ON` set.

    ### Region and availability

    Model and feature availability varies by region, and new models can reach Bedrock later than the provider's own
    API. Before a launch, check that each registry model is available in your region with the features you use (tool
    use, documents, streaming), and run the eval there. A model that works in one region is not proof for another.

    ### Cost

    - On-demand pricing is per token; record prices in the registry from the Bedrock pricing page, and log tokens per
      call.
    - Batch inference exists for large offline jobs at a lower price; provisioned capacity exists for steady high
      volume. Evaluate both against your traffic before committing.
    - Compare cost per completed task, including retries and human fixes.

    ### Running on AWS compute

    Run the calling code on ECS Fargate, Lambda or Step Functions with an IAM role; no keys. Long agent runs suit a
    container (the trade-ops AWS path runs its agent on ECS Fargate); short, event-driven steps suit Lambda. Durable
    human approval waits map to Step Functions' `waitForTaskToken`.

    ### What "not exercised" means

    The trade-ops docs state that live Bedrock calls have not been exercised yet, because they need an account and
    model access. That honesty is worth copying: list what has been tested offline (request shapes, loop, caps,
    validation, fallback) and what still needs a live run (model quality on Bedrock, quotas, latency) before go-live.

    ### Keep the exit open

    Converse for model calls, your own code for orchestration, validation and approvals, and the registry for model
    choice: that combination keeps Bedrock's governance benefits while limiting lock-in to the parts you chose to
    manage there.

    ### A go-live checklist

    1. Each registry alias has a model or profile ID, prices and a passing eval on Bedrock in the target region.
    2. IAM allows exactly the registry ARNs; roles are split for approvals.
    3. Quotas are checked and increases requested; retries are configured.
    4. Fallback rules are tested: throttling falls back, access and validation errors do not.
    5. Audit rows, CloudTrail, budgets and alerts are in place.
    6. What was tested offline and what needs a live run is written down, and the live run is done.
  exercise: |
    Run the capstone's offline mode twice — normally and with SIMULATE_THROTTLE=1 — and read the audit log for each.
    Then change the simulated error to `AccessDeniedException` and confirm the run escalates instead of falling back.
    Done when you can show three audit traces (primary only; throttle then fallback; access error with no fallback)
    and explain why the third must not fall back.
