- id: m4
  title: Knowledge Bases for retrieval
  minutes: 20
  body: |
    Managed retrieval (RAG) over documents in S3 with Knowledge Bases is one of the use cases on the tech page.
    A Knowledge Base takes documents from a data source, parses and chunks them, embeds the chunks with an embedding
    model, stores the vectors in a vector store, and serves search over them.

    ### The parts

    - **Data source.** Usually an S3 bucket or prefix of documents. A sync (ingestion job) reads new and changed
      documents.
    - **Parsing and chunking.** Settings for how documents are split. Chunk size affects what a search can return:
      too small loses context, too large dilutes matches.
    - **Embedding model.** A Bedrock embedding model; the research Q&A project's AWS path uses Titan embeddings v2.
      Changing it means re-embedding everything.
    - **Vector store.** Where vectors live. OpenSearch Serverless is a common choice and the one the research Q&A
      project uses; other stores are supported. The store has its own cost, and some options charge while idle.

    ### Retrieving

    The runtime for Knowledge Bases is `bedrock-agent-runtime`. `retrieve` returns passages with their source and a
    score; you then build the answer with Converse, which keeps the answering step under your control:

    ```python
    kb = boto3.client("bedrock-agent-runtime", region_name="us-east-1")
    r = kb.retrieve(knowledgeBaseId="KB12345678",
                    retrievalQuery={"text": "Can a broker email change our bank details?"},
                    retrievalConfiguration={"vectorSearchConfiguration": {"numberOfResults": 5}})
    for hit in r["retrievalResults"]:
        print(round(hit["score"], 2), hit["location"]["s3Location"]["uri"], hit["content"]["text"][:80])
    ```

    The vector search configuration also accepts a search type: the research Q&A AWS path uses hybrid search
    (keyword plus vector), matching the BM25-plus-vectors fusion of its local build.

    There is also `retrieve_and_generate`, which retrieves and writes the answer in one call. It is quicker to start
    with; `retrieve` plus your own Converse call keeps the prompt, the model choice, validation and citations in your
    code and behind your model registry.

    ### Answering with citations

    1. Retrieve the top passages with their S3 URIs.
    2. Put them in the user content, each tagged with its source, and say they are data.
    3. Ask for an answer only from the passages, citing sources, and for "not found" when they do not answer it.
    4. Validate that every cited source was among the retrieved passages.

    ### What must not go in

    Embedding a document is AI processing. Documents whose licence or policy forbids that must not be uploaded to
    the data source. The research Q&A project keeps licence-barred documents out of the Knowledge Base entirely and
    suggests a separate keyword-only index if analysts need to find them.

    ### Measuring retrieval

    Write questions with the passage each should find and measure how often it appears in the top results. Tune
    chunking and the number of results against that, before touching prompts.

    ### Costs and lock-in

    - Embedding at ingestion is charged per token; re-syncing everything after a model change costs again.
    - The vector store has its own pricing; an OpenSearch Serverless collection has a minimum capacity that charges
      while idle, so delete experiments you are not using.
    - Managed features such as Knowledge Bases add AWS lock-in. Keeping the answering step in your own code with
      Converse limits that to the retrieval layer.

    ### Testing offline

    The Stubber works for `bedrock-agent-runtime` too: queue a `retrieve` response with a few passages and test your
    prompt building, citation checks and "not found" handling without a Knowledge Base.

    ### Keeping the index current

    A Knowledge Base only knows what the last sync ingested. Decide how documents arrive (a scheduled sync, or one
    triggered when files land in S3), how withdrawn documents are removed, and how you will notice a failed sync.
    Record in each answer which documents were retrieved, so that when a document is corrected or withdrawn you can
    find the answers that relied on it. For research content, a stale index is a quality problem and, if withdrawn
    material keeps appearing, a compliance one.
  exercise: |
    Write `answer(question)` that calls `retrieve`, builds a Converse request with the passages tagged by source, and
    checks that every cited source was retrieved. Test it offline with a Stubber on both clients: one `retrieve`
    response with two passages and one Converse reply citing one of them. Done when a reply citing a source that was not
    retrieved is rejected, and a reply citing a retrieved source is accepted.
