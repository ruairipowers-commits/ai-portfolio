    explanation: Validation, logging, budgets and approval apply identically to every provider.
    evidence: The same Pydantic model and business rules.
  - id: m5q2
    prompt: Why does the portfolio's OpenAI registry entry ship unapproved?
    options:
    - So the provider's terms are reviewed before anyone can call it
    - Because OpenAI models cannot be used
    - To make calls cheaper
    - Because the SDK requires it
    answer: 0
    explanation: The provider's terms are reviewed before anyone flips the approved flag.
    evidence: the portfolio's OpenAI entry ships unapproved for this reason
  - id: m5q3
    prompt: Which interface do many OpenAI-compatible services speak?
    options:
    - Chat Completions
    - The Responses API only
    - Embeddings only
    - None; each is unique
    answer: 0
    explanation: Bedrock and local servers such as Ollama offer OpenAI-compatible Chat Completions.
    evidence: Chat Completions, the earlier interface, is still widely used and is what many OpenAI-compatible services speak
  - id: m5q4
    prompt: How can you test the real adapter's request handling without a key?
    options:
    - Pass a fake HTTP transport such as httpx.MockTransport to the SDK's http_client
    - Use a production key with a low budget
    - Read the SDK source only
    - Call the API with an empty key
    answer: 0
    explanation: That is how the capstone was checked offline.
    evidence: Fake HTTP transports (httpx.MockTransport passed to the SDK's http_client) let you test the real adapter's request and response handling offline too
  - id: m5q5
