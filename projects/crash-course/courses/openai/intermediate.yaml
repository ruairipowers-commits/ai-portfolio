level: intermediate
version: 1
title: The OpenAI API in governed production in 4 hours
status: draft
source:
  page: tech/openai.md
  docs: https://developers.openai.com/api/docs
provenance:
  written_by: Claude (build session, 3 Nov 2026), from the site's OpenAI API page and the Familiar level
sections:
- id: modules
  heading: How the four hours fit together
  body: |
    Beginner had you route messages with one validated call. This level builds the rest of a production workflow:
    understanding every part of a response, function-calling loops that cannot run away, structured outputs backed
    by evals, embeddings for search and routing, and one governed interface across providers. Five modules, each
    with an exercise and a five-question check (pass mark 80%), then a 90-minute capstone and a final test.

    | Module | What you learn | Time |
    |---|---|---|
    | m1 The Responses API in depth | input and output items, status, state, streaming, errors | 20 min |
    | m2 Function calling with limits | tool definitions, the call / output loop, caps, allow-lists | 20 min |
    | m3 Structured outputs and evals | strict schemas, refusals, validation, measuring accuracy | 20 min |
    | m4 Embeddings for search and routing | vectors, similarity, nearest-example routing, storage | 20 min |
    | m5 One interface, many providers | registries, logging, cost, data controls, switching models | 20 min |

    **Pacing.** m1 and m2 first. m3 and m4 are independent. m5 sets up the capstone. Every exercise can be done
    offline with a mock; with an API key and a pinned model name you can run the same code for real.
- id: production
  heading: Running OpenAI calls for real
  body: |
    **Security and data.**
    - Keys per project and environment, in a secrets manager, with budget limits set and a revocation plan.
    - The hosted API means data leaves your network. Send only what the task needs, check the data-retention and
      storage settings for your account, and set `store=False` on requests when you do not want responses kept for
      later retrieval.
    - Treat messages, documents and tool results as data. Keep write actions behind approvals the model cannot
      reach.

    **Reliability.**
    - Check `status` on every response; handle incomplete responses and refusals explicitly.
    - Let the SDK retry rate-limit and server errors; set timeouts; keep a fallback alias for outages.
    - Validate every structured output against business rules before use.

    **Scaling and cost.**
    - Rate limits and quotas apply per project and model; pace batch jobs, and use the batch interface for large
      work that can wait.
    - Log tokens per call, alias and step; per-token cost needs monitoring at volume.
    - Keep long, stable instructions at the start of requests so repeated prefixes can be reused by the
      platform's prompt caching.

    **Observability.** One audit row per call: alias, model, response ID, status, tokens, cost, function calls made,
    validation result.

    **Upgrades.** Model names and defaults change; pin and re-test. Run the labelled eval before switching a model,
    a prompt or a major SDK version.
- id: alternatives
  heading: Alternatives and when to pick each
  body: |
    | Option | What it is | Pick it when |
    |---|---|---|
    | OpenAI API directly | OpenAI's hosted models and Responses API | the task suits their models and data policy allows a hosted API |
    | OpenAI models through a cloud platform | some clouds list OpenAI models; Bedrock, for example, lists them with an OpenAI-compatible Chat Completions API | data must stay in that cloud account |
    | Anthropic Claude API | Anthropic's models | a second provider, or the task suits Claude |
    | Amazon Bedrock | many providers behind one AWS API | your firm is on AWS and wants IAM, logging and one bill |
    | A local model with Ollama | open models on your hardware, with an OpenAI-compatible endpoint | data must not leave the machine and the task is narrow |

    Because so many tools speak an OpenAI-compatible API, the OpenAI SDK is often the client for several providers.
    That is convenient, and also a reason to keep provider choice in a registry: the same client code may be
    talking to very different models.

    The choice is rarely all or nothing. A common shape is a hosted model for hard, low-volume steps, a cheaper or
    local model for high-volume classification, embeddings from whichever provider the data policy allows, and a
    mock for CI, all chosen per step by alias and justified by the same labelled eval.
- id: in_portfolio
  heading: How this portfolio uses the OpenAI API
  body: |
    The **alt-data vendor triage** project calls models through a model registry. Business code references
    aliases; `config/models.yaml` maps each alias to a provider, a model ID, prices and an approval flag.

    - **OpenAI is one provider** behind that registry, selected by alias alongside a deterministic offline mock,
      Anthropic and Bedrock. The default is the mock, so the project runs with no keys.
    - **Not approved by default.** The OpenAI entry ships with `approved: false` and a placeholder model ID, with a
      note to flip it after legal and security review of the provider terms. An unapproved model cannot be
      resolved, so nobody can call it by accident.
    - **The provider adapter** calls Chat Completions with a system and a user message, asks for a JSON object
      response, caps output tokens, and returns the text with prompt and completion token counts.
    - **Validation is the same for every provider.** Pydantic validates whatever comes back, and deterministic
      guardrails run after the model, so switching provider does not change what counts as an acceptable memo.
    - **Budgets and fallback** apply to every alias: a pre-flight cost check, retries with backoff and a fallback
      alias.

    The site's OpenAI page names the Responses API as the main entry point for new work; this course teaches it,
    and m5 shows how an adapter like the portfolio's fits either API behind the same registry.
- id: capstone
  heading: 'Capstone: a governed client-desk agent with an eval (90 minutes)'
  body: |
    You will build an agent for an asset manager's client-service desk on the Responses API: it reads a message,
    looks up the account with a read-only function when an ID is present, returns a validated routing decision,
    and is checked by a business rule that the client name matches the account record. Every call is logged. A
    labelled set of five messages measures accuracy, and escalations count as wrong. A rules-based mock alias makes
    the whole thing run offline.

    | Criterion | What good looks like |
    |---|---|
    | Aliases | Business code names an alias; provider and model live in one registry |
    | Function loop | Function calls are answered with matching `call_id`s; only allow-listed functions run |
    | Caps | A tool-call cap ends the run with an escalation, never a loop |
    | Structured output | The decision is a validated Pydantic object; status is checked before use |
    | Business rule | A decision whose client name contradicts the account record escalates |
    | Data controls | Requests set `store=False`; messages and tool results are wrapped as data |
    | Audit | One JSON line per call with model, response ID, status, tokens and function calls |
    | Eval | Accuracy over a labelled set is printed; escalations count as wrong |
- id: interview
  heading: Scenario interview questions
  body: |
    - **"Routing accuracy dropped after a model update."** Compare the labelled eval on old and new models, look at a
      confusion table by queue, check whether instructions need changes, and keep the old alias until the gate
      passes.
    - **"The agent called the account lookup ten times."** A tool-call cap that escalates, a clearer function
      description, and the audit log to see why it repeated.
    - **"Legal asks whether we keep client messages at OpenAI."** Explain the request's storage setting (`store=False`),
      the account's retention terms, what is sent (minimised), and where your own logs keep the data.
    - **"We need to route by meaning, with no labels for new queues yet."** Embeddings of a few example messages per
      queue, nearest-example routing with a confidence threshold, and "other" for low similarity, reviewed by people.
    - **"Can we swap to another provider quickly?"** Yes if calls go through registry aliases with the same validation
      and logging; run the eval on the new alias, then switch.
    - **"Costs are growing faster than volume."** Tokens by alias and step, trimmed inputs, stable instructions first
      for caching, the batch interface for backlogs, and a smaller model where the eval allows.
- id: further_learning
  heading: Further learning
  body: |
    - [OpenAI API documentation](https://developers.openai.com/api/docs) — the official reference from OpenAI.
    - [Developer quickstart](https://developers.openai.com/api/docs/quickstart) — keys, SDKs and a first call.
    - [OpenAI Python SDK on GitHub](https://github.com/openai/openai-python) — examples, error types and changelog.
    - In the docs, read the guides on **structured outputs**, **function calling**, **embeddings** and **batch**
      processing.
modules:
- id: m1
  title: The Responses API in depth
  minutes: 20
  body: |
    The Responses API takes input and returns a response made of output items. Knowing those items, and the fields
    around them, is what separates a demo from code that behaves on bad days.

    ### The request

    ```python
    response = client.responses.create(
        model=MODEL,
        instructions="You route client messages for an asset manager's service desk.",
        input=[{"role": "user", "content": "<message>Our Q3 report is late.</message>"}],
        max_output_tokens=500,
        store=False,
    )
    ```

    - **model** — the exact name, from config.
    - **instructions** — the standing rules, apart from the data.
    - **input** — a string, or a list of items: messages with roles, images, earlier turns, function call outputs.
    - **max_output_tokens** — a cap on the reply; a reply that hits it is incomplete.
    - **store** — whether the response is kept for later retrieval; set it deliberately.

    ### The response

    A response has an `id`, a `status`, the `model` that answered, `usage`, and `output`: a list of items. Common
    item types are `message` (with text content) and `function_call` (m2); reasoning models can add reasoning items.
    `output_text` joins the text of the message items, which is all you need for plain answers.

    ### Status

    | Status | Meaning | What your code does |
    |---|---|---|
    | `completed` | finished | validate and use |
    | `incomplete` | stopped early, for example at the output cap | do not treat as complete; check the incomplete details, raise the cap or shorten the task |
    | `failed` | an error occurred | log and retry or fall back |
    | others (such as in progress, for background runs) | not finished yet | wait or poll |

    The safe default for anything unexpected is to stop and escalate, not to guess.

    ### Conversation state

    Two ways to continue a conversation:

    1. **Send the history yourself.** Keep the list of input items and append the previous output items and the next
       user message. You control exactly what the model sees, and nothing has to be stored by the provider.
    2. **Chain with `previous_response_id`.** Pass the ID of the previous response and only the new input; the API
       uses the stored context. Simpler, but it needs responses to be stored.

    For governed workflows, the first is usually easier to reason about and audit, and pairs with `store=False`.

    ### Streaming

    With `stream=True`, the SDK yields events as the response is generated: text deltas, item boundaries and a final
    completed event. Use it when a person is watching the answer appear; batch work is simpler without it.

    ### Errors

    The SDK raises typed exceptions; catch the specific ones first:

    ```python
    import openai

    try:
        response = client.responses.create(...)
    except openai.BadRequestError:        # 400: fix the request; retrying will not help
        ...
    except openai.AuthenticationError:    # 401: bad or missing key
        ...
    except openai.RateLimitError:         # 429: back off, or fall back
        ...
    except openai.APIStatusError as e:    # other HTTP errors; 5xx are worth a retry
        ...
    except openai.APIConnectionError:     # network trouble
        ...
    ```

    The SDK retries connection errors, rate limits and server errors a couple of times by default;
    `client.with_options(max_retries=..., timeout=...)` changes that per call. Do not retry 400-class errors other
    than rate limits.

    ### IDs for the audit trail

    Log the response `id` with every call; the SDK also exposes the HTTP request ID (`response._request_id`) for
    support. Together with the model name and usage, they let you answer "which model produced this, when, at what
    cost?".

    ### Prompt structure that holds up

    Instructions in `instructions`; data in the input, wrapped in tags, with the instructions saying it is data. Say
    what to do when information is missing ("use null"). Keep instructions stable and put variable details in the
    input; that also helps the platform reuse repeated prefixes. Version your instructions in files and log the
    version with each call.

    ### A response, annotated

    For the capstone's first turn on an urgent trade message, a response looks like this in outline: `status` is
    `completed`; `output` holds one `function_call` item named `get_account` with `arguments` set to a JSON string
    containing the account ID, and a `call_id`; there is no message item yet, so `output_text` is empty; `usage`
    reports the input and output tokens. The second response, after you send the function output, holds a
    `message` item whose text is the decision in your schema, and `output_parsed` is filled. Reading responses this
    way — item by item — is how you debug a loop that does something unexpected.
  exercise: |
    Write `call(input_items) -> dict` that sends a request with `store=False`, returns `output_text`, status, usage
    and the response ID, and raises an `Escalate` exception for any status other than `completed`. Test it offline by
    pointing the SDK at a fake HTTP transport (`httpx.MockTransport`) that returns a completed response, then an
    incomplete one. Done when the completed case returns text and the incomplete case escalates.
  check:
  - id: m1q1
    prompt: What does output_text give you?
    options:
    - The text of the message items in the output, joined
    - The function calls the model made
    - The token usage
    - The response status
    answer: 0
    explanation: It is all you need for plain answers; other items need their own handling.
    evidence: output_text joins the text of the message items, which is all you need for plain answers.
  - id: m1q2
    prompt: A response comes back with status incomplete. What should your code do?
    options:
    - Not treat it as complete; check the details, raise the cap or shorten the task
    - Use output_text as normal
    - Retry forever
    - Delete the response
    answer: 0
    explanation: An incomplete reply may be cut off at the output cap.
    evidence: do not treat as complete; check the incomplete details, raise the cap or shorten the task
  - id: m1q3
    prompt: Why is sending the history yourself often easier to audit than previous_response_id?
    options:
    - You control exactly what the model sees, and nothing has to be stored by the provider
    - It is the only way to use instructions
    - previous_response_id is not part of the API
    - It makes calls cheaper by design
    answer: 0
    explanation: It also pairs with store set to False.
    evidence: You control exactly what the model sees, and nothing has to be stored by the provider.
  - id: m1q4
    prompt: Which error should not be retried?
    options:
    - BadRequestError (400)
    - RateLimitError (429)
    - APIConnectionError
    - A 503 server error
    answer: 0
    explanation: Fix the request; retrying a 400 will fail the same way.
    evidence: 'openai.BadRequestError: # 400: fix the request; retrying will not help'
  - id: m1q5
    prompt: What does store control on a request?
    options:
    - Whether the response is kept for later retrieval
    - Whether the model is cached on your laptop
    - Whether usage is reported
    - Whether output is streamed
    answer: 0
    explanation: Set it deliberately for governed workflows.
    evidence: whether the response is kept for later retrieval; set it deliberately
- id: m2
  title: Function calling with limits
  minutes: 20
  body: |
    Function calling lets the model ask your code to look things up or propose actions. The model returns a call;
    your code decides whether to run it. Everything that keeps an agent safe sits in your code.

    ### Defining a function

    ```python
    TOOLS = [{
        "type": "function",
        "name": "get_account",
        "description": "Read-only. Look up an account by ID (AC- plus four digits): client name, tier, open trades.",
        "parameters": {"type": "object", "properties": {"account_id": {"type": "string"}},
                       "required": ["account_id"], "additionalProperties": False},
        "strict": True,
    }]
    ```

    The name and description are what the model reads; say what comes back and that it is read-only. `strict: True`
    asks for arguments that match the schema exactly, which needs every property listed in `required` and
    `additionalProperties` set to false.

    ### The loop

    1. Send the request with `tools`.
    2. Look through `response.output` for items of type `function_call`. Each has a `name`, `arguments` (a JSON
       string) and a `call_id`.
    3. Check the name against your allow-list, parse the arguments with `json.loads`, and run the function.
    4. Add the model's output items to your input list, then one `function_call_output` item per call, with the
       same `call_id` and the result as a string.
    5. Send again. Stop when there are no more function calls, or when a cap is hit.

    ```python
    calls = [o for o in resp.output if o.type == "function_call"]
    items += resp.output
    for call in calls:
        result = run_tool(call.name, json.loads(call.arguments))
        items.append({"type": "function_call_output", "call_id": call.call_id, "output": json.dumps(result)})
    ```

    The model may make several calls in one response. Answer all of them before sending again; each output must
    carry the `call_id` it answers.

    ### Errors as results

    If a function fails, still send an output, with an error the model can act on (`{"error": "unknown account
    AC-9999"}`). Raising an exception ends the run; dropping the output leaves a call unanswered. An error result
    lets the model try another ID or finish without the lookup.

    ### Limits that belong in your loop

    - **Allow-list.** Run only the functions you offered in this context. An unknown name gets an error result.
    - **Tool-call cap.** Count calls per run and escalate at the cap. The capstone uses 3.
    - **Budget.** Add up tokens and cost per run and stop at a limit.
    - **No writes in the loop.** Give the model lookups; put actions that change systems behind a person's approval.

    ### tool_choice

    `tool_choice` defaults to `auto`, where the model decides. You can require a call or disable tools for a
    request. Prefer `auto` with clear instructions ("if the message has an account ID, look it up first"), and
    handle the case where the model did not call a function you expected.

    ### Function calls and structured output together

    A request can carry both `tools` and a structured output format. The model calls functions while it needs facts,
    then returns its final message in the schema. With `client.responses.parse`, `output_parsed` is filled on the
    final response, the one with no function calls. The capstone uses this pattern.

    ### Results are untrusted

    A function result may contain text that tries to steer the model. Say in the instructions that tool results are
    data, keep writes out of reach, and check the final decision with a rule that does not depend on the model — the
    capstone's rule that the client name must match the account record is an example.

    ### Reading a trajectory

    Log each response's function calls. A sequence such as the same lookup three times in a row usually means an
    unclear description or a result the model could not use; fix the function, not the cap.

    ### Designing functions the model uses well

    - **Verb plus object names:** `get_account`, `list_open_trades`. Avoid vague names such as `query`.
    - **Small, flat parameters:** one or two typed fields beat a nested object.
    - **Small results:** return the fields the decision needs, not whole records; results go into the context and
      cost tokens on every later turn.
    - **Deterministic results** for the same input, so runs can be replayed and tested.
    - **Separate reads from writes.** A single function that can read or write hides the dangerous part inside an
      argument.
  exercise: |
    Build a loop with one read-only function and a fake transport that first returns a call to a function you did
    not define, then a valid call, then a final message. Done when the unknown function gets an error output without
    running anything, the valid call is answered with the matching `call_id`, and a cap of 1 escalates.
  check:
  - id: m2q1
    prompt: What must each function_call_output carry?
    options:
    - The call_id of the call it answers
    - The model name
    - The API key
    - The function's description
    answer: 0
    explanation: Outputs are matched to calls by call_id.
    evidence: each output must carry the call_id it answers
  - id: m2q2
    prompt: In what form do function arguments arrive?
    options:
    - A JSON string, to parse with json.loads
    - A Python object ready to use
    - XML
    - A list of tokens
    answer: 0
    explanation: Parse the string, then validate before running the function.
    evidence: Each has a name, arguments (a JSON string) and a call_id.
  - id: m2q3
    prompt: What does strict True require of the parameters schema?
    options:
    - Every property listed in required, and additionalProperties set to false
    - No properties at all
    - A tool_choice that forces the function
    - Arguments in XML
    answer: 0
    explanation: Strict mode guarantees arguments match the schema exactly.
    evidence: which needs every property listed in required and additionalProperties set to false
  - id: m2q4
    prompt: A function fails for an unknown account. What should the loop send back?
    options:
    - An output with an error the model can act on
    - Nothing
    - An exception that ends the run
    - A made-up account record
    answer: 0
    explanation: An error result lets the model try another ID or finish.
    evidence: still send an output, with an error the model can act on
  - id: m2q5
    prompt: With tools and text_format together, when is output_parsed filled?
    options:
    - On the final response, the one with no function calls
    - On every response, including those with function calls
    - Never; the two cannot be combined
    - Only when streaming
    answer: 0
    explanation: The model calls functions while it needs facts, then answers in the schema.
    evidence: output_parsed is filled on the final response, the one with no function calls
- id: m3
  title: Structured outputs and evals
  minutes: 20
  body: |
    Structured outputs constrain a reply to a JSON Schema you supply, which reduces parsing failures. But a valid
    shape is not a correct answer. This module covers both halves: getting the shape right, and measuring whether the
    content is right.

    ### Strict schemas

    With `responses.parse(..., text_format=Model)`, the SDK builds a strict JSON Schema from a Pydantic model. Strict
    mode has rules worth knowing:

    - Every field is required. To make a field optional, allow `null`: `account_id: str | None`.
    - No extra fields: `additionalProperties` is false.
    - Use `Literal` (enums) for fixed choices, and keep nesting shallow.
    - Field descriptions (`Field(description=...)`) reach the model and are a good place for short rules such as
      "From get_account only, else null".

    If you write the schema by hand, put it in the request's text format with `"type": "json_schema"` and
    `"strict": True`, then parse and validate the text yourself.

    ### Refusals and incomplete replies

    A model can decline a request instead of answering; the output then carries a refusal rather than text that
    matches your schema, and `output_parsed` will not hold a decision. A reply cut off at the output cap is
    incomplete. Handle both before using the result: check `status`, check that a parsed object exists, and escalate
    otherwise.

    ### Validation beyond the schema

    The schema checks types and enums. Business rules check meaning:

    - An `account_id`, when present, matches `AC-\d{4}` and exists.
    - A `client_name` equals the name in the account record (the capstone's rule).
    - High urgency on a complaint always notifies the desk lead (a rule in code, from Beginner).

    Put these in plain functions with tests. When a rule fails, escalate to a person with the rule's message; never
    silently "fix" a field, because that hides the problem from the audit.

    ### Measuring accuracy

    Structured outputs make evaluation easy: compare fields with labels.

    1. **Build a labelled set.** Real-looking messages (with sensitive details replaced), labelled by someone who
       does the job, covering every queue, including "other" and a few traps.
    2. **Run every alias on it** with the same instructions and validation.
    3. **Score.** Accuracy overall, and a confusion table (which queues get mixed up). Count escalations and errors as
       wrong, never as skipped.
    4. **Gate.** Decide the threshold before you look at results, put it in code, and run it in CI when the model,
       instructions or SDK change.

    ```python
    from collections import Counter

    confusion = Counter((label, decide(alias, text).queue) for text, label in GOLDEN)
    for (want, got), n in sorted(confusion.items()):
        print(f"{want:<11} -> {got:<11} {n}")
    ```

    ### What to do with the results

    - **Mixed-up pairs** (reporting vs complaints, say) usually need a clearer instruction or an extra example in
      the instructions, not a bigger model.
    - **Low confidence or "other"** should go to a person; track how often.
    - **A new model** is promoted only if it passes the gate and does not raise the escalation rate.

    ### Growing the set

    Every misroute found in production becomes a new labelled case. Over time the labelled set is the most valuable
    part of the system, because it says what "correct" means for your desk.

    ### Testing without a key

    Pydantic models and rule functions are plain code: test good and bad examples offline. The model's part is tested
    by the eval, which needs a key, or by a mock alias in CI to check the harness itself works.

    ### A worked example

    The message "This is unacceptable, the report is late again" mentions a report, so a model may route it to
    reporting. The labelled set says complaints, because the client is angry and the desk lead must see it. If the
    eval shows that confusion, the fix is an instruction such as "A message that expresses dissatisfaction is a
    complaint, whatever its topic", plus that message added to the labelled set. Re-run the eval; if accuracy on
    complaints rises and nothing else falls, keep the change.
  exercise: |
    Extend the capstone's GOLDEN list to ten labelled messages, including two traps (a complaint that mentions a
    report; a message with a malformed account ID). Add a confusion table to the eval output and a gate of 80%. Done
    when the mock alias's run prints the table, the gate result, and at least one row where the mock gets a trap wrong.
  check:
  - id: m3q1
    prompt: In strict mode, how do you make a field optional?
    options:
    - Allow null, for example str | None
    - Leave it out of the schema
    - Set additionalProperties to true
    - Add it after parsing
    answer: 0
    explanation: Every field is required in strict mode; null expresses "not present".
    evidence: 'Every field is required. To make a field optional, allow null: account_id: str | None.'
  - id: m3q2
    prompt: The model refuses a request. What will output_parsed hold?
    options:
    - No decision, so code must check and escalate
    - A decision with default values
    - The refusal text parsed into your schema
    - The previous response's decision
    answer: 0
    explanation: The output carries a refusal rather than text matching your schema.
    evidence: output_parsed will not hold a decision
  - id: m3q3
    prompt: A business rule fails on a parsed decision. What should happen?
    options:
    - Escalate to a person with the rule's message
    - Silently fix the field
    - Retry until the rule passes
    - Ignore the rule
    answer: 0
    explanation: Fixing silently hides the problem from the audit.
    evidence: When a rule fails, escalate to a person with the rule's message
  - id: m3q4
    prompt: What does a confusion table show?
    options:
    - Which queues get mixed up with which
    - How much each call cost
    - Which model is fastest
    - How many tokens each queue uses
    answer: 0
    explanation: Mixed-up pairs often need clearer instructions, not a bigger model.
    evidence: Accuracy overall, and a confusion table (which queues get mixed up).
  - id: m3q5
    prompt: When should the eval gate's threshold be decided?
    options:
    - Before you look at results, written in code
    - After seeing which model scores best
    - Never; judge by feel
    - Only after launch
    answer: 0
    explanation: Then the decision is the gate's, and it runs in CI.
    evidence: Decide the threshold before you look at results, put it in code
- id: m4
  title: Embeddings for search and routing
  minutes: 20
  body: |
    Embeddings turn text into vectors so that texts with similar meaning sit close together. One provider for
    embeddings and generation is one of the pros on the tech page; this module shows two uses: semantic search and
    routing by nearest example.

    ### Getting vectors

    ```python
    resp = client.embeddings.create(model=EMBED_MODEL, input=["Q3 report missing fees", "Wrong trade quantity"])
    vectors = [d.embedding for d in resp.data]
    ```

    `EMBED_MODEL` is an embedding model name from the docs, such as one of the text-embedding models. Send many
    strings in one request; it is faster than one at a time. Usage reports the input tokens, which is what you pay
    for.

    ### Similarity

    ```python
    import math

    def cosine(a, b):
        dot = sum(x * y for x, y in zip(a, b))
        return dot / (math.sqrt(sum(x * x for x in a)) * math.sqrt(sum(y * y for y in b)))
    ```

    Higher means more similar. Compare a query vector with stored vectors and take the best matches.

    ### Semantic search

    Embed each passage of your documents once, store the vectors with the passage's source, and at query time embed
    the question and return the closest passages. Up to a few thousand passages, a list and a linear scan are fine;
    beyond that, use a vector index such as pgvector in Postgres or sqlite-vec in SQLite.

    ### Routing by nearest example

    When you have a few example messages per queue but not enough for a full labelled set, embed the examples, and
    route a new message to the queue of its most similar example:

    ```python
    EXAMPLES = {"reporting": ["Our quarterly statement is missing", "Fee breakdown not in the report"],
                "trading": ["Trade shows the wrong quantity", "Order not filled at the agreed price"]}

    def route(text, threshold=0.5):
        q = embed([text])[0]
        best = max(((cosine(q, v), queue) for queue, vs in EXAMPLE_VECTORS.items() for v in vs))
        return best[1] if best[0] >= threshold else "other"
    ```

    The threshold sends low-similarity messages to "other" for a person. Choose it on labelled data, not by guess.
    Embedding-based routing is cheap and fast; a generation model is better when routing depends on reading the
    message carefully. A common design uses embeddings first and the model only when similarity is low.

    ### Rules that save pain

    - **One model per index.** Vectors from different models are not comparable. Record the model with the index and
      rebuild if it changes.
    - **Chunk sensibly.** Passages of a few sentences to a few paragraphs, with the title in each chunk.
    - **Keep the source** of every vector so answers and routes can be explained.
    - **Protect the index** like the documents: vectors are derived from your text and sit under the same rules.

    ### Measuring retrieval

    Write ten questions with the passage each should find and measure how often it is in the top k. If retrieval is
    poor, no prompt will fix the answers built on it.

    ### Cost and data

    Embedding is usually cheap compared with generation, but a full re-embed of a large corpus is not; re-embed only
    when the model or chunking changes. The text you embed is sent to the provider like any other request, so the
    same data rules apply. If documents must not leave the machine, use a local embedding model instead (the Ollama
    course covers this).

    ### Search over your own documents, end to end

    1. Split each document into passages; keep the document ID, title and position with each.
    2. Embed the passages in batches; store vector, text and source together, plus the embedding model's name.
    3. At query time, embed the question, take the top few passages by similarity, and put them in the input of a
       Responses API call with their sources.
    4. Instruct the model to answer only from the passages and cite them, and to say so when they do not contain
       the answer.
    5. Measure retrieval (top-k hit rate) and answer quality separately, so you know which half to fix.
