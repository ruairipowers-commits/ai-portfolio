- id: m5
  title: One interface, many providers
  minutes: 20
  body: |
    Most firms end up with more than one model provider, for cost, capability or resilience. The practical pattern
    is to keep provider SDK calls behind one interface.

    ### The registry

    An alias such as `memo-drafter` or `desk-primary` maps to a provider and model ID in config. Business code asks
    for the alias:

    ```python
    REGISTRY = {"desk-primary": {"provider": "openai", "model": "..."},
                "desk-claude": {"provider": "anthropic", "model": "..."},
                "desk-mock": {"provider": "mock", "model": "mock-rules-v1"}}
    ```

    Each provider gets a small adapter with the same signature (input in, text or a validated object plus usage
    out). The alt-data triage project has exactly this: mock, Anthropic, OpenAI and Bedrock adapters behind one
    `complete` call.

    ### What stays the same whoever answers

    - **Validation.** The same Pydantic model and business rules. A valid shape from one provider is checked exactly
      as from another.
    - **Logging.** One audit row per call: alias, provider, model, response or request ID, tokens, cost, status.
    - **Budgets.** Prices per model in the registry; a pre-flight check against a per-run budget; unpriced models
      refused.
    - **Approval.** An `approved` flag per model, so a new provider's terms are reviewed before anyone can call it;
      the portfolio's OpenAI entry ships unapproved for this reason.

    ### Responses or Chat Completions

    The Responses API is OpenAI's main entry point for new work. Chat Completions, the earlier interface, is still
    widely used and is what many OpenAI-compatible services speak — Bedrock lists an OpenAI-compatible Chat
    Completions API, and local servers such as Ollama offer one. An adapter can use either; what matters is that the
    registry records which one each alias uses, and the eval runs on that path.

    ### Data controls

    Decide per alias: what is sent (minimised), whether responses are stored (`store=False` on Responses), the
    provider's retention terms for your account, and which region or cloud the data goes to. Write it in the
    registry's documentation so a reviewer can see it.

    ### Cost and limits

    - Log tokens per alias and step; review the top costs monthly.
    - Use the batch interface for large work that can wait; it is priced lower than individual calls.
    - Keep stable instructions first so repeated prefixes can be reused.
    - Handle rate limits with backoff and a fallback alias, and record every fallback.

    ### Switching models safely

    1. Point a candidate alias at the new model.
    2. Run the labelled eval on the candidate and the current primary.
    3. Compare accuracy, escalation rate, cost and latency against a gate written in advance.
    4. Promote by changing the primary alias in a reviewed change.
    5. Watch the audit log: escalations, fallbacks, cost per task.

    ### Testing the interface

    A mock alias that returns the same types lets every part — loop, caps, validation, logging, eval — run in CI
    with no keys and no cost. Fake HTTP transports (`httpx.MockTransport` passed to the SDK's `http_client`) let you
    test the real adapter's request and response handling offline too, which is how the capstone was checked.

    ### Keep it thin

    The interface owns plumbing: model choice, data path, cost, reliability, checking and audit. Instructions,
    tools and task logic stay in each workflow. If the wrapper grows workflow-specific branches, split them out.

    ### What a reviewer will ask

    A risk or security reviewer looking at a multi-provider setup usually asks the same questions: which providers
    are approved and on what terms; what data each alias sends and where it goes; how a model change is tested and
    who approves it; what happens when a provider is down; and how to find, for any output, which model produced
    it and what it cost. A registry with an approved flag, documented data controls per alias, an eval gate, a
    fallback and an audit row per call answers all five, and that is the point of building it this way.
  exercise: |
    Add a second provider adapter to the capstone (a second mock with different rules, or a real Anthropic or
