course: mcp
level: intermediate
version: 1
title: MCP servers you can trust in production in 4 hours
status: draft
source:
  page: tech/mcp.md
  docs: https://modelcontextprotocol.io/
provenance:
  written_by: Claude (build session, 3 Nov 2026), from the site's Model Context Protocol page and the Familiar level
sections:
- id: modules
  heading: How the four hours fit together
  body: |
    Beginner had you build a read-only server and a client that discovers and calls it. This level is about the
    decisions that make a server safe to put in front of an agent that works with real systems. Five modules, each
    with an exercise and a five-question check (pass mark 80%), then a 90-minute capstone and a final test.

    | Module | What you learn | Time |
    |---|---|---|
    | m1 The protocol underneath | JSON-RPC, the lifecycle, capabilities, versions, what crosses the wire | 20 min |
    | m2 Designing tools a model uses well | names, descriptions, schemas, structured output, errors, annotations | 20 min |
    | m3 Resources, prompts and client features | when data should be a resource, prompts as products, sampling and elicitation | 20 min |
    | m4 Transports and deployment | stdio vs Streamable HTTP, authentication, running and versioning servers | 20 min |
    | m5 Security and governance | scopes, approval-gated writes, injection, vetting servers, logging | 20 min |

    **Pacing.** m1 and m2 are the foundation; do them first and in order. m3 and m4 are independent. m5 sets up the
    capstone, so do it last. Keep one virtual environment with `mcp` installed; every example runs offline over
    stdio with the Python SDK, and the same ideas apply in the TypeScript SDK the trade-ops server uses.
- id: production
  heading: Running MCP servers for real
  body: |
    An MCP server is a program with access to your systems that an AI application drives. Run it like one.

    **Security.**
    - Give each server the least access it needs: a read-only database user for lookup tools, a separate process or
      scope for writes.
    - Validate every argument beyond the schema where it matters: IDs against a pattern, amounts against limits.
    - Never trust a write because the model asked for it. Check an approval the server can verify, such as a signed
      token over the exact fields being written.
    - Keep secrets in the server's environment, not in tool arguments or results.

    **Reliability.**
    - Tools should be fast and bounded: time out calls to slow back ends and return an error result instead of
      hanging the host.
    - Make writes idempotent with an ID supplied by the caller, so a retry does not write twice.
    - Return errors as tool results the model can read, and log the details on the server.

    **Scaling.** A stdio server is one process per host connection; that scales with the number of hosts, which is
    usually fine for local and per-agent use. A shared server over Streamable HTTP scales like any web service:
    run several instances behind a load balancer, keep them stateless where you can, and put authentication in
    front.

    **Cost.** MCP itself costs nothing, but every tool result goes into the model's context. Return the fields the
    model needs, not whole records, and page long lists.

    **Observability.** Log one structured line per call on the server (tool, arguments, caller, duration, outcome)
    to stderr or your log pipeline. The host should log the same call from its side, with the run or thread ID, so
    the two can be joined.

    **Upgrades.** The protocol is still evolving between versions, and SDK major versions rename things. Pin the
    SDK, test the server with a scripted client in CI, and check which protocol versions your hosts support before
    upgrading.
- id: alternatives
  heading: Alternatives and when to pick each
  body: |
    | Option | What it is | Pick it when |
    |---|---|---|
    | Function definitions in the agent's code | tools defined inline and passed to the model API | one agent, one language, tools nobody else needs |
    | A provider's built-in or hosted tools | tools the model vendor runs for you | the vendor already offers what you need (such as web search) and data policy allows it |
    | A plain REST or gRPC API | an ordinary service the agent's code calls | the consumer is regular software, or you want no AI-specific protocol |
    | OpenAPI-described tools | tool definitions generated from an API spec | you already have a well-described API and one client framework |
    | An MCP server | a separate process with a declared, discoverable interface | several hosts or agents need the same tools, the tools live in another language or process, or the tool list must be reviewed on its own |

    MCP's value grows with the number of hosts. For a single prototype with two functions, inline tools are less
    to run. Once a second agent, an IDE or another team wants the same tools, a server pays for itself.
- id: in_portfolio
  heading: How this portfolio uses MCP
  body: |
    The **trade-ops exception agent** gets every tool from an MCP server written in TypeScript with
    `@modelcontextprotocol/sdk` over stdio, loaded into its LangGraph agent through langchain-mcp-adapters.

    - **Scopes per process.** The server reads `MCP_TOOL_SCOPE`. With `read`, it registers seven read-only lookup
      tools on a read-only database handle; that is what the investigating agent gets. With `read,write`, it also
      registers `record_resolution`.
    - **The model never sees the write tool.** The investigation starts the server with read scope only, so the write
      tool does not exist for the model. The write-scoped process is started only when a human decision resumes the
      graph.
    - **The write verifies its own approval.** `record_resolution` requires an approval token: an HMAC over the
      resolution fields, the approver, an approval ID and an expiry, minted by the human-approval step. A missing,
      expired or mismatched token is refused.
    - **Schema-checked inputs.** IDs are validated with a pattern in the tool's input schema (zod in TypeScript)
      before any query runs.
    - **Errors as results.** Failures come back as tool results with `isError` set, so the agent can escalate
      instead of crashing; a truncated custodian payload, for example, leads to an escalation, not a guess.
- id: capstone
  heading: 'Capstone: a scoped trade-ops server with an approval-gated write (90 minutes)'
  body: |
    You will build the pattern above in Python: one server with a read scope and a write scope, structured output
    for lookups, a pattern-checked ID, logs on stderr, and a write tool that accepts only a valid, unexpired
    approval token for the exact fix. A harness plays the host: it investigates with read scope, simulates a person
    approving, then starts a write-scoped process and shows that a tampered fix is refused and the approved one is
    recorded. Try your own design first; the reference is in the project.

    | Criterion | What good looks like |
    |---|---|
    | Scopes | Read scope lists no write tool; write tools register only when the scope includes write |
    | Tool design | Clear names and descriptions, typed and constrained inputs, structured output for lookups |
    | Errors | Expected failures raise `ToolError` and come back with `is_error`; the server keeps running |
    | Approval | The write verifies an HMAC over every written field plus approver and expiry; tampering is refused |
    | Logging | One JSON line per call and per refusal on stderr; nothing on stdout but protocol |
    | Idempotency | A repeated approved write does not create a second record (stretch goal) |
    | Tests | A scripted client checks the tool list per scope, a refusal and a success |
- id: interview
  heading: Scenario interview questions
  body: |
    - **"Three teams want the same CRM lookups in their agents. How would you build it?"** One MCP server with
      read-only tools on a read-only account, Streamable HTTP with authentication if remote, discovery so teams do
      not hard-code tools, and structured output so all three parse results the same way.
    - **"How do you stop an agent writing without approval if it uses MCP tools?"** Do not give the write tool to the
      investigating session at all; start a write-scoped connection only after a person decides; have the write tool
      verify a signed approval over the exact fields.
    - **"A tool result contains instructions to the model. What do you do?"** Treat results as data: screen and flag
      them, keep write tools out of reach, and have deterministic policy escalate flagged runs.
    - **"A popular open-source MCP server would save weeks. What checks first?"** Source and maintainer, what it can
      access, pinned version, tool descriptions read for hidden instructions, run with least privilege, and the same
      review as any dependency.
    - **"The agent is slow and expensive since you added MCP tools."** Look at tool result sizes, return only needed
      fields, page lists, and cut the number of tools so descriptions take less context.
    - **"How do you upgrade the SDK safely?"** Pin it, keep a scripted client test of every tool, read the migration
      notes, and check the protocol versions your hosts support.
- id: further_learning
  heading: Further learning
  body: |
    - [Model Context Protocol documentation](https://modelcontextprotocol.io/) — the official site, with the
      specification and guides.
    - [MCP specification](https://modelcontextprotocol.io/specification) — lifecycle, transports, authorization and
      every message type.
    - [Python SDK on GitHub](https://github.com/modelcontextprotocol/python-sdk) — the official Python SDK and its
      migration notes.
    - [TypeScript SDK server guide](https://ts.sdk.modelcontextprotocol.io/documents/server.html) — building servers
      in TypeScript.
    - [MCP Inspector](https://github.com/modelcontextprotocol/inspector) — the official tool for testing servers.
modules:
- id: m1
  title: The protocol underneath
  minutes: 20
  body: |
    You can use MCP for months through an SDK without reading a single JSON-RPC message. But when a host cannot see
    your tool, or a call fails with a confusing error, knowing what crosses the wire turns a mystery into a
    five-minute fix.

    ### JSON-RPC 2.0 in one paragraph

    Every MCP message is a JSON-RPC 2.0 object. A **request** has an `id`, a `method` and `params`, and expects a
    **response** with the same `id` and either a `result` or an `error`. A **notification** has a method and params
    but no `id`, and gets no response. That is the whole envelope; MCP defines the methods and their shapes.

    ```json
    {"jsonrpc": "2.0", "id": 3, "method": "tools/call",
     "params": {"name": "get_trade", "arguments": {"trade_id": "T-101"}}}
    ```

    ### The lifecycle

    1. **initialize** (request from client). The client sends the protocol version it wants, its capabilities and
       its name. The server answers with the version it will use, its capabilities and its name. If they cannot
       agree a version, the connection should end.
    2. **notifications/initialized** (notification from client). The client says it is ready. Normal requests
       start after this.
    3. **Operation.** `tools/list`, `tools/call`, `resources/read` and the rest, in both directions where the
       capabilities allow.
    4. **Shutdown.** For stdio, the client closes the server's input and the process exits; for HTTP, the
       connection or session ends.

    The SDK's `session.initialize()` does steps 1 and 2 for you. Your Beginner client printed nothing about it, but
    every connection did it.

    ### Capabilities

    Capabilities are how each side says what it supports. A server that declares `tools` can be asked for
    `tools/list`; one that declares `resources` with `subscribe` can push updates. A server can also declare
    `listChanged` for tools, meaning it will send a notification when its tool list changes, so a host knows to list
    again. Clients declare capabilities too, such as support for sampling or elicitation (m3). Neither side should
    call a feature the other did not declare.

    In the Python SDK, `init = await session.initialize()` returns the server's answer, so you can inspect
    `init.protocol_version`, `init.server_info.name` and `init.capabilities`.

    ### Versions

    The specification is versioned by date, and the protocol is still evolving between versions. Hosts and servers
    negotiate during initialize, and SDKs support a range. When a host cannot connect to your server after an
    upgrade, compare the protocol versions each side supports before anything else.

    ### Names on the wire and in code

    On the wire, field names are camelCase: `inputSchema`, `isError`, `structuredContent`. SDKs may expose them
    differently; the current Python SDK uses snake_case attributes (`input_schema`, `is_error`,
    `structured_content`). When you read the specification, translate.

    ### Errors at two levels

    There are two kinds of failure, and they mean different things:

    - A **protocol error** is a JSON-RPC `error` response: unknown method, malformed request, unknown tool. The host
      usually treats it as a bug.
    - A **tool execution error** is a successful response whose result has `isError: true`, with text describing
      the problem. The model sees it and can adapt: try another ID, ask a person, escalate.

    Design for the second kind. "Unknown trade T-999" as a tool result lets an agent recover; an exception that
    becomes a protocol error usually ends the step.

    ### Seeing the traffic

    To watch real messages, use the MCP Inspector, or write a tiny client with the SDK and print each result's
    `model_dump()`. For stdio servers, remember that stderr is free for your own logs; everything on stdout must be
    protocol.

    ### A worked trace

    Here is what one investigation step looks like as messages, simplified:

    1. Client → server: `initialize` with its version and capabilities. Server → client: its version, name and
       capabilities (`tools`, `resources`, `prompts`).
    2. Client → server: `notifications/initialized`. No reply.
    3. Client → server: `tools/list` (id 2). Server → client: result with each tool's `name`, `description`,
       `inputSchema` and, for typed returns, `outputSchema`.
    4. The model, given that list by the host, asks for `get_trade`. Client → server: `tools/call` (id 3) with
       the arguments. Server → client: result with `content` (text) and `structuredContent`.
    5. A second call with a bad ID gets a result with `isError: true`, not a JSON-RPC error.

    Debugging is mostly finding which of these steps went wrong. A tool missing from the host's list points to step
    3 (not registered, wrong scope, or the host did not re-list after a change). A call that never returns points to
    the server process (it crashed, or something wrote to stdout). A model that calls with wrong arguments points to
    the schema and description, which is the subject of m2.
  exercise: |
    Modify your Beginner client to print the server's initialize answer (protocol version, server name and
    capabilities) and the full `model_dump()` of one `tools/list` result and one failed `tools/call`. Done when you
    can point to the tool's input schema, the capabilities the server declared, and the error flag on the failed
    call, and say which of the two error levels that failure was.
  check:
  - id: m1q1
    prompt: What makes a JSON-RPC message a notification rather than a request?
    options:
    - It has no id and gets no response
    - It has an id and expects a result
    - It is sent only by servers
    - It always carries an error
    answer: 0
    explanation: Requests carry an id and get a matching response; notifications do not.
    evidence: A notification has a method and params but no id, and gets no response.
  - id: m1q2
    prompt: What does the client send immediately after a successful initialize response?
    options:
    - A notifications/initialized notification saying it is ready
    - A tools/call for every tool
    - A second initialize with a newer version
    - Nothing; normal requests start straight away
    answer: 0
    explanation: Normal requests start after the initialized notification.
    evidence: The client says it is ready. Normal requests start after this.
  - id: m1q3
    prompt: What does a server's listChanged capability for tools mean?
    options:
    - It will send a notification when its tool list changes, so the host knows to list again
    - Its tools can never change
    - It lists tools in alphabetical order
    - It refuses tools/list requests
    answer: 0
    explanation: Capabilities declare what each side supports, including change notifications.
    evidence: meaning it will send a notification when its tool list changes, so a host knows to list again
  - id: m1q4
    prompt: A call fails because the trade ID is unknown. Which kind of error should it be?
    options:
    - A tool execution error, a result with isError true that the model can read and adapt to
    - A protocol error that ends the connection
    - A crash of the server process
    - No error; return an empty result
    answer: 0
    explanation: Design for tool execution errors so the agent can recover.
    evidence: Design for the second kind.
  - id: m1q5
    prompt: A host cannot connect after you upgrade your server's SDK. What should you compare first?
    options:
    - The protocol versions each side supports
    - The tool descriptions
    - The size of the server's log file
    - The model's context window
    answer: 0
    explanation: Versions are negotiated at initialize, and SDKs support a range.
    evidence: compare the protocol versions each side supports before anything else
- id: m2
  title: Designing tools a model uses well
  minutes: 20
  body: |
    A tool has two audiences. Your code needs it to be safe and predictable; the model needs to understand when to
    call it and what it will get back. Most "the agent is dumb" complaints are really "the tools were confusing".

    ### Names and descriptions

    The model chooses tools from their names and descriptions. Write them like documentation for a new colleague:

    - **Verb plus object:** `get_trade`, `list_failed_trades`, `record_fix`. Avoid `query`, `do_action`,
      `helper`.
    - **Say what comes back and when to use it:** "Look up one trade: booked and confirmed quantities and settlement
      status." beats "Gets trade data."
    - **Say what it does not do:** "Read-only." "Does not send the email; queues it." The trade-ops write tool's
      description says it records an approved resolution and queues, never sends, the email.
    - **Fewer, sharper tools.** Every tool description takes space in the model's context, and overlapping tools
      confuse it. Seven focused tools beat twenty overlapping ones.

    ### Inputs

    Type every argument and constrain what you can. In the Python SDK, `pydantic.Field` adds constraints and
    descriptions to the schema:

    ```python
    from pydantic import Field

    @server.tool()
    def get_trade(trade_id: str = Field(pattern=r"^T-\d{3}$", description="Trade ID such as T-101")) -> Trade:
        """Look up one trade: booked and confirmed quantities and settlement status."""
    ```

    Now `"101; DROP TABLE"` is rejected before your function runs. In TypeScript the same is done with zod, as in
    the trade-ops server's `z.string().regex(...)` IDs. Prefer enums for fixed choices, bounds for numbers, and
    small flat argument lists over nested objects.

    ### Structured output

    If a tool returns a Pydantic model, a `TypedDict` or a dataclass, the Python SDK publishes an **output
    schema** and returns the result as structured content as well as text:

    ```python
    class Trade(BaseModel):
        trade_id: str
        ticker: str
        booked_qty: int
        confirmed_qty: int
        status: str
    ```

    A host can then validate the result and use fields directly (`result.structured_content["confirmed_qty"]`)
    instead of parsing text. In the capstone, the harness builds the proposal straight from structured content.

    ### Errors

    Raise `ToolError("unknown trade T-999")` for expected failures. The message reaches the model as an error
    result. Any other exception is treated as a crash: the caller gets a generic "Error executing tool" message and
    the details stay in the server's log, which is the safe default for stack traces and internal names. Write
    error messages that suggest a next step: "unknown trade T-999; use list_failed_trades to see open items".

    ### Annotations

    Tools can carry hints: `read_only_hint`, `destructive_hint`, `idempotent_hint`, `open_world_hint` (camelCase
    on the wire). A host can use them, for example to ask for confirmation before a destructive tool. They are
    **hints, not enforcement**: a server can claim anything. Never rely on a hint for safety; enforce in the server.

    ```python
    from mcp.types import ToolAnnotations

    @server.tool(annotations=ToolAnnotations(read_only_hint=True))
    def get_trade(...): ...
    ```

    ### Results the model can use

    - Return the fields the model needs, not the whole record; results go into context and cost tokens.
    - Page long lists with a limit and a cursor argument.
    - Use stable field names and units (`qty`, not sometimes `quantity`).
    - Keep results deterministic for the same input, which makes testing and replay possible.

    ### Read and write tools

    Split them. Lookups are safe to give widely. Writes go in their own tool with their own checks, and ideally in
    their own scope (m5). A single `manage_trade(action=...)` tool that can read or write hides the dangerous part
    inside an argument.

    ### Reviewing a tool list

    Before an agent gets a server, read its `tools/list` output as the model will see it, and ask five questions:
    Could a new colleague pick the right tool from the names and descriptions alone? Does every argument have a
    type and, where it matters, a constraint? Does every lookup say it is read-only, and is it? Are writes separate
    and scoped? Are results small enough to sit in context comfortably? A tool list that passes this review usually
    needs much less prompt engineering in the agent, because the interface already says what to do.
  exercise: |
    Rewrite your Beginner `get_trade` to return a Pydantic model, constrain `trade_id` with a pattern, add a
    `read_only_hint` annotation and a description that says what comes back. Done when `tools/list` shows an
    output schema and the annotation, a call returns `structured_content` with typed fields, and an ID such as
    `"101; DROP TABLE"` is rejected before your function runs.
  check:
  - id: m2q1
    prompt: Which tool description helps a model most?
    options:
    - '"Look up one trade: booked and confirmed quantities and settlement status. Read-only."'
    - '"Gets trade data."'
    - '"Helper function."'
    - '"Call this for anything."'
    answer: 0
    explanation: A good description says what the tool returns (a trade's booked and confirmed quantities and status) and that it is read-only.
    evidence: Say what comes back and when to use it
  - id: m2q2
    prompt: What does returning a Pydantic model from a tool give the host in the Python SDK?
    options:
    - An output schema and the result as structured content as well as text
    - Faster network transfer
    - Automatic approval of writes
    - A second copy of the tool
    answer: 0
    explanation: Hosts can validate and use fields directly instead of parsing text.
    evidence: the Python SDK publishes an output schema and returns the result as structured content as well as text
  - id: m2q3
    prompt: Can a host rely on a tool's read_only_hint for safety?
    options:
    - No; annotations are hints, not enforcement, so enforce in the server
    - Yes; the protocol blocks writes from read-only tools
    - Yes, if the server is written in Python
    - Only over Streamable HTTP
    answer: 0
    explanation: A server can claim anything in a hint.
    evidence: They are hints, not enforcement
  - id: m2q4
    prompt: What does a non-ToolError exception inside a Python SDK tool return to the caller?
    options:
    - A generic error message, with the details kept in the server's log
    - The full stack trace
    - Nothing; the server exits
    - A successful empty result
    answer: 0
    explanation: Crash details stay on the server, which is the safe default.
    evidence: the caller gets a generic "Error executing tool" message and the details stay in the server's log
  - id: m2q5
    prompt: Why avoid a single manage_trade(action=...) tool that can read or write?
    options:
    - It hides the dangerous part inside an argument
    - Tools cannot take string arguments
    - The model cannot call tools with arguments
    - It returns too little data
    answer: 0
    explanation: Split reads and writes so writes get their own checks and scope.
    evidence: hides the dangerous part inside an argument
- id: m3
  title: Resources, prompts and client features
  minutes: 20
  body: |
    Tools get most of the attention, but MCP servers expose three kinds of things, and clients can offer features
    back to servers. Choosing the right primitive keeps the model's job simpler and gives the application, not the
    model, control where it should have it.

    ### Who is in control

    A useful way to remember the three server primitives:

    | Primitive | Who decides to use it | Example |
    |---|---|---|
    | Tool | the model, through the host | `get_trade` |
    | Resource | the application (or the user through it) | `policy://settlement` |
    | Prompt | the user, picking a ready-made task | "Investigate trade T-101" |

    ### Resources

    A resource is read-only data with a URI. Use one when the application should decide what context to load:
    a policy document, a schema, a runbook, today's open exceptions. The host can list resources, read them, and
    attach their contents to the model's context, without the model having to ask.

    ```python
    @server.resource("policy://settlement")
    def settlement_policy() -> str:
        """The desk's settlement policy."""
        return "Failed trades must be reviewed by an analyst before any rebooking."
    ```

    Resources can also be **templates** with parameters in the URI, such as `trade://{trade_id}`, so one function
    serves many URIs. A server that declares `subscribe` can notify subscribers when a resource changes.

    When to choose a resource over a tool: if the data is reference material, changes slowly, and the application
    can decide in advance that it is relevant, make it a resource. If the model needs to decide at run time what to
    look up, make it a tool.

    ### Prompts

    Prompts are named templates with arguments. A host can show them to users as commands or menu items, which
    turns "the right way to ask" into a product your team maintains. In a firm, prompts are a good place for the
    house style of a task: "Investigate trade {trade_id}. Use get_trade, cite fields, and propose a fix. Do not
    rebook." Version them with the server, and review changes like code.

    ### Client features

    The specification also defines features a **client** can offer to servers, each declared as a capability:

    - **Sampling.** The server asks the client's model to generate text, so a server can use a model without its
      own API key. The host stays in control and should let a person review such requests.
    - **Elicitation.** The server asks the user, through the client, for more information in a structured form,
      such as "which account do you mean?".
    - **Roots.** The client tells the server which locations (such as folders) it may work within.

    Not every host supports every feature, so check capabilities before relying on one. For governed workflows,
    treat sampling with care: a server that can drive the host's model is a server that can spend its budget and
    shape its output.

    ### Designing the surface of a real server

    For a trade-ops server, a sensible split is:

    - **Tools:** lookups the model chooses at run time (`get_booking`, `get_confirm`, `get_ssi`).
    - **Resources:** the settlement policy and the escalation runbook, which the host attaches to every
      investigation.
    - **Prompts:** "Investigate exception {id}" and "Draft broker email for {id}", which analysts can trigger.

    This keeps the tool list short, moves stable context out of tool calls, and makes the common tasks one click.

    ### Context budget

    Everything the host attaches costs tokens on every call. Keep resources concise, prefer summaries with a link
    to the full document, and attach only what the task needs. A 40-page policy attached to every call is a cost
    problem and a quality problem.

    ### Change notifications

    Servers can tell clients that things changed. A server that declares `listChanged` for tools, resources or
    prompts sends a notification when the list changes, and the host should list again. A server that supports
    resource subscriptions can notify a subscriber when a specific resource's content changes. These matter for
    long-running hosts such as IDEs and chat apps; for an agent that opens a fresh connection per run, re-listing at
    the start is usually enough. Either way, never cache a tool list across server versions without checking it.
  exercise: |
    Add to your server a resource template `trade://{trade_id}` that returns a one-line summary of a trade, and a
    second prompt, `draft_email(trade_id)`, that produces the text of a broker-email request. Then, in your client,
    list resources, resource templates and prompts. Done when the client reads `trade://T-101` and fills both prompts,
    and you can explain for each of your server's capabilities why it is a tool, a resource or a prompt.
  check:
  - id: m3q1
    prompt: Who decides to use a resource?
    options:
    - The application, or the user through it
    - The model, through a tool call
    - The server, on its own schedule
    - Nobody; resources load automatically into every model
    answer: 0
    explanation: Tools are model-controlled; resources are application-controlled.
    evidence: Use one when the application should decide what context to load
  - id: m3q2
    prompt: When should data be a resource rather than a tool?
    options:
    - When it is reference material that changes slowly and the application can decide in advance it is relevant
    - When the model must decide at run time what to look up
    - When the data is written by the server
    - When the data needs an approval
    answer: 0
    explanation: Run-time lookups the model chooses are tools.
    evidence: if the data is reference material, changes slowly, and the application can decide in advance that it is relevant, make it a resource
  - id: m3q3
    prompt: What does sampling let a server do?
    options:
    - Ask the client's model to generate text, without its own API key
    - Read any file on the client's machine
    - Bypass the host's approvals
    - Choose which tools the model may call
