- id: m4
  title: Transports and deployment
  minutes: 20
  body: |
    The protocol layer is the same over both transports, so a server can start local and move behind HTTP later.
    What changes is how it is launched, who can reach it, and how callers prove who they are.

    ### Stdio

    The host starts the server as a child process and talks over its standard input and output.

    - **No network, no port.** Nothing to firewall and no listener to attack. That is why the trade-ops agent uses
      stdio: the server runs next to the agent, with its own environment variables.
    - **Configuration through the launch.** The host decides the command, the arguments and the environment. The
      trade-ops runner passes `MCP_TOOL_SCOPE` and, for the write process, the signing key this way.
    - **One process per connection.** Each host session gets its own server process, which isolates sessions and
      makes per-session scopes easy.
    - **Stdout is the protocol.** Logs go to stderr.

    ```python
    params = StdioServerParameters(command=sys.executable, args=["ops_server.py"],
                                   env={**os.environ, "MCP_TOOL_SCOPE": "read"})
    ```

    ### Streamable HTTP

    The server runs as a web service, and clients connect over HTTP. Use it when the server is shared by many hosts,
    runs on another machine, or needs central operation. In the Python SDK, `server.run(transport="streamable-http")`
    serves it; in production you usually mount it in an ASGI app behind your normal web stack.

    - **Authentication.** Streamable HTTP supports standard authentication, and the specification describes an
      authorization flow based on OAuth for remote servers. At minimum, require a credential, use TLS, and map each
      caller to the permissions it should have.
    - **Sessions.** The transport can carry a session identifier so related requests are tied together; design
      tools so that losing a session is harmless.
    - **The usual web concerns.** Rate limits, request size limits, timeouts, health checks, and running more than
      one instance.

    ### Choosing

    | Question | Stdio | Streamable HTTP |
    |---|---|---|
    | Who runs it? | the host, per connection | you, as a service |
    | Network exposure | none | an endpoint to protect |
    | Auth | process isolation and environment | credentials per caller |
    | Best for | local tools, per-agent scopes, development | shared tools across teams and hosts |

    ### Packaging and launching

    - Pin dependencies and ship the server as a package or container with one documented command.
    - Read configuration from environment variables; fail fast at start-up if a required one is missing.
    - For TypeScript servers, compile and run with Node; the trade-ops server is built once (`npm run build`) and
      the agent launches the built file.

    ### Versioning the server

    Treat the tool list as an interface. Adding a tool or an optional argument is backward compatible; renaming
    a tool, removing one or changing an argument's type is not. Give the server a version in its name info, keep a
    changelog, and when you must break something, add the new tool alongside the old one for a release.

    ### Testing in CI

    A scripted client is the best test. Start the server over stdio in the test, initialize, list tools and assert
    the exact set per scope, call each tool with a good and a bad input, and check results and error flags. The
    trade-ops server has its own Node tests next to the Python agent's tests, and both run on every change.

    ### Moving a server from stdio to HTTP

    Because the protocol layer is the same, the tools do not change. What does change: configuration that came from
    the launch environment (such as the scope) must now come from the caller's identity, so map each credential to
    a scope on the server; process-per-session isolation is gone, so the tools must be safe for concurrent callers;
    and logs must record which caller made each call. Plan those three changes before you flip the transport, and
    keep the stdio entry point for local development and tests.
  exercise: |
    Write a pytest test that starts your server over stdio twice — once with `MCP_TOOL_SCOPE=read`, once with
    `read,write` — and asserts the exact tool names in each. Then run the server once with
    `server.run(transport="streamable-http")` and note the address it reports. Done when the test passes offline and
    you can list three things you would add before exposing the HTTP version beyond your laptop.
  check:
  - id: m4q1
    prompt: Why does the trade-ops agent use stdio for its MCP server?
    options:
    - No network or port, and the host controls the command and environment, including the scope
    - Stdio is the only transport the TypeScript SDK supports
