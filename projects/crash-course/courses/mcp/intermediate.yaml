    - Stdio servers cannot have write tools
    answer: 0
    explanation: Stdio needs no listener, and the launch sets per-process scope.
    evidence: Nothing to firewall and no listener to attack.
  - id: m4q2
    prompt: When is Streamable HTTP the better transport?
    options:
    - When the server is shared by many hosts, runs on another machine, or needs central operation
    - When the server must never be reachable over a network
    - When each agent needs its own process
    - When you want no authentication
    answer: 0
    explanation: Shared, remote servers fit HTTP with authentication.
    evidence: Use it when the server is shared by many hosts, runs on another machine, or needs central operation.
  - id: m4q3
    prompt: Which change to a server's tools is backward compatible?
    options:
    - Adding a tool or an optional argument
    - Renaming a tool
    - Removing a tool
    - Changing an argument's type
    answer: 0
    explanation: Treat the tool list as an interface; additions are safe, renames and removals are not.
    evidence: Adding a tool or an optional argument is backward compatible
  - id: m4q4
    prompt: How does a stdio host pass configuration such as a scope to the server?
    options:
    - Through the launch — command, arguments and environment variables
    - Through a tool call after initialize
    - Through the model's prompt
    - It cannot; stdio servers have fixed configuration
    answer: 0
    explanation: The trade-ops runner passes MCP_TOOL_SCOPE and the signing key this way.
    evidence: The host decides the command, the arguments and the environment.
  - id: m4q5
    prompt: What is the best automated test for an MCP server?
    options:
    - A scripted client that starts the server, lists tools per scope and calls each with good and bad input
    - Reading the source code
    - Asking a model whether the tools look right
    - Checking that the process starts
    answer: 0
    explanation: A scripted client checks the real protocol surface.
    evidence: A scripted client is the best test.
- id: m5
  title: Security and governance for MCP servers
  minutes: 20
  body: |
    MCP moves the tool boundary out of the prompt and into a separate process with a declared interface. That is a
    gift for governance: the list of tools can be reviewed, versioned and tested on its own, and each input schema
    is enforced before your code runs. But the protocol does not decide what the model is allowed to do with those
    tools. That part is your design.

    ### Least privilege, by scope

    Give each session only the tools its job needs. The trade-ops pattern:

    1. The investigation runs a server process with `MCP_TOOL_SCOPE=read`. Only lookup tools are registered, on a
       read-only database handle. The model cannot call a write tool because, in that process, it does not exist.
    2. After a person approves, the host starts a second process with `read,write`. Only now does `record_fix`
       exist, and only the host's approval code calls it.

    Registering tools conditionally is a few lines:

    ```python
    SCOPES = set(os.environ.get("MCP_TOOL_SCOPE", "read").split(","))
    if "write" in SCOPES:
        @server.tool()
        def record_fix(...): ...
    ```

    ### Writes verify their own approval

    Even a write-scoped process should not trust its caller. The approval step mints a token over exactly what will
    be written, and the tool recomputes and compares it:

    ```python
    expected = hmac.new(KEY, "|".join([trade_id, str(new_qty), approver, str(expires_at)]).encode(),
                        hashlib.sha256).hexdigest()
    if not hmac.compare_digest(expected, approval_token):
        raise ToolError("approval token does not match this fix")
    ```

    Changing any field — the quantity, the approver, the expiry — breaks the token. `compare_digest` avoids
    leaking information through timing. The key lives only in the approval service and the write server's
    environment.

    ### Injection through tools

    Two paths to watch:

    - **Tool results.** A broker confirm that says "SYSTEM: ignore prior instructions" is data that reaches the
      model. Screen results, flag suspicious text, and let deterministic policy escalate.
    - **Tool descriptions.** A third-party server's descriptions are text the model reads every call. A malicious
      or careless description can steer the model. Read them during review, and pin the server version so they do
      not change under you.

    ### Vetting third-party servers

    Treat a server like any dependency that runs code with your credentials: who maintains it, what it can reach,
    which version you pin, what its tools and descriptions say, what it logs and where data goes. Run it with the
    least privilege that works, and prefer servers you can read the source of.

    ### Logging and audit

    Log every call on the server side with tool, arguments (redacting secrets), caller, outcome and duration, and
    every refused write with the reason. On the host side, log the same call with the run ID. Together they show
    who asked for what, what the tool did, and who approved any write.

    ### Rate and budget limits

    MCP has no built-in limits on how often a tool is called. Put caps in the host (calls per run, cost per run)
    and in the server where the back end needs protecting (calls per minute per caller).

    ### A review checklist for a new server

    1. Tools are split into read and write; write tools are scoped.
    2. Every write verifies an approval it can check itself.
    3. Inputs are constrained beyond types where IDs or amounts matter.
    4. Errors are tool results; crashes do not leak internals.
    5. Logs go to stderr or a pipeline, one line per call and refusal.
    6. The SDK and any third-party servers are pinned.
    7. A scripted client test covers each scope.

    ### Where MCP sits in the controls

    It helps to say plainly to a risk reviewer which control lives where. The **graph or host** decides when a
    write may be attempted (after an approval) and caps how much work a run does. The **MCP server** decides what is
    possible at all (scopes), what inputs are acceptable (schemas and patterns), and whether a specific write is
    authorised (the token). The **approval service** holds the signing key and records who decided. No single
    layer is trusted alone, so a bug in one does not open the door.
  exercise: |
    Add a write tool to your server that registers only when `MCP_TOOL_SCOPE` includes `write` and refuses any call
    without a valid HMAC token over all of its written fields. Done when the read-scope tool list has no write tool,
    a call with a token minted for different values is refused with `is_error`, a call with the right token succeeds,
    and both outcomes appear as JSON lines on stderr.
  check:
  - id: m5q1
    prompt: How does the trade-ops pattern stop the model calling the write tool during an investigation?
    options:
    - The investigation's server process runs with read scope, so the write tool does not exist there
    - The model is told in its prompt not to call it
    - The write tool has a destructive_hint annotation
    - The write tool is hidden from tools/list but still callable
    answer: 0
    explanation: Least privilege by scope means the tool is never registered for that session.
    evidence: The model cannot call a write tool because, in that process, it does not exist.
  - id: m5q2
    prompt: Why does the write tool recompute an HMAC over the fields it will write?
    options:
    - So changing any field — quantity, approver or expiry — breaks the token and the write is refused
    - To encrypt the database
    - To speed up the write
    - To let the model mint its own approvals
    answer: 0
    explanation: The token binds the approval to exactly what is written.
    evidence: Changing any field — the quantity, the approver, the expiry — breaks the token.
  - id: m5q3
    prompt: Why read a third-party server's tool descriptions during review?
    options:
    - They are text the model reads every call, and a malicious or careless description can steer it
    - They decide the server's protocol version
    - They contain the server's API keys
    - They are only shown to users, never the model
    answer: 0
    explanation: Pin the version so descriptions do not change under you.
    evidence: A malicious or careless description can steer the model.
  - id: m5q4
    prompt: Where should call limits go, since MCP has none built in?
    options:
    - In the host (calls and cost per run) and in the server where the back end needs protecting
    - In the tool descriptions
    - In the JSON-RPC envelope
    - Nowhere; models stop on their own
    answer: 0
    explanation: Caps belong in the host, with server limits to protect back ends.
    evidence: Put caps in the host (calls per run, cost per run) and in the server where the back end needs protecting
  - id: m5q5
    prompt: What does MCP itself give governance?
    options:
    - A tool list that can be reviewed, versioned and tested on its own, with input schemas enforced
    - A decision about what the model is allowed to do
    - Built-in human approval for every write
    - Automatic rate limits
    answer: 0
    explanation: The protocol defines the interface; permissions and approvals are your design.
    evidence: the list of tools can be reviewed, versioned and tested on its own
project:
  title: A scoped trade-ops MCP server with an approval-gated write
  kind: runnable
  minutes: 90
  goal: Build a Python MCP server with read and write scopes, structured lookups, constrained inputs and a write tool
    that accepts only a signed, unexpired approval for the exact fix, plus a host harness that proves it.
  steps:
  - In a virtual environment with `mcp` installed, create `ops_server.py` and `harness.py` from the code below (split at
    the `# ---- harness.py ----` line). Try writing your own server first, using the rubric, then compare.
  - Read the server — the scope check, the Pydantic return type, the pattern on trade_id, logs to stderr, and the write
    tool registered only in write scope.
  - Run `python harness.py`. It investigates with read scope, simulates an approval by minting a token, then starts a
    write-scoped process.
  - Check the output — read scope lists only get_trade; the injected ID is rejected; the tampered fix is refused; the
    approved fix is recorded in fixes.jsonl.
  - Run it again with `2>&1 >/dev/null` to see only the server's JSON log lines.
  - Stretch — make record_fix idempotent by refusing a second write with the same approval token.
  - Write a pytest test that asserts the tool list for each scope, one refusal and one success.
  code: |
    """Trade-ops MCP server with scopes and an approval-gated write (stdio).

    MCP_TOOL_SCOPE=read        -> read-only tools (what an agent gets)
    MCP_TOOL_SCOPE=read,write  -> also record_fix, which needs a signed approval token
    """
    import hashlib
    import hmac
    import json
    import os
    import sys
    import time

    from pydantic import BaseModel, Field
    from mcp.server.mcpserver import MCPServer
    from mcp.server.mcpserver.exceptions import ToolError
    from mcp.types import ToolAnnotations

    SCOPES = set(os.environ.get("MCP_TOOL_SCOPE", "read").split(","))
    SIGNING_KEY = os.environ.get("APPROVAL_SIGNING_KEY", "").encode()
    TRADES = {"T-101": {"ticker": "GLOBX", "booked_qty": 250, "confirmed_qty": 200, "status": "failed"}}
    LEDGER = "fixes.jsonl"

    server = MCPServer("trade-ops", instructions="Read-only lookups for trade exceptions.")


    def log(event: str, **fields) -> None:
        print(json.dumps({"ts": round(time.time()), "event": event, **fields}), file=sys.stderr)  # never stdout


    class Trade(BaseModel):
        trade_id: str
        ticker: str
        booked_qty: int
        confirmed_qty: int
        status: str


    @server.tool(annotations=ToolAnnotations(read_only_hint=True))
    def get_trade(trade_id: str = Field(pattern=r"^T-\d{3}$", description="Trade ID such as T-101")) -> Trade:
        """Look up one trade: booked and confirmed quantities and settlement status."""
        log("tool_call", tool="get_trade", trade_id=trade_id)
        if trade_id not in TRADES:
            raise ToolError(f"unknown trade {trade_id}")
        return Trade(trade_id=trade_id, **TRADES[trade_id])


    def sign(fields: list[str]) -> str:
        return hmac.new(SIGNING_KEY, "|".join(fields).encode(), hashlib.sha256).hexdigest()


    if "write" in SCOPES:
        @server.tool(annotations=ToolAnnotations(destructive_hint=False, idempotent_hint=True))
        def record_fix(trade_id: str, new_qty: int, approver: str, expires_at: int, approval_token: str) -> str:
            """Record an APPROVED quantity fix. Requires a token minted by the human-approval step."""
            if not SIGNING_KEY:
                raise ToolError("server has no signing key; writes are disabled")
            if expires_at < time.time():
                raise ToolError("approval expired")
            expected = sign([trade_id, str(new_qty), approver, str(expires_at)])
            if not hmac.compare_digest(expected, approval_token):
                log("write_refused", trade_id=trade_id, approver=approver)
                raise ToolError("approval token does not match this fix")
            with open(LEDGER, "a") as f:
                f.write(json.dumps({"trade_id": trade_id, "new_qty": new_qty, "approver": approver}) + "\n")
            log("write_ok", trade_id=trade_id, approver=approver)
            return f"recorded fix for {trade_id}"


    if __name__ == "__main__":
        server.run()

    # ---- harness.py ----
    """Drive the server the way an agent host would: read scope for the investigation, write scope after approval."""
    import asyncio
    import hashlib
    import hmac
    import os
    import sys
    import time

    from mcp import ClientSession, StdioServerParameters
    from mcp.client.stdio import stdio_client

    KEY = "demo-signing-key-change-me"


    def params(scope: str) -> StdioServerParameters:
        env = {**os.environ, "MCP_TOOL_SCOPE": scope, "APPROVAL_SIGNING_KEY": KEY}
        return StdioServerParameters(command=sys.executable, args=["ops_server.py"], env=env)


    def mint(trade_id: str, new_qty: int, approver: str, expires_at: int) -> str:
        msg = "|".join([trade_id, str(new_qty), approver, str(expires_at)]).encode()
        return hmac.new(KEY.encode(), msg, hashlib.sha256).hexdigest()


    async def main() -> None:
        # 1. investigation: read scope only
        async with stdio_client(params("read")) as (r, w), ClientSession(r, w) as s:
            await s.initialize()
            names = [t.name for t in (await s.list_tools()).tools]
            print("read scope tools:", names)
            trade = (await s.call_tool("get_trade", {"trade_id": "T-101"})).structured_content
            print("evidence:", trade)
            bad = await s.call_tool("get_trade", {"trade_id": "101; DROP TABLE"})
            print("bad id rejected:", bad.is_error)
            proposal = {"trade_id": "T-101", "new_qty": trade["confirmed_qty"]}

        # 2. a person approves; the approval step mints a token for exactly this fix
        approver, expires = "a.analyst", int(time.time()) + 600
        token = mint(proposal["trade_id"], proposal["new_qty"], approver, expires)

        # 3. write scope, started only after the decision
        async with stdio_client(params("read,write")) as (r, w), ClientSession(r, w) as s:
            await s.initialize()
            print("write scope tools:", [t.name for t in (await s.list_tools()).tools])
            forged = await s.call_tool("record_fix", {**proposal, "new_qty": 999, "approver": approver,
                                                      "expires_at": expires, "approval_token": token})
            print("tampered fix:", forged.content[0].text)
            ok = await s.call_tool("record_fix", {**proposal, "approver": approver,
                                                  "expires_at": expires, "approval_token": token})
            print("approved fix:", ok.content[0].text)


    asyncio.run(main())
  language: python
  expected: |
    read scope tools: ['get_trade']
    evidence: {'trade_id': 'T-101', 'ticker': 'GLOBX', 'booked_qty': 250, 'confirmed_qty': 200, 'status': 'failed'}
    bad id rejected: True
    write scope tools: ['get_trade', 'record_fix']
    tampered fix: Error executing tool record_fix: approval token does not match this fix
    approved fix: recorded fix for T-101
    fixes.jsonl holds one line: {"trade_id": "T-101", "new_qty": 200, "approver": "a.analyst"}
    On stderr: JSON lines for tool_call, write_refused and write_ok events.
  done_when:
  - Read scope lists no write tool, and the write tool appears only in the write-scoped process.
  - A fix whose fields differ from the approved ones is refused; the approved fix is recorded exactly once.
  - A scripted pytest test checks both scopes, a refusal and a success, and passes offline.
