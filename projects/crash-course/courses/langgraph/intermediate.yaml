provenance:
  written_by: Claude (build session, 3 Nov 2026), from the site's LangGraph page and the Familiar level
sections:
- id: modules
  heading: How the four hours fit together
  body: |
    Beginner showed you one pattern: a graph that proposes, pauses with `interrupt()` and writes only after a
    person decides. This level makes that pattern hold up in production. There are five modules, each with a short
    exercise and a five-question check (pass mark 80%), then a 90-minute capstone and a final test.

    | Module | What you learn | Time |
    |---|---|---|
    | m1 State design and reducers | what goes in state, how updates merge, keeping it small and serialisable | 20 min |
    | m2 Tool loops with limits | a model-driven tool loop that cannot run away: step caps, budgets, allow-lists | 20 min |
    | m3 Durable checkpoints | SQLite and Postgres checkpointers, threads, history and replay | 20 min |
    | m4 Approval patterns | approve / edit / reject, static and dynamic interrupts, defence in depth | 20 min |
    | m5 Testing and observing graphs | unit and graph tests with mocks, streaming, recursion limits, tracing | 20 min |

    **Pacing.** Do the modules in order; each builds on the one before. Take a break after m3. Keep one virtual
    environment for the whole level with `langgraph` and `langgraph-checkpoint-sqlite` installed. Every example
    runs offline with a mock model step; where a real model would go, the text says so.
- id: production
  heading: Running LangGraph for real
  body: |
    LangGraph is a library, so production concerns are yours: the checkpointer database, the model client, the
    process that runs the graph and the people who answer interrupts.

    **Security.**
    - The checkpointer holds every state of every run: prompts, tool results, proposals, decisions. Treat it like
      any database with business data. Restrict access, encrypt at rest, and set a retention period.
    - Give the model only read tools. Put writes in nodes the model cannot reach without an approval, and make the
      write itself check for that approval (the trade-ops agent's tool server verifies a signed token).
    - Treat tool results as untrusted input. A broker confirm that says "ignore prior instructions" is data; a
      deterministic policy node should catch it before a person sees the proposal.

    **Scaling and reliability.**
    - A paused run costs nothing but a row in the checkpointer, so thousands can wait for review at once.
    - Run the graph in a stateless worker; any worker can resume any thread because the state is in the database.
    - Make nodes that call external systems idempotent, or key their writes on the thread ID, so a retry after a
      crash does not write twice.
    - Set a `recursion_limit` on every invoke and your own step and budget caps inside the graph.

    **Cost.** Each model call in a loop costs tokens. Cap tool calls per run, cap spend per run, and log tokens and
    cost per node so you can see which step is expensive.

    **Observability.** Log one row per step: thread ID, node, tool name and arguments, tokens, cost, any flag. The
    checkpoint history gives you state; your step log gives you the story. Optional tracing tools such as
    LangSmith show the same thing visually.

    **Upgrades.** The API moves quickly. Pin `langgraph` and the checkpointer package, keep graph tests that run
    offline, and re-run them on every upgrade. A checkpoint written by one version should be readable by the next;
    check the release notes and test resume of an old paused thread before switching.
- id: alternatives
  heading: Alternatives and when to pick each
  body: |
    | Option | What it is | Pick it when |
    |---|---|---|
    | A plain loop in your own code | a `while` loop around model and tool calls | the flow is short, no pause or resume is needed, and you want no framework |
    | A provider's agent SDK or managed agents | the model vendor runs or structures the loop | you are committed to one provider and want less code to own |
    | AWS Step Functions | a managed state machine service | you are on AWS and want durable waits (`waitForTaskToken`) without running a checkpointer |
    | Temporal or another workflow engine | durable execution for any code | you already run it, or the workflow has long waits and many non-AI steps |
    | LangGraph | an explicit graph with checkpoints and `interrupt()` in Python | you need model-driven steps and hand-written rules in one auditable flow, with human approval |

    The question to ask is where the state lives while a person thinks. If the answer must be "in a database we
    control, with the full history", LangGraph or a workflow engine fits; if nothing ever waits, a plain loop is
    simpler.

    These options also combine. A common production shape is LangGraph for the agent itself, with a workflow engine
    or Step Functions around it for scheduling, retries of whole runs and long waits. The graph still owns the
    model-driven part and the approval gate; the outer system owns when runs start and what happens to stale ones.
- id: in_portfolio
  heading: How this portfolio uses LangGraph
  body: |
    The **trade-ops exception agent** is a LangGraph agent that works settlement breaks. Its graph has five nodes:
    `agent` and `tools` loop with read-only lookups, `policy` runs deterministic checks, `human_review` calls
    `interrupt()`, and `execute` records the approved fix.

    - **Tools come from MCP.** The seven read-only lookups are served by a TypeScript MCP server and loaded into the
      graph through langchain-mcp-adapters. The investigating run starts the server with read scope only, so the
      write tool does not exist for the model.
    - **Caps.** The tool loop is limited to 8 calls and a $0.25 budget; hitting either sends the case to policy and
      escalates it.
    - **Policy before people.** The policy node checks that every cited `{tool, field, value}` matches what the tools
      returned, and escalates injection attempts and bank-detail change requests.
    - **Durable state.** Checkpoints are in SQLite by default with a Postgres option; each run's thread ID is the
      exception ID plus a run ID.
    - **Gated write.** On approval, a second, write-scoped server process records the resolution, and its tool
      rejects any write without a valid signed approval token.
    - **AWS path.** On AWS the approval wait maps to Step Functions `waitForTaskToken`.
- id: capstone
  heading: 'Capstone: an auditable exception agent (90 minutes)'
  body: |
    You will build a small but complete version of the trade-ops pattern: a model-driven tool loop with caps, a
    deterministic policy node, an approve / edit / reject gate, a durable SQLite checkpointer, and a write that
    happens only after approval. You will run it as separate commands, so you prove a paused run survives the
    process ending. A reference implementation is in the project; try your own first, then compare.

    | Criterion | What good looks like |
    |---|---|
    | Tool loop | The agent asks for tools; a tools node runs them from an allow-list; the loop ends on a proposal or a cap |
    | Caps | A tool-call cap inside the graph and a `recursion_limit` on invoke; hitting a cap escalates, never loops |
    | Policy | A deterministic node checks the proposal against the evidence and escalates mismatches |
    | Approval | `interrupt()` with a payload a reviewer can act on; approve, edit and reject all handled |
    | Durability | Start and decide in separate processes; the resume continues the same thread |
    | Write | One write per approved run, with the approver recorded; nothing written on reject |
    | Tests | At least three offline tests: clean trade, break approved, break rejected |
    | Audit | You can list the run's checkpoint history and explain each step |
- id: interview
  heading: Scenario interview questions
  body: |
    - **"An agent sent a customer email nobody approved. How would you redesign it?"** Move the send into its own
      node after an `interrupt()`; remove the send tool from the model's tool list; make the send check a signed
      approval; add a test that proves no path reaches the send without a decision.
    - **"Reviewers come back the next morning. What breaks?"** An in-memory checkpointer loses the paused runs.
      Use SQLite or Postgres, keep the thread ID with the queue item, and test resume after a restart.
    - **"The agent keeps calling the same tool."** Add a tool-call cap in state and a `recursion_limit`; route to an
      escalation when hit; log each step so you can see why the model repeated itself.
    - **"A reviewer wants to change the proposed amount before approving."** Return an edit decision through
      `Command(resume=...)` and apply it in the review node, recording both the original and the edit.
    - **"How do you test an agent without paying for model calls?"** Mock the model node; unit-test routing
      functions and nodes; run whole-graph tests for each path with an in-memory checkpointer.
    - **"Risk asks for an audit trail."** Checkpoint history per thread plus a step log with tools, arguments,
      tokens, cost and the approver, kept for the retention period the firm sets.
