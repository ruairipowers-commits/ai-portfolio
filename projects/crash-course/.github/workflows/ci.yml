# EVAL-03 / SEC-06: every push runs the tests (scoring, unlocks, moderation, the no-answer-key rule, the owner page),
# the content checks on every course file, the offline end-to-end run, the eval gate (mock models, zero cost) and a
# dependency vulnerability scan.
name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[dev]" pip-audit
      - run: pytest -q
      - run: course check
      - run: course all
      - run: course eval
      - run: pip-audit --skip-editable || true   # report-only; make blocking once triaged
      - uses: actions/upload-artifact@v4
        with: {name: crash-course-output, path: output/}
