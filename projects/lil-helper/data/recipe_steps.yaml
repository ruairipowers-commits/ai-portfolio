beef_stir_fry:
  kcal: 560
  steps: ["Start the rice.", "Brown the beef with the garlic and ginger.", "Add the broccoli and a splash of water; cover 3 minutes.",
          "Stir in the soy sauce; serve over rice."]
burgers_sweet_fries:
  kcal: 620
  tags: [grill, party]
