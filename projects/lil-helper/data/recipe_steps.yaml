          "Build bowls of rice, chicken and vegetables; drizzle with the sauce."]
pesto_pasta_chicken:
  kcal: 640
  steps: ["Cook the pasta; add the peas for the last 2 minutes.", "Slice and cook the chicken 6–8 minutes.",
          "Drain the pasta, keeping a little water.", "Toss with the pesto, chicken and a splash of the water; top with parmesan."]
mac_and_cheese_broccoli:
  kcal: 600
  meals: [dinner, lunch]
  steps: ["Cook the pasta; add the broccoli florets for the last 3 minutes.", "Drain and return to the pot.",
          "Stir in the butter, milk and grated cheddar over low heat until creamy.", Season and serve.]
veggie_pizza:
  kcal: 580
  tags: [party]
  steps: [Heat the oven as hot as it goes (475–500°F)., "Stretch the dough onto an oiled tray.",
          "Spread with marinara; top with mozzarella, sliced mushrooms, peppers and spinach.",
          "Bake 12–15 minutes until bubbling and browned."]
pork_apples:
  kcal: 520
