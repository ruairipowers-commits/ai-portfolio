shrimp_tacos:
  kcal: 450
  tags: [party, grill]
  steps: ["Mix the corn, chopped tomatoes and lemon juice into a salsa.", "Cook the shrimp 2 minutes a side.",
          "Warm the tortillas; slice the avocado.", Fill with shrimp, salsa and avocado.]
slow_cooker_chicken_stew:
  kcal: 420
