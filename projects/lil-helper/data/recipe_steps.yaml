          "Serve over the pasta with more parmesan."]
chicken_broccoli_rice:
  kcal: 520
  meals: [dinner, lunch]
  steps: ["Start the rice.", "Cut the chicken into bite-size pieces; brown in the oil 6–8 minutes.",
          "Add the garlic and broccoli with a splash of water; cover 3 minutes.",
          "Stir in the soy sauce and lemon juice; serve over the rice."]
salmon_rice_broccoli:
  kcal: 540
  steps: ["Start the rice.", "Mix the soy sauce, honey and grated ginger.",
          "Sear the salmon skin-side down 4 minutes, flip, add the sauce and cook 3 more.", "Steam the broccoli 4 minutes.",
          Serve the salmon on rice with broccoli and the pan sauce.]
sheet_pan_salmon_asparagus:
  kcal: 500
  tags: [special]
  steps: [Heat the oven to 425°F., "Slice the potatoes thinly, toss with oil and roast 15 minutes.",
          "Add the salmon and asparagus to the pan with oil, salt and pepper.", "Roast 12 minutes more.",
          Finish with lemon.]
fish_tacos:
  kcal: 520
  tags: [party]
  steps: ["Cut the cod into strips; dip in beaten egg, then breadcrumbs.", "Pan-fry in a little oil 2–3 minutes a side.",
          "Shred the lettuce and toss with lemon juice for a quick slaw.", "Fill warm tortillas with fish, slaw and salsa."]
shrimp_curry:
  kcal: 560
  steps: ["Start the rice.", "Fry the curry paste in a little oil for 1 minute.",
          "Add the coconut milk and sliced peppers; simmer 5 minutes.", "Add the shrimp; cook 3–4 minutes until pink.",
          "Tear in the basil and serve over rice."]
chicken_satay:
  kcal: 610
  steps: ["Start the rice.", "Whisk the peanut butter, soy sauce, lemon juice and a little hot water into a sauce.",
