breakfast_for_dinner:
  kcal: 540
  meals: [dinner, breakfast]
  steps: ["Cook the bacon in a pan or the oven.", "Scramble the eggs gently in butter.", Make toast., Serve with the berries.]
pumpkin_chili:
  kcal: 420
  meals: [dinner, lunch]
