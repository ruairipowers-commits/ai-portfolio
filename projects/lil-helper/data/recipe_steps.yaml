# Cooking steps, estimated calories per serving, extra meals and occasion tags for the book's recipes.
# Steps are written for this project. Calories are rough estimates for an adult portion (kcal); check labels if it
# matters. `meals` lists every meal a recipe suits (the first is its main one); `tags` add to recipes.yaml's tags.
sheet_pan_chicken_veg:
  kcal: 420
  steps: [Heat the oven to 425°F., "Cut the chicken into strips; halve the green beans and slice the carrots.",
          "Toss everything on a sheet pan with the oil, garlic, salt and pepper.",
          "Roast 25 minutes, turning once, until the chicken is cooked through.", Squeeze lemon over and serve.]
roast_chicken_potatoes:
  kcal: 560
  tags: [festive]
  steps: [Heat the oven to 425°F. Pat the chicken dry and rub with oil, salt and pepper.,
          "Put the lemon halves and garlic inside the chicken.",
          "Cut the potatoes and carrots into chunks, toss with oil and spread around the chicken.",
          "Roast about 1¼ hours, until the juices run clear (165°F in the thigh).",
          "Rest 10 minutes, carve, and save the carcass for stock."]
chicken_tacos:
  kcal: 480
  tags: [party]
  steps: ["Slice the chicken thighs and toss with the taco seasoning.", "Cook in a hot pan 6–8 minutes until browned.",
          "Warm the tortillas; shred the lettuce and grate the cheese.",
          "Fill the tortillas with chicken, lettuce, cheese and salsa; squeeze over a little lime or lemon."]
black_bean_tacos:
  kcal: 430
  tags: [party]
  steps: ["Cube the sweet potatoes and roast at 425°F for 20 minutes.", "Warm the black beans with a pinch of salt.",
          "Mash the avocado; chop the cilantro.", "Warm the tortillas and fill with potatoes, beans, avocado and salsa."]
turkey_chili:
  kcal: 450
  tags: [party]
  meals: [dinner, lunch]
  steps: ["Brown the turkey with the diced onion and pepper, 8 minutes.",
          "Add the beans, tomatoes and a spoonful each of chili powder and cumin.", "Simmer 30–40 minutes, stirring now and then.",
          "Serve topped with grated cheddar. Freezes well."]
beef_bolognese:
  kcal: 620
  meals: [dinner, lunch]
  steps: ["Soften the diced onion, carrot and garlic in a little oil, 8 minutes.", "Add the beef and brown it, breaking it up.",
          "Pour in the tomatoes, season, and simmer 30 minutes.", "Cook the pasta; toss with the sauce and top with parmesan."]
turkey_meatballs:
  kcal: 560
  steps: [Heat the oven to 400°F., "Mix the turkey, breadcrumbs, egg, a little parmesan, salt and pepper; roll into balls.",
