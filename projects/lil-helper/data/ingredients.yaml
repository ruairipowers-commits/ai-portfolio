# Hidden sources: words in a recipe or ingredient name that mean an allergen even when the ingredient isn't listed
# with it (a model's suggestion, a store's product name). Matched as whole words, case-insensitive.
hidden_allergens:
  peanut:    [peanut, peanuts, satay, groundnut, "pad thai", "kung pao", "monkey bread"]
  tree_nut:  [almond, almonds, walnut, walnuts, pecan, pecans, cashew, cashews, pistachio, hazelnut, pesto,
              "pine nut", "pine nuts", praline, marzipan, nutella, macadamia]
  dairy:     [milk, butter, cheese, cream, yogurt, ghee, whey, casein, alfredo, ricotta, parmesan, mozzarella]
  egg:       [egg, eggs, mayonnaise, mayo, aioli, meringue, frittata, quiche, carbonara]
  gluten:    [wheat, flour, bread, pasta, couscous, barley, rye, seitan, breadcrumbs, panko, tortilla, noodles]
  soy:       [soy, tofu, edamame, miso, tempeh, tamari]
  fish:      [salmon, cod, tuna, anchovy, anchovies, "fish sauce", worcestershire, tilapia, halibut]
  shellfish: [shrimp, prawn, prawns, crab, lobster, scallop, scallops, "curry paste", "oyster sauce"]
  sesame:    [sesame, tahini, hummus, "everything bagel", "everything seasoning"]

# Never for a dog, in any amount, cooked or not (ASPCA / vet guidance). Words, matched as whole words.
dog_toxic_words: [grape, grapes, raisin, raisins, sultana, currant, onion, onions, garlic, chive, chives, leek, leeks,
                  scallion, scallions, shallot, chocolate, cocoa, xylitol, macadamia, avocado, alcohol, wine, beer,
                  coffee, caffeine, "cooked bones", "nutmeg"]

# Phrases that look like an allergen word but aren't (removed before matching): coconut milk isn't dairy,
# peanut butter isn't dairy, gluten-free pasta isn't gluten. Over-flagging is the safe side; these keep it sane.
hidden_exceptions:
  dairy:  ["peanut butter", "almond butter", "seed butter", "sunflower butter", "sunbutter", "sunflower seed butter", "nut butter", "coconut milk",
           "oat milk", "almond milk", "soy milk", "coconut cream", "cream of tartar", "cocoa butter", "apple butter",
           "butternut"]
  gluten: ["gluten free", "gluten free pasta", "gluten free bread", "corn tortillas", "rice noodles"]
  egg:    ["eggplant", "egg free"]
