# Starter recipe book (written for this project). A household adds its own in the app, imports a recipe page
# (schema.org Recipe) or a Paprika export, or accepts a model's suggestion that passes the checks.
#   meal       breakfast | lunch | dinner
#   active     minutes of hands-on work; total = active + unattended (oven, simmer)
#   ing        ingredient id → amount per serving, in the ingredient's unit
#   veg        vegetable/fruit servings per portion; protein grams per portion (rough)
#   tags       vegetarian, kid_friendly, batch (cook ahead on a prep day), leftovers (makes next-day lunch),
#              fried, processed, sheet_pan, one_pot, slow_cooker
#   dog        ingredients that can be set aside plain (before seasoning) for the dog; checked against the toxic list
