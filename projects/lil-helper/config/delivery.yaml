# Delivery and pickup services a household can use. DinnerPeace hands lists to them; it never places an order.
#   kinds      grocery (a shopping list) | takeout (a takeout night)
#   membership the membership (config/money.yaml) that waives fees on this service
#   handoff    instacart = a shopping-list link through the Instacart Developer Platform (when INSTACART_API_KEY is set);
#              link = open the service with the list shared or copied (no public list API exists)
#   url        where "Open" goes; the list goes with the share sheet or the clipboard
# Fees, minimums and prices change: each service's membership terms carry the date they were checked.
services:
  instacart:
    name: Instacart
    kinds: [grocery]
    membership: instacart_plus
    handoff: instacart
    url: https://www.instacart.com/store
    note: "Costco, Stop & Shop and many local stores; Instacart picks the store shown"
  amazon:
    name: Amazon (Whole Foods and Fresh)
    kinds: [grocery]
    membership: amazon_prime
    handoff: link
    url: https://www.amazon.com/alm/storefront
  doordash:
    name: DoorDash
    kinds: [grocery, takeout]
    membership: dashpass
    handoff: link
    url: https://www.doordash.com/
    note: "Groceries from partner stores and DashMart; restaurants for takeout nights"
  uber_eats:
    name: Uber Eats
    kinds: [grocery, takeout]
    membership: uber_one
    handoff: link
    url: https://www.ubereats.com/
    note: "Uber Cash from some cards (e.g. Amex Platinum) applies here"
  walmart:
    name: Walmart
    kinds: [grocery]
    membership: walmart_plus
    handoff: link
    url: https://www.walmart.com/cp/food/976759
  grubhub:
    name: Grubhub
    kinds: [takeout]
    membership: grubhub_plus
    handoff: link
    url: https://www.grubhub.com/
