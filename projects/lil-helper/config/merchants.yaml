# How card-statement descriptions map to stores and spending categories. Only rows that match a rule here are
# imported; everything else on a statement (other shopping, bills, payments) is skipped and never stored.
# Patterns are case-insensitive regular expressions matched against the description.
#   category   groceries | takeout | eat_out
rules:
  - {pattern: 'WHOLE ?FDS|WHOLE FOODS',                 store: whole_foods,   category: groceries, label: Whole Foods}
  - {pattern: "TRADER JOE",                             store: trader_joes,   category: groceries, label: Trader Joe's}
  - {pattern: 'COSTCO WHSE|COSTCO\.COM|WWW COSTCO',     store: costco,        category: groceries, label: Costco}
  - {pattern: 'STOP ?& ?SHOP|STOP AND SHOP',            store: stop_and_shop, category: groceries, label: Stop & Shop}
  - {pattern: 'INSTACART',                              store: instacart,     category: groceries, label: Instacart}
  - {pattern: 'AMAZON ?FRESH|AMZN ?FRESH|AMAZON GROCERY', store: amazon,      category: groceries, label: Amazon grocery}
  - {pattern: 'UBER ?\*? ?EATS',                        store: uber_eats,     category: takeout,   label: Uber Eats}
  - {pattern: 'DOORDASH|DD \*DOORDASH',                 store: doordash,      category: takeout,   label: DoorDash}
  - {pattern: 'GRUBHUB|SEAMLESS',                       store: grubhub,       category: takeout,   label: Grubhub}
# Statement "Category" columns that mean eating out, when no rule above matched (Amex exports have one).
category_column:
  eat_out: ['^Restaurant']
# Never import these even if a rule matches (fuel at Costco, returns of payments).
skip: ['COSTCO GAS', 'PAYMENT', 'AUTOPAY', 'THANK YOU']
