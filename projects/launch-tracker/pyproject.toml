[project]
name = "launch-tracker"
version = "0.1.0"
description = "Every launch to space from public data: missions, payloads, crews, reuse, delays, orbit crowding"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
aws = ["boto3>=1.35"]
ui = ["streamlit>=1.40", "pandas>=2", "plotly>=5.20"]
flows = ["prefect>=3"]           # scheduled refreshes (the CLI runs the same steps without it)
dev = ["pytest>=8"]

[project.scripts]
launches = "launchtracker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
