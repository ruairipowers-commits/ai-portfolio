# EVAL-03 / SEC-06: every push runs unit tests, the offline end-to-end run, the eval gate (mock model, $0)
# and a dependency vulnerability scan. No network calls to the launch sources: CI runs on the fictional sample.
name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    env: {GOVERNANCE_TELEMETRY: "off"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[ui,dev]" pip-audit
      - run: pytest -q
      - run: launches all && launches eval
      - run: pip-audit --skip-editable || true   # report-only; make blocking once triaged
      - uses: actions/upload-artifact@v4
        with: {name: evals, path: output/}
