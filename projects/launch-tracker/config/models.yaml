# MODEL-01 Model registry. Code only ever references ALIASES.
# The model only writes summaries from facts it is given; it never decides a number. A small model is enough.
# To migrate: point summary-candidate at the new model, run
#   launches eval --alias summary-candidate --baseline summary-primary
# and, if the gate passes, `launches promote summary-primary <model>`.
# Pricing is USD per million tokens; a model with null pricing is refused unless cost.allow_unpriced_models=true.

aliases:
  summary-primary: mock-local
  summary-fallback: mock-local
  summary-candidate: mock-local

models:
  mock-local:              # deterministic offline stand-in, no keys
    provider: mock
    model_id: mock-summary-v1
    input_per_mtok: 1.00   # simulated, so the cost report has numbers to show
    output_per_mtok: 5.00
    deprecation_date: null
    approved: true

  local-qwen:              # local open model on the EVO-X1 through Ollama ($0 per token)
    provider: ollama
    model_id: qwen3:14b    # override with OLLAMA_MODEL
    input_per_mtok: 0.0
    output_per_mtok: 0.0
    deprecation_date: null
    approved: true

  claude-haiku:
    provider: anthropic
    model_id: claude-haiku-4-5-20251001
    input_per_mtok: null   # fill from anthropic.com/pricing
    output_per_mtok: null
    deprecation_date: null
    approved: true         # SEC-05: only approved models can be resolved

  claude-sonnet:
    provider: anthropic
    model_id: claude-sonnet-5-5
    input_per_mtok: null
    output_per_mtok: null
    deprecation_date: null
    approved: true

  openai-default:
    provider: openai
    model_id: "SET-CURRENT-OPENAI-MODEL-ID"
    input_per_mtok: null
    output_per_mtok: null
    deprecation_date: null
    approved: false        # flip after review of provider terms

  bedrock-claude:
    provider: bedrock
    model_id: "SET-BEDROCK-MODEL-OR-INFERENCE-PROFILE-ID"
    region: us-east-1
    input_per_mtok: null
    output_per_mtok: null
    deprecation_date: null
    approved: true
