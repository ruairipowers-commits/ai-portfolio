# Seed catalog for the offline demo.
# REAL: the Hugging Face publishers and datasets (ids, licence tags, descriptions, URLs) — from the Hub on 4 Oct 2026.
# SYNTHETIC (labelled synthetic: true): the five commercial vendors and their datasets, prices, the three buyer
# firms, their contracts, the data owner, and the factor ↔ sector sensitivities. All names are fictional and all
# fictional websites use example.com.

custom_fields:          # operator-defined fields (FR-1); bind_to links a field to an ontology property or concept
  - {entity: vendor, key: sales_contact_region, label: "Sales contact region", type: enum, options: [Americas, EMEA, APAC]}
  - {entity: vendor, key: soc2, label: "SOC 2 report on file", type: bool}
  - {entity: vendor, key: due_diligence_date, label: "Last due diligence", type: date}
  - {entity: dataset, key: point_in_time, label: "Point-in-time history", type: bool}
  - {entity: dataset, key: trial_available, label: "Trial available", type: bool}
  - {entity: dataset, key: alpha_horizon, label: "Typical signal horizon", type: enum, options: [intraday, days, weeks, months]}
  - {entity: dataset, key: primary_identifier, label: "Primary identifier", type: text, bind_to: "v:Ticker"}

