datasets:
  - id: ds-options-iv
    vendor: v-gauss314
    title: S&P 500 options implied volatility
    hub_id: gauss314/options-IV-SP500
    description: Daily per-symbol options summary for S&P 500 stocks — implied volatility by moneyness, historical volatility (20–200 days), call/put volume and open interest, VIX.
    category: v:OptionsVolatility
    licence: apache-2.0
    delivery: file
    formats: [parquet, csv]
    frequency: daily
    price_model: free
    coverage: {asset_class: equity options, region: US, universe: S&P 500}
    identifiers: [v:Ticker]
    listed_on: [huggingface]
    dictionary_source: "hub:gauss314/options-IV-SP500"        # card features → parsed by code
    custom: {point_in_time: true, trial_available: true, alpha_horizon: days, primary_identifier: symbol}
  - id: ds-constituents
    vendor: v-jwigginton
    title: S&P 500 index constituents
    hub_id: jwigginton/index-constituents-sp500
    description: S&P 500 constituents with GICS sector and sub-industry, headquarters, date added, CIK and year founded.
    category: v:ReferenceData
    licence: none
    card_claims: "Free for commercial use."          # card text; the Hub licence tag says none → legal review (p02 / adversarial)
    delivery: file
    formats: [parquet]
    frequency: ad hoc
    price_model: free
    coverage: {asset_class: equity, region: US, universe: S&P 500}
    identifiers: [v:Ticker, v:CIK]
    listed_on: [huggingface]
    dictionary_source: "columns:symbol,security,gics_sector,gics_sub_industry,headquarters_location,date_added,cik,founded"
  - id: ds-edgar-10k
    vendor: v-jlohding
    title: S&P 500 EDGAR 10-K filings
    hub_id: jlohding/sp500-edgar-10k
    description: Annual reports for S&P 500 historical constituents, 2010–2022, from SEC EDGAR Form 10-K filings.
    category: v:Filings
    licence: mit
    delivery: file
    formats: [parquet]
    frequency: annual
    price_model: free
    coverage: {asset_class: equity, region: US, universe: S&P 500, history_start: "2010-01-01"}
    identifiers: [v:Ticker, v:CIK]
    listed_on: [huggingface]
  - id: ds-10k-markdown
    vendor: v-bee-spoke
    title: S&P 500 10-K filings in markdown
    hub_id: BEE-spoke-data/sp500-edgar-10k-markdown
    description: S&P 500 EDGAR 10-K filings converted to markdown, with stock returns.
    category: v:Filings
    licence: odc-by
    delivery: file
    formats: [parquet]
    frequency: annual
    price_model: free
    coverage: {asset_class: equity, region: US, universe: S&P 500}
    identifiers: [v:Ticker]
    listed_on: [huggingface]
    substitute_for: [ds-edgar-10k]
  - id: ds-10q
    vendor: v-kurry
    title: S&P 500 constituents 10-Q filings
    hub_id: kurry/sp500_constituents_10q
    description: Quarterly 10-Q reports for S&P 500 constituents (10,488 filings, full text).
    category: v:Filings
    licence: apache-2.0
    delivery: file
    formats: [parquet]
    frequency: quarterly
    price_model: free
    coverage: {asset_class: equity, region: US, universe: S&P 500, history_start: "1996-01-01"}
    identifiers: [v:Ticker]
    listed_on: [huggingface]
  - id: ds-nl-volsurface
    synthetic: true
    vendor: v-northlight
    title: Northlight equity volatility surface
    description: End-of-day implied volatility surfaces for US single names, with term structure and skew, and an API.
    category: v:OptionsVolatility
    licence: proprietary
    delivery: api
    formats: [json, parquet]
    frequency: daily
    price_model: subscription
    list_price_usd: 48000
    coverage: {asset_class: equity options, region: US, universe: Russell 1000, sectors: all, history_start: "2012-01-01"}
    identifiers: [v:Ticker, v:ISIN]
    listed_on: [snowflake]
    substitute_for: [ds-options-iv]
    dictionary_source: "openapi:data/seed/sources/northlight_openapi.json"
    custom: {point_in_time: true, trial_available: true, alpha_horizon: days}
  - id: ds-port-congestion
    synthetic: true
    vendor: v-tidewater
    title: Tidewater port congestion index
    description: Daily vessel-queue and dwell-time index for 40 container ports, mapped to listed shippers, retailers and industrials.
    category: v:Shipping
    licence: proprietary
    delivery: file
    formats: [csv]
    frequency: daily
    price_model: subscription
    list_price_usd: 36000
    coverage: {asset_class: equity, region: Global, sectors: [Industrials, Consumer Discretionary, Consumer Staples], history_start: "2018-01-01"}
    identifiers: [v:Ticker]
    listed_on: [aws_data_exchange]
    custom: {point_in_time: true, alpha_horizon: weeks}
  - id: ds-card-panel
    synthetic: true
    vendor: v-meridian
    title: Meridian consumer card panel
    description: Aggregated, anonymised card spend by merchant, mapped to tickers; weekly.
    category: v:Transactions
    licence: proprietary
    delivery: file
    formats: [parquet]
    frequency: weekly
    price_model: subscription
    list_price_usd: 90000
    coverage: {asset_class: equity, region: US, sectors: [Consumer Discretionary, Consumer Staples], history_start: "2019-01-01"}
    identifiers: [v:Ticker]
    listed_on: [databricks]
    dictionary_source: "csv:data/seed/sources/meridian_dictionary.csv"
    custom: {point_in_time: false, alpha_horizon: weeks}
  - id: ds-job-postings
    synthetic: true
    vendor: v-larkspur
    title: Larkspur job postings
    description: Company job postings scraped daily and mapped to tickers.
    category: v:Labour
    licence: proprietary
    delivery: api
    formats: [json]
    frequency: daily
    price_model: subscription
    list_price_usd: 24000
    coverage: {asset_class: equity, region: US, sectors: all, history_start: "2020-06-01"}
    identifiers: [v:Ticker]
    listed_on: []
  - id: ds-rates-curve
    synthetic: true
    vendor: v-copperline
    title: Copperline rates curve
    description: Daily government and swap curves with forward-rate and policy-path estimates.
    category: v:Rates
    licence: proprietary
    delivery: file
    formats: [csv]
    frequency: daily
    price_model: subscription
    list_price_usd: 12000
    coverage: {asset_class: rates, region: US, sectors: [Financials, Real Estate, Utilities], history_start: "2005-01-01"}
    identifiers: [v:ObservationDate]
    listed_on: []

