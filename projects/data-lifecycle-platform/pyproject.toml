[project]
name = "data-lifecycle-platform"
version = "0.1.0"
description = "Data marketplace and lifecycle platform: ontology, knowledge graph, semantic layer and context layer kept apart"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "duckdb>=1.1,<2",
  "dbt-duckdb>=1.9,<2",
  "dbt-metricflow[dbt-duckdb]>=0.11",
  "rdflib>=7,<8",
  "pyshacl>=0.26",
  "pyoxigraph>=0.4,<0.6",
  "sqlmodel>=0.0.22",
  "pandas>=2",
  "pyarrow>=15",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
aws = ["boto3>=1.35"]
hub = ["huggingface_hub>=0.24"]            # live Hugging Face marketplace + `dlp fetch`
api = ["fastapi>=0.110", "uvicorn>=0.29"]
mcp = ["mcp>=2,<3"]
orchestration = ["dagster>=1.8"]
ui = ["streamlit>=1.40"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "mcp>=2,<3", "dagster>=1.8"]

[project.scripts]
dlp = "dlp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
