# EVAL-03 / SEC-06: every push runs the unit and layer-boundary tests, the offline end-to-end build, the eval gate
# (mock model, $0) and a dependency scan.
name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    env: {GOVERNANCE_TELEMETRY: "off"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[ui,dev,api,mcp,orchestration]" pip-audit
      - run: pytest -q
      - run: dlp all && dlp ontology check
      - run: dlp models-check || true            # deprecation warnings don't fail the build
      - run: pip-audit --skip-editable || true   # report-only; make blocking once triaged
      - uses: actions/upload-artifact@v4
        with: {name: eval-and-build, path: output/}
