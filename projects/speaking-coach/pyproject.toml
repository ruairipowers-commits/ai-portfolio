[project]
name = "speaking-coach"
version = "0.1.0"
description = "Find your filler words in any transcript, against your own word list, with rewrites without them"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
aws = ["boto3>=1.35"]
local = ["httpx>=0.27"]          # Ollama on your own machine
ui = ["streamlit>=1.40", "pandas>=2"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
coach = "speakingcoach.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
