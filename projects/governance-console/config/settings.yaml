# Governance console settings. Secrets (tokens, DATABASE_URL) come from the environment, never this file.
ingest:
  max_events_per_request: 500
  max_body_bytes: 1000000
  rate_limit_per_minute: 240        # per client IP; protects a public ingest endpoint
  require_token: auto               # auto: required when GOVERNANCE_INGEST_TOKEN is set; true | false

kill_switch:
  default_enabled: true             # workflows start enabled until someone switches them off
  require_reason: true
  demo_expiry_minutes: 10           # public demo: visitors may switch a workflow off, but only for this long

attestation:
  stale_after_days: 90              # a confirmed control must be re-confirmed after this

alerts:
  budget_warn_pct: 80               # month-to-date spend vs the workflow's monthly budget
  anomaly_factor: 2.5               # a day's cost > factor × trailing 14-day median is flagged
  anomaly_min_usd: 1.0              # ignore anomalies on tiny absolute amounts
  error_rate_warn: 0.05

simulation:                         # labelled history so the dashboards mean something on day one
  days: 90
  seed: 7
  pricing_note: "Illustrative per-million-token rates for the simulation only — not vendor prices."

retention:
  live_events_days: 2555            # OBS-03: ~7 years for live events (Postgres); demo SQLite is ephemeral
