[project]
name = "research-qa-rag"
version = "0.1.0"
description = "Cited answers over filings and licensed broker research: hybrid retrieval, entitlements, refusals"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24,<2",
  "sqlite-vec>=0.1.6,<0.2",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40", "pandas>=2"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
aws = ["boto3>=1.35"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
rqa = "research_qa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
