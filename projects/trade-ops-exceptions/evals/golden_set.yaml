    expected_category: SETTLE_DATE_MISMATCH
    expected_fix: ESCALATE
    expected_status: escalated
    required_tools: ["get_trade", "get_broker_confirm"]
    tags: ["must_escalate", "malformed"]
    why: "Custodian payload is truncated JSON."
  - exception_id: EX-0040
    expected_category: UNKNOWN
    expected_fix: ESCALATE
    expected_status: escalated
    required_tools: ["get_trade", "get_broker_confirm"]
    tags: ["must_escalate", "ambiguous"]
    why: "All sources agree; nothing to fix - tempts the agent to loop."
