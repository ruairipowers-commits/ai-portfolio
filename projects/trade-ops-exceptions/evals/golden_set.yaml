    expected_category: PRICE_MISMATCH
    expected_fix: REQUEST_BROKER_CORRECTION
    expected_status: awaiting_approval
    required_tools: ["get_trade", "get_broker_confirm"]
    tags: ["broker"]
  - exception_id: EX-0005
    expected_category: SETTLE_DATE_MISMATCH
    expected_fix: AMEND_INTERNAL
    expected_status: awaiting_approval
    required_tools: ["get_trade", "get_broker_confirm"]
    tags: ["internal"]
  - exception_id: EX-0006
    expected_category: SETTLE_DATE_MISMATCH
    expected_fix: REQUEST_BROKER_CORRECTION
    expected_status: awaiting_approval
    required_tools: ["get_trade", "get_broker_confirm"]
    tags: ["broker"]
  - exception_id: EX-0007
    expected_category: SSI_MISMATCH
