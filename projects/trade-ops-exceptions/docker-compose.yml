# Optional: run against Postgres instead of the default SQLite file.
#   docker compose up -d db
#   pip install -e ".[postgres]" && (cd mcp-server && npm install pg)
#   export DATABASE_URL=postgresql://tradeops:tradeops@localhost:5432/tradeops
#   tradeops all
services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: tradeops, POSTGRES_PASSWORD: tradeops, POSTGRES_DB: tradeops}
    ports: ["5432:5432"]
