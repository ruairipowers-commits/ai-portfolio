[project]
name = "tradeops-exceptions"
version = "0.1.0"
description = "Tool-calling agent (LangGraph + MCP) that investigates settlement breaks and waits for human approval"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain-core>=1.0,<2",
  "langchain-mcp-adapters>=0.2,<0.4",
  "mcp>=1.20,<2",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]
anthropic = ["langchain-anthropic>=1.0"]
openai = ["langchain-openai>=1.0"]
aws = ["langchain-aws>=1.0"]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
tradeops = "tradeops.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
