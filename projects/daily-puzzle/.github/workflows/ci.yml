# EVAL-03 / SEC-06: every push runs the tests (including the sandbox and integrity tests), the offline end-to-end
# demo, the eval gate (mock models, zero cost) and a dependency vulnerability scan.
name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -e ".[dev]" pip-audit
      - run: pytest -q
      - run: puzzle all
      - run: pip-audit --skip-editable || true   # report-only; make blocking once triaged
      - uses: actions/upload-artifact@v4
        with: {name: puzzle-output, path: output/}
  # Optional weekly live eval of a real solver/generator. Needs the secret and pricing in config/models.yaml.
  live-eval:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[anthropic]"
      - run: puzzle eval --role solver --alias puzzle-candidate && puzzle eval --role generator --alias puzzle-candidate
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
