[project]
name = "daily-puzzle"
version = "0.1.0"
description = "Daily AI puzzle agents: a generator and a blind solver publish one verified, educational puzzle a day; code grades attempts and keeps a fair leaderboard"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "pyyaml>=6,<7",
  "pydantic>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9",
  "markdown-it-py>=3,<5",
  "apscheduler>=3.10,<4",
  "cryptography>=42",
  "httpx>=0.27,<1",
  "numpy>=1.26",
  "safetensors>=0.4",
  "weasyprint>=61",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40", "pandas>=2.1"]
dev = ["pytest>=8", "pypdf>=4", "streamlit>=1.40", "pandas>=2.1"]
hub = ["huggingface_hub>=0.24"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
aws = ["boto3>=1.34"]

[project.scripts]
puzzle = "daily_puzzle.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
daily_puzzle = ["templates/*", "static/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:PUZZLE_SALT not set", "ignore:PUZZLE_KEY_SECRET not set"]
