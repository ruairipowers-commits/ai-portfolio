# Runtime + governance settings. Every key here is referenced in docs/governance.md.
# What puzzles get made lives in config/puzzles.yaml. Secrets come from the environment, never this file.
workflow:
  name: Daily puzzle
  owner: Ruairi Powers
risk_tier: medium              # HITL-01: public app, stores emails, runs model-written code (sandboxed)

database_url: sqlite:///warehouse/puzzle.db   # env DATABASE_URL wins (Postgres works with the same tables)

llm:
  generator_alias: puzzle-generator   # MODEL-01: aliases resolve in config/models.yaml
  solver_alias: puzzle-solver         # a different model, blind to the answer
  fallback_alias: puzzle-fallback     # MODEL-05
  generator_prompt: prompts/generator.v1.md   # MODEL-04: versioned files, hash logged per call
  solver_prompt: prompts/solver.v1.md
  max_output_tokens: 2500
  retries: 2

cost:                                 # COST-01..04
  max_usd_per_run: 0.10               # one day's generation + verification (NFR-4)
  max_input_tokens_per_call: 6000
  monthly_alert_usd: 3.00
  allow_unpriced_models: false

content:                              # SEC-04 / compliance: checks on every generated puzzle
  max_statement_chars: 3000
  blocked_terms_file: config/blocked_terms.txt
  max_quoted_words: 25                # longer quotations look like copied text → reject

limits:                               # NFR-5
  submissions_per_minute_per_ip: 20
  submissions_per_minute_per_player: 10
  signups_per_hour_per_ip: 5
  signin_links_per_hour_per_email: 3
  magic_link_minutes: 30

privacy:
  retention_days: 730                 # OBS-03: attempts and audit rows older than this are deleted (`puzzle retention`)
  leaderboard_shows: handle           # never the email address

eval:                                 # EVAL-02 thresholds; MODEL-02 gate
  golden_set: evals/golden_set.yaml
  min_verifier_accuracy: 1.00         # every golden generation case decided correctly
  min_must_reject_recall: 1.00        # no ambiguous / wrong / non-reproducible / unlicensed puzzle gets through
  min_grading_accuracy: 1.00
  min_schema_valid_rate: 1.00
  min_generation_pass_rate: 0.60      # share of fresh puzzles (one per kind) that pass verification first time
  min_learning_fields_rate: 1.00      # coding / AI puzzles with objective, tags and worked solution
  max_total_cost_usd: 0.50

governance:
  deprecation_warning_days: 90        # MODEL-03
  operator_email_env: PUZZLE_OPERATOR_EMAIL   # escalations go here (env var name, not the address)
