# What puzzles this instance makes. Everything here is meant to be edited by whoever runs it.
# The operator app (`puzzle ui`) edits this file too; `puzzle config-check` validates it.

tracks:                      # turn a track off with enabled: false; weight is used on random days
  logic:
    enabled: true
    weight: 1
    kinds: [knights-knaves, ordering]
  word:
    enabled: true
    weight: 1
    kinds: [cipher, anagram]
  numbers:
    enabled: true
    weight: 1
    kinds: [sequence, combinatorics]
  coding:
    enabled: true
    weight: 1
    sandbox: true            # the answer is checked by running code
    kinds: [python-output, data-wrangling]
  ai_ml:
    enabled: true
    weight: 1
    sandbox: true
    kinds: [weights-inspection, tiny-finetune, embeddings]

rotation:
  mode: weekday              # weekday | random
  weekday:                   # Monday … Sunday; "random" picks by weight from the enabled tracks
    mon: logic
    tue: word
    wed: numbers
    thu: coding
    fri: ai_ml
    sat: random
    sun: random

difficulty:                  # easy | medium | hard, per weekday (a track-specific value wins)
  weekday: {mon: easy, tue: easy, wed: medium, thu: medium, fri: medium, sat: hard, sun: medium}
  by_track: {}               # e.g. {ai_ml: medium}
  target_solve_rate: {easy: 0.8, medium: 0.55, hard: 0.3}   # told to the generator; reported in `puzzle stats`

learning:                    # coding and AI/ML puzzles must teach something
  require_objective_for: [coding, ai_ml]
  require_worked_solution: true
  min_skill_tags: 1

data_sources:                # public data a puzzle may use. Anything else is rejected (DATA-04).
  allowed_licenses: [apache-2.0, mit, cc-by-4.0, cc0-1.0, bsd-3-clause]
  allowed_file_types: [.safetensors, .csv, .json, .txt, .parquet]   # no pickle (.bin, .pt, .pkl, .ckpt)
  max_mb: 200
  pin_revisions: true        # the resolved commit is stored with the puzzle so the answer reproduces
  assets:
    # Bundled fixtures: tiny files generated by scripts/generate_fixtures.py, so CI and the offline demo need no network.
    - id: fixture/tiny-mlp
      kind: model
      license: mit
      files: [model.safetensors]
      source: fixture
    - id: fixture/flowers
      kind: dataset
      license: cc0-1.0
      files: [flowers.csv]
      source: fixture
    - id: fixture/word-vectors
      kind: model
      license: mit
      files: [vectors.safetensors, vocab.txt]
      source: fixture
    # Hugging Face Hub (live mode). The licence on the Hub must match the one here or the puzzle is rejected;
    # files are fetched by trusted code before the sandbox runs (the sandbox itself has no network).
    - id: prajjwal1/bert-tiny
      kind: model
      license: mit
      files: [config.json, vocab.txt]   # config and vocabulary only; a .bin (pickle) weights file is refused anyway
      source: huggingface
    - id: sentence-transformers/all-MiniLM-L6-v2
      kind: model
      license: apache-2.0
      files: [model.safetensors, config.json, vocab.txt]
      source: huggingface

sandbox:                     # where puzzle code runs (generator's reference code and the solver's own code)
  backend: subprocess        # subprocess (isolated Python, rlimits, guard hooks, no network). docker: documented option
  timeout_s: 300             # NFR: ≤ 5 min
  memory_mb: 4096
  max_output_kb: 64
  reproducibility_runs: 2    # reference code runs this many times; every result must agree

window:                      # when submissions are open
  timezone: America/New_York
  generate_at: "03:00"
  open_at: "07:00"
  close_at: "23:59"
  reveal_after_min: 5

attempts:
  max_per_puzzle: 6

scoring:                     # points = round(base × decay^(attempts − 1)), at least floor while solved; 0 unsolved
  base: 100
  decay: 0.7
  floor: 10
  track_multiplier: {}       # e.g. {ai_ml: 1.5}

generation:
  max_rounds: 3              # regenerate this many times before escalating to a human and using a reserve puzzle
  dedup_days: 365
  require_distinct_models: true   # generator and solver must be different models (warns if both are mock)

packs:                       # one-off puzzle packs (questions PDF + answer-key PDF)
  who: operator              # operator | players (signed-in players, within the quota)
  player_daily_quota: 1
  max_puzzles: 12
  default_count: 5
  default_tracks: random     # random, or a list like [logic, coding]
  title: "Puzzle pack"
  footer: "Generated and independently verified by the daily-puzzle agents"

players:
  handle_max_len: 24
  default_tracks: [logic, word, numbers, coding, ai_ml]
