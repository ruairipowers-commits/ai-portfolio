[project]
name = "editorial-agents"
version = "0.1.0"
description = "Editorial agents: a topic scout ranks AI topics by engagement and novelty across market sectors; a writer and an independent editor draft a weekly post; a human merge publishes it"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "pyyaml>=6,<7",
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9",   # FastAPI Form() needs it at request time
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ui = []

[project.scripts]
editorial = "editorial.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
