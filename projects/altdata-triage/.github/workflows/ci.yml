# EVAL-03 / SEC-06: every push runs unit tests, the offline end-to-end pipeline,
# the eval gate (mock model, zero cost) and a dependency vulnerability scan.
name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[ui,dev]" pip-audit
      - run: pytest -q
      - run: altdata-triage all && altdata-triage eval
      - run: pip-audit --skip-editable || true   # report-only; make blocking once triaged
      - uses: actions/upload-artifact@v4
        with: {name: triage-output, path: output/}
  # Optional live eval against a real model (weekly). Needs ANTHROPIC_API_KEY secret
  # and pricing filled in config/models.yaml.
  live-eval:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[anthropic]"
      - run: altdata-triage all && altdata-triage eval --alias triage-candidate --baseline triage-primary
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
