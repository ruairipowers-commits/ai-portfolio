[project]
name = "event-backtester"
version = "0.1.0"
description = "Event-driven tick backtester with C++ kernels, a code-computed promotion gate and governed research memos"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2,<3",
  "pyarrow>=15",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
aws = ["boto3>=1.35"]
ui = ["streamlit>=1.45", "plotly>=5.20", "matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
event-backtester = "event_backtester.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
