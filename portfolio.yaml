# Portfolio-wide settings. Every generator run reads this first.
author: Ruairi Powers
tagline: "AI solutions for investment firms — governed, measurable, portable."
site_url: https://REPLACE-GITHUB-USER.github.io/ai-portfolio   # set once GitHub Pages is on
github_owner: REPLACE-GITHUB-USER
license: MIT
default_domain: investment management (hedge fund / asset manager operations and research)

defaults:
  language: python 3.11
  run_mode: local-first, offline mock provider, no API keys required to run
  cloud_variant: aws            # every project ships docs/aws-native.md + infra/aws starter
  llm_access: provider-agnostic registry with aliases (mock, anthropic, openai, bedrock)
  ci: github actions (tests + offline end-to-end + eval gate)
  diagrams: mermaid

# Order projects appear on the site.
projects:
  - altdata-triage
  - eod-heartbeat
  - trade-ops-exceptions
  - research-qa-rag
