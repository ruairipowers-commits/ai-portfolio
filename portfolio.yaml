# Portfolio-wide settings. Every generator run reads this first.
author: Ruairi Powers
tagline: "AI solutions for investment firms — governed, measurable, portable."
# Leave these as placeholders in git. They are resolved at build/publish time from:
#   1. env PORTFOLIO_SITE_URL / PORTFOLIO_GITHUB_OWNER (CI sets these from the repo owner;
#      set repo variable SITE_URL for a custom domain), else
#   2. the GitHub CLI login (`gh api user`) for local publishing, else
#   3. these values.
site_url: https://REPLACE-GITHUB-USER.github.io/ai-portfolio
github_owner: REPLACE-GITHUB-USER
# Hugging Face user/org that hosts the live demos (Spaces). Env PORTFOLIO_HF_OWNER (CI: repo variable
# HF_OWNER) wins; if unset, assumed to match the GitHub owner.
hf_owner: REPLACE-HF-USER
license: MIT
default_domain: investment management (hedge fund / asset manager operations and research)

defaults:
  language: python 3.11
  run_mode: local-first, offline mock provider, no API keys required to run
  cloud_variant: aws            # every project ships docs/aws-native.md + infra/aws starter
  llm_access: provider-agnostic registry with aliases (mock, anthropic, openai, bedrock)
  ci: github actions (tests + offline end-to-end + eval gate)
  diagrams: mermaid

# Live demos: where they're hosted. One setting; links on the site, in READMEs and in the apps follow it.
#   selfhost    your own machine via docker compose + a Cloudflare Tunnel (deploy/selfhost)   — free
#   huggingface one Docker Space per app (scripts/build_space.py)                          — needs HF PRO
#   cloudflare  Cloudflare Containers behind a Worker (deploy/cloudflare)                   — Workers Paid
#   cloudrun    Google Cloud Run + a small router service (deploy/cloudrun)                 — free tier, billing on
# Override with repo variable DEMOS_TARGET / env PORTFOLIO_DEMOS_TARGET. For selfhost / cloudflare / cloudrun
# every app lives at <base_url>/<slug>/; set the base URL with repo variable DEMOS_URL (kept out of git).
demos:
  target: selfhost
  base_url: https://REPLACE-DEMOS-HOST

# "Source code" links: the project folder in this repo (monorepo) or its own published repo (standalone).
source_links: monorepo
repo_name: ai-portfolio

# Order projects appear on the site.
projects:
  - altdata-triage
  - eod-heartbeat
  - trade-ops-exceptions
  - research-qa-rag
  - governance-console      # platform: governs the workflows above
  - site-assistant          # the blog's search + chat assistant (personal project)
  - editorial-agents        # topic scout, weekly writer + editor, subscriptions (personal project)
  - daily-puzzle            # daily AI puzzle agents (personal project)

# Which projects are FEATURED (home page + main blog) and which are smaller PERSONAL projects (listed on the
# "Personal projects" page, with posts under site/personal/posts/). Every project above is featured unless it's
# listed here. To move one:  python scripts/set_tier.py <slug> personal   (or featured) — it edits this list and
# moves the project's post. A personal project doesn't need to live in this repo: give a title, summary and link.
personal_projects:
  - site-assistant
  - editorial-agents
  - daily-puzzle
  - title: Loan default prediction (MIT capstone)
    summary: Which home-equity loans will default, and why — an explainable credit model and a parallel-run rollout plan
    pattern: Classical ML (decision trees, random forests)
    stack: Python, pandas, scikit-learn, Google Colab
    url: https://github.com/{{GITHUB_OWNER}}/ai-portfolio/tree/main/coursework/loan-default-prediction
    post: classes/posts/loan-default-capstone.md
    try_url: https://colab.research.google.com/github/{{GITHUB_OWNER}}/ai-portfolio/blob/main/coursework/loan-default-prediction/loan_default_prediction.ipynb
    try_label: Open in Colab (read-only)
    result: "Defaults caught: 61% → 81%"
    result_basis: "logistic-regression baseline → tuned, explainable decision tree; 1,192 held-out loans"
  - title: Private AI workbench (EVO-X1)
    summary: Local models, notebooks and creative tools on a mini PC, with a clear line between what stays home and what reaches the cloud
    pattern: Self-hosted local models + MCP tools
    stack: Ollama, Docker, Jupyter, PostgreSQL, MCP, Tailscale
    post: personal/posts/private-local-ai.md
    result: "Fully local mode: nothing leaves the house"
    result_basis: "and a written line for exactly what the hybrid mode sends to the cloud"
